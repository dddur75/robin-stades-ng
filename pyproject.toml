[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robin-stades-ng"
version = "0.1.0"
description = "Laboratoire reproductible d'analyse statistique du football"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "moteur*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

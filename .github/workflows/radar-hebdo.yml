name: Radar de prix papier 2026-27
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1' # lundi 08:17 Paris en hiver, 09:17 en été
permissions:
  contents: read
  actions: read
concurrency:
  group: radar-papier
  cancel-in-progress: false
jobs:
  radar:
    if: github.repository == 'dddur75/robin-stades-ng'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      API_FOOTBALL_CALLS_ALLOWED: '0'
      REAL_BETS: 'false'
      NO_BET_DEFAULT: 'true'
    steps:
      - name: Fenêtre de quatre semaines
        id: window
        shell: bash
        run: |
          today=$(TZ=Europe/Paris date +%F)
          if [[ "$today" > '2026-10-19' && "$today" < '2026-11-18' ]]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.window.outputs.active == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Dépendances du traitement local
        if: steps.window.outputs.active == 'true'
        run: python -m pip install 'pydantic>=2.9,<2.14' scipy requests
      - name: Lire les rapports normalisés déjà collectés (GitHub uniquement)
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/radar-stock"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("robin-autonomous-lab-")) | select(.created_at >= "2026-10-03" and .expired == false) | .id' \
            > "$RUNNER_TEMP/radar-ids.txt"
          test -s "$RUNNER_TEMP/radar-ids.txt"
          while read -r artifact_id; do
            mkdir -p "$RUNNER_TEMP/radar-stock/$artifact_id"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/radar.zip"
            if unzip -Z1 "$RUNNER_TEMP/radar.zip" | grep -qx 'robin-real-data.json'; then
              unzip -p "$RUNNER_TEMP/radar.zip" robin-real-data.json \
                > "$RUNNER_TEMP/radar-stock/$artifact_id/robin-real-data.json"
            fi
          done < "$RUNNER_TEMP/radar-ids.txt"
      - name: Tests et rapport (aucun réseau pendant le calcul)
        if: steps.window.outputs.active == 'true'
        run: |
          python -m pip install pytest
          python -m pytest -q tests/jalon2/test_clv.py tests/jalon2/test_clv_cumul.py tests/jalon2/test_radar.py tests/jalon2/test_radar_direct.py
          python scripts/radar_hebdo.py --stock "$RUNNER_TEMP/radar-stock" --baseline reports/clv/2026-27
          cp "$RUNNER_TEMP/radar-ids.txt" reports/radar/2026-27/GITHUB-ARTIFACT-IDS.txt
          cat reports/radar/2026-27/RADAR.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.window.outputs.active == 'true'
        with:
          name: radar-papier-${{ github.run_id }}
          path: reports/radar/2026-27/
          retention-days: 35
          if-no-files-found: error

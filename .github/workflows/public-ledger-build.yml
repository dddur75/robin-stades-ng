name: "44 - Public Evidence Ledger Build"
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: pattern-public-ledger
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Restaurer le shadow durable
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_shadow_state.py restore
          --repo "${{ github.repository }}"
          --destination data/shadow
          --current-run-id "${{ github.run_id }}"
      - uses: ./.github/actions/historical-state-restore
      - name: Auditer la chaîne avant build
        shell: bash
        run: |
          mkdir -p artifacts/public-ledger
          mkdir -p data/shadow
          touch data/shadow/pattern-evidence-ledger.jsonl
          python scripts/build_public_ledger.py \
            --ledger data/shadow/pattern-evidence-ledger.jsonl \
            --output artifacts/public-ledger/ledger-summary.json
      - name: Construire Robin Live
        run: |
          python scripts/build_cockpit_snapshot.py
          cd cockpit
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: public-ledger-robin-live-${{ github.run_id }}
          path: |
            artifacts/public-ledger
            cockpit/out
          retention-days: 30
          compression-level: 9

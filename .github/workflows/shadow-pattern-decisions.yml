name: "42 - Shadow Pattern Decisions"
on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"
permissions:
  actions: write
  contents: write
concurrency:
  group: shadow-state
  cancel-in-progress: false
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Restaurer le shadow durable
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_shadow_state.py restore
          --repo "${{ github.repository }}"
          --destination data/shadow
          --current-run-id "${{ github.run_id }}"
      - name: Décider seulement depuis les caches point-in-time
        id: decisions
        shell: bash
        run: |
          mkdir -p artifacts/shadow-pattern
          if test -f data/shadow/pattern-research/campaign-summary.json &&
             test -f data/shadow/upcoming-fixtures-point-in-time.json; then
            python scripts/run_shadow_pattern_decisions.py \
              --campaign data/shadow/pattern-research/campaign-summary.json \
              --fixtures data/shadow/upcoming-fixtures-point-in-time.json \
              --ledger data/shadow/pattern-evidence-ledger.jsonl \
              --output artifacts/shadow-pattern/decision-run.json \
              --code-revision "${{ github.sha }}"
            echo "durable=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' '{"status":"NO_BET_DATA_UNAVAILABLE","provider_calls":0,"real_bets":false}' \
              > artifacts/shadow-pattern/decision-run.json
            echo "durable=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/durable-shadow
        if: steps.decisions.outputs.durable == 'true'
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-pattern-decisions-${{ github.run_id }}
          path: artifacts/shadow-pattern
          retention-days: 30

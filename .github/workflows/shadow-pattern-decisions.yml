name: "42 - Shadow Pattern Decisions"
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: shadow-state
  cancel-in-progress: false
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/database-revision-guard
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          expected-revision: 0013_historical_evidence_index
      - name: Restaurer le shadow durable
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_shadow_state.py restore
          --repo "${{ github.repository }}"
          --destination data/shadow
          --current-run-id "${{ github.run_id }}"
      - name: Décider seulement depuis les caches point-in-time
        id: decisions
        shell: bash
        run: |
          mkdir -p artifacts/shadow-pattern
          registry="data/shadow/pattern-research/shadow-candidate-registry.json"
          candidates=0
          if test -f "$registry"; then
            candidates="$(python -c \
              'import json,sys; print(int(json.load(open(sys.argv[1], encoding="utf-8")).get("candidate_count", 0)))' \
              "$registry")"
          fi
          if test "$candidates" -gt 0 &&
             test -f data/shadow/upcoming-fixtures-point-in-time.json; then
            python scripts/run_shadow_pattern_decisions.py \
              --campaign "$registry" \
              --fixtures data/shadow/upcoming-fixtures-point-in-time.json \
              --ledger data/shadow/pattern-evidence-ledger.jsonl \
              --output artifacts/shadow-pattern/decision-run.json \
              --code-revision "${{ github.sha }}"
            echo "durable=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' '{"status":"NO_LIVE_SHADOW_CANDIDATE","provider_calls":0,"real_bets":false}' \
              > artifacts/shadow-pattern/decision-run.json
            echo "durable=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/durable-shadow
        if: steps.decisions.outputs.durable == 'true'
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-pattern-decisions-${{ github.run_id }}
          path: artifacts/shadow-pattern
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.decisions.outputs.durable == 'true'
        with:
          name: shadow-state-${{ github.run_id }}
          path: data/shadow
          retention-days: 14
          compression-level: 9
      - name: Élaguer les anciens artefacts shadow
        if: steps.decisions.outputs.durable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_shadow_state.py prune
          --repo "${{ github.repository }}"
          --current-artifact-name "shadow-state-${{ github.run_id }}"
          --keep 2

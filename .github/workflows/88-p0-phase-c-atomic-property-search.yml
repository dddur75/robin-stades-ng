name: "88 - Phase C Atomic Property Search"

on:
  workflow_dispatch:
    inputs:
      execution_sha:
        description: "Exact SHA authorized by the trusted-main activation"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: p0-phase-c-atomic-property-search
  cancel-in-progress: false

env:
  PHASE_C_BRANCH: codex/hypothesis-tag-mask-pair-factory-v1
  API_FOOTBALL_CALLS_ALLOWED: "0"
  ODDS_CREDITS_ALLOWED: "0"
  REMOTE_SQL_ALLOWED: "0"
  R2_GET_ALLOWED: "0"
  R2_LIST_ALLOWED: "0"
  R2_HEAD_ALLOWED: "0"
  R2_WRITES_ALLOWED: "0"
  R2_DELETES_ALLOWED: "0"
  TRIPLE_SEARCH_LOCKED: "true"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      generator_sha: ${{ steps.contract.outputs.generator_sha }}
      upstream_run_id: ${{ steps.contract.outputs.upstream_run_id }}
      upstream_artifact_id: ${{ steps.contract.outputs.upstream_artifact_id }}
      upstream_manifest_hash: ${{ steps.contract.outputs.upstream_manifest_hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: main, path: trusted-main, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Validate trusted-main activation and exact upstream tag-mask artifact lock
        id: contract
        env:
          EXECUTION_SHA: ${{ inputs.execution_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXECUTION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C trusted-main ls-remote origin "refs/heads/${PHASE_C_BRANCH}" | cut -f1)" = "${EXECUTION_SHA}"
          python - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          root=Path("trusted-main"); activation=json.loads((root/"configs/execution/phase-c-execution-activation-v1.json").read_text()); lock=json.loads((root/"configs/execution/phase-c-artifact-lock-v1.json").read_text())
          if activation["activation_status"]!="ACTIVE" or activation["allowed_execution_sha"]!=os.environ["EXECUTION_SHA"]: raise SystemExit("PHASE_C_TRUSTED_MAIN_ACTIVATION_HOLD")
          if activation["phase_c_artifact_lock_hash"]!=lock["lock_hash"]: raise SystemExit("PHASE_C_ARTIFACT_LOCK_HASH_MISMATCH")
          stage=lock["stage_locks"].get("TAG_MASK_BUILD")
          if not stage or stage["head_sha"]!=os.environ["EXECUTION_SHA"] or stage["run_attempt"]<1: raise SystemExit("TAG_MASK_STAGE_LOCK_MISSING")
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/artifacts/{stage['artifact_id']}",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=20) as response: actual=json.load(response)
          if actual["expired"] or actual["name"]!=stage["artifact_name"] or actual["size_in_bytes"]!=stage["size_in_bytes"] or actual.get("digest")!=stage["digest"] or actual["workflow_run"]["head_sha"]!=stage["head_sha"]: raise SystemExit("TAG_MASK_ARTIFACT_METADATA_MISMATCH")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as stream:
              stream.write(f"generator_sha={activation['generator_sha256']}\nupstream_run_id={stage['run_id']}\nupstream_artifact_id={stage['artifact_id']}\nupstream_manifest_hash={stage['stage_manifest_hash']}\n")
          PY
          unshare --user --map-root-user --net true

  search:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ inputs.execution_sha }}", path: candidate, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.upstream_run_id }}
          artifact-ids: ${{ needs.preflight.outputs.upstream_artifact_id }}
          path: candidate/_phase_c/tag-mask-upstream
      - name: Validate upstream stage manifest, execute twice and replay without egress
        working-directory: candidate
        env:
          EXECUTION_SHA: ${{ inputs.execution_sha }}
          GENERATOR_SHA: ${{ needs.preflight.outputs.generator_sha }}
          UPSTREAM_MANIFEST_HASH: ${{ needs.preflight.outputs.upstream_manifest_hash }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXECUTION_SHA}"
          test "$(sha256sum scripts/run_hypothesis_tag_mask_pair_factory.py | cut -d' ' -f1)" = "${GENERATOR_SHA}"
          python - <<'PY'
          import json,os
          from pathlib import Path
          matches=list(Path("_phase_c/tag-mask-upstream").rglob("stage-manifest-v1.json"))
          if len(matches)!=1 or json.loads(matches[0].read_text())["manifest_hash"]!=os.environ["UPSTREAM_MANIFEST_HASH"]: raise SystemExit("TAG_MASK_STAGE_MANIFEST_MISMATCH")
          PY
          mkdir -p _phase_c/atomic-property-search
          trap 'cp "$RUNNER_TEMP/phase-c-atomic-a/checkpoint-v1.json" _phase_c/atomic-property-search/checkpoint-v1.json 2>/dev/null || true' EXIT
          unshare --user --map-root-user --net -- python scripts/run_hypothesis_tag_mask_pair_factory.py atomic-upstream --tag-mask-root _phase_c/tag-mask-upstream --output-root _phase_c/atomic-property-search --store-root "$RUNNER_TEMP/phase-c-atomic-a" --execution-sha "${EXECUTION_SHA}" --shard-id LOCAL-ALL --shard-count 1 --soft-deadline-seconds 600
          unshare --user --map-root-user --net -- python scripts/run_hypothesis_tag_mask_pair_factory.py atomic-upstream --tag-mask-root _phase_c/tag-mask-upstream --output-root "$RUNNER_TEMP/phase-c-atomic-replay" --store-root "$RUNNER_TEMP/phase-c-atomic-b" --execution-sha "${EXECUTION_SHA}" --shard-id LOCAL-ALL --shard-count 1 --soft-deadline-seconds 600
          unshare --user --map-root-user --net -- python scripts/run_hypothesis_tag_mask_pair_factory.py replay-stage --first-root _phase_c/atomic-property-search --second-root "$RUNNER_TEMP/phase-c-atomic-replay"
          cp "$RUNNER_TEMP/phase-c-atomic-a/checkpoint-v1.json" _phase_c/atomic-property-search/checkpoint-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-c-atomic-property-search-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/_phase_c/atomic-property-search/reports/hypothesis-research/atomic-campaign-summary-v1.json
            candidate/_phase_c/atomic-property-search/reports/hypothesis-research/atomic-results-v1.json
            candidate/_phase_c/atomic-property-search/reports/hypothesis-research/atomic-negative-controls-v1.json
            candidate/_phase_c/atomic-property-search/reports/hypothesis-research/campaign-costs-v1.json
            candidate/_phase_c/atomic-property-search/stage-manifest-v1.json
            candidate/_phase_c/atomic-property-search/campaign-replay-v1.json
            candidate/_phase_c/atomic-property-search/checkpoint-v1.json
          if-no-files-found: error
          retention-days: 90

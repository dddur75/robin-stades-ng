name: "03 - Archive cotes legacy (diagnostic manuel)"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-legacy-diagnostic
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Diagnostic de l'ancien collecteur
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python agents/agent_archive.py
      - name: Publier le diagnostic sans ecriture Git
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-archive-diagnostic
          path: data/archive/
          if-no-files-found: warn
          retention-days: 7

name: "00 - Qualite continue"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Isolate the marked pilot from ordinary branch CI so a later push cannot
  # interrupt it after a provider call.
  group: >-
    ${{ (github.event_name == 'push' &&
    contains(github.event.head_commit.message, '[run-j12-pilot]')) &&
    'quality-jalon12-pilot' ||
    format('quality-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: >-
    ${{ !(github.event_name == 'push' &&
    contains(github.event.head_commit.message, '[run-j12-pilot]')) }}

jobs:
  historical-deep-quality:
    name: "Historical Deep — contrat cache-only"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances Historical Deep
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Tester Historical Deep
        run: python -m pytest -q tests/historical_deep
      - name: Vérifier Ruff Historical Deep
        run: >-
          python -m ruff check
          src/robin/historical_deep
          tests/historical_deep
          tests/coverage
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Vérifier le typage strict Historical Deep
        run: >-
          python -m mypy --strict
          src/robin/historical_deep
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Auditer la sécurité Historical Deep
        run: >-
          python -m bandit -q -r
          src/robin/historical_deep
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Compiler Historical Deep
        run: >-
          python -m compileall -q
          src/robin/historical_deep
          tests/historical_deep
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Valider JSON et YAML
        run: >-
          python -c "import json,pathlib,yaml;
          json.loads(pathlib.Path('configs/historical-deep-data-harvest-v1.json').read_text(encoding='utf-8'));
          [yaml.safe_load(path.read_text(encoding='utf-8')) for path in
          sorted(pathlib.Path('.github/workflows').glob('*.yml'))]"
      - name: Vérifier les secrets
        run: python scripts/check_no_secrets.py
      - name: Vérifier les dépendances
        run: python -m pip check

  hypothesis-evidence-inputs:
    name: "Jalon 10 - entrees de preuve gelees"
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Reconstruire les entrees Jalon 10 depuis le commit gele
        shell: pwsh
        run: |
          git diff --quiet 423fb7e77ba52286b660956161f02f8a2c1be7f8..HEAD -- src/robin/patterns scripts/run_pattern_campaign.py configs/pattern-research-v1.json
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_FROZEN_ENGINE_DRIFT"
          }

          $j10Root = Join-Path $env:RUNNER_TEMP "j10"
          $j10Archive = Join-Path $env:RUNNER_TEMP "j10-historical.tar"
          $state = Join-Path $j10Root "historical"
          New-Item -ItemType Directory -Force -Path $j10Root | Out-Null
          git archive --format=tar "--output=$j10Archive" 5c85cf20b932df44dca8665de00e52e3f1e02236 -- ':(glob)historical/parquet/competition=*/season=*/entity_type=historical_market/dataset_version=historical_market_v1/*.parquet'
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_ARCHIVE_FAILED"
          }
          tar -xf $j10Archive -C $j10Root
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_EXTRACTION_FAILED"
          }
          $partitions = @(
            Get-ChildItem -Path $state -Recurse -Filter "*.parquet" -File
          )
          if ($partitions.Count -ne 30) {
            throw "JALON_10_EXPECTED_30_PARTITIONS"
          }

          python scripts/run_pattern_campaign.py --state $state --output .ci/hypothesis-j10 --code-revision 423fb7e77ba52286b660956161f02f8a2c1be7f8 --config configs/pattern-research-v1.json
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_PRIMARY_FAILED"
          }
          python scripts/run_pattern_campaign.py --state $state --output .ci/hypothesis-j10 --code-revision 423fb7e77ba52286b660956161f02f8a2c1be7f8 --config configs/pattern-research-v1.json --replay
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_REPLAY_FAILED"
          }
          python -c "from pathlib import Path; path=Path('reports/pattern-research/campaign-summary.json'); data=path.read_bytes().replace(b'\r\n', b'\n'); assert b'\r' not in data; path.write_bytes(data.replace(b'\n', b'\r\n'))"
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_COMPACT_LINE_ENDINGS_FAILED"
          }
          python -c "from pathlib import Path; from robin.hypothesis_evidence.contracts import COMPACT_CAMPAIGN_SHA256, FULL_CAMPAIGN_SHA256, REGISTRY_SHA256, sha256_file; assert sha256_file(Path('.ci/hypothesis-j10/campaign-summary.json')) == FULL_CAMPAIGN_SHA256; assert sha256_file(Path('.ci/hypothesis-j10/hypothesis-registry.jsonl')) == REGISTRY_SHA256; assert sha256_file(Path('reports/pattern-research/campaign-summary.json')) == COMPACT_CAMPAIGN_SHA256"
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_FROZEN_HASH_MISMATCH"
          }
      - name: Conserver les entrees de preuve verifiees
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-evidence-campaign-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/hypothesis-j10/campaign-summary.json
            .ci/hypothesis-j10/hypothesis-registry.jsonl
            .ci/hypothesis-j10/replay.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Conserver la campagne compacte byte-identique
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-evidence-compact-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pattern-research/campaign-summary.json
          if-no-files-found: error
          retention-days: 1

  tests:
    needs: hypothesis-evidence-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: robin_ci
          POSTGRES_USER: robin
          POSTGRES_PASSWORD: robin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robin -d robin_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restaurer les entrees de preuve verifiees
        uses: actions/download-artifact@v4
        with:
          name: hypothesis-evidence-campaign-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/hypothesis-j10
      - name: Restaurer la campagne compacte byte-identique
        uses: actions/download-artifact@v4
        with:
          name: hypothesis-evidence-compact-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pattern-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Linting
        run: >-
          python -m ruff check
          src/robin tests/jalon1 tests/jalon2 tests/jalon3 tests/jalon4 tests/jalon5 tests/jalon6 tests/jalon7 tests/jalon8 tests/jalon9 tests/jalon10 tests/jalon11 tests/jalon12 tests/jalon13 tests/jalon14
          tests/hypothesis_intelligence tests/hypothesis_evidence tests/chronos
          scripts migrations
      - name: Typage strict
        run: |
          python -m mypy src/robin scripts/run_prospective_observatory.py
          python -m mypy --explicit-package-bases scripts/run_five_league_expansion.py
          python -m mypy --explicit-package-bases scripts/run_prequential_learning_factory.py
          python -m mypy --explicit-package-bases scripts/build_hypothesis_intelligence.py
          python -m mypy --strict scripts/build_hypothesis_evidence.py scripts/build_hypothesis_evidence_site_pages.py
      - name: Securite basique
        run: >-
          python -m bandit -q -r
          src/robin
          scripts/build_hypothesis_evidence.py
          scripts/build_hypothesis_evidence_site_pages.py
          migrations/versions/0013_historical_evidence_index.py
          migrations/versions/0014_chronos_control_plane_v2.py
      - name: Verification des secrets
        run: python scripts/check_no_secrets.py
      - name: Cohérence des dépendances
        run: python -m pip check
      - name: Verifier la syntaxe
        run: python -m compileall -q agents moteur scripts src tests
      - name: Tester les migrations
        env:
          ROBIN_DATABASE_URL: postgresql+psycopg://robin:robin_ci@localhost:5432/robin_ci
          ROBIN_TEST_POSTGRES_URL: postgresql+psycopg://robin:robin_ci@localhost:5432/robin_ci
          ROBIN_TEST_CHRONOS_MIGRATOR_ROLE: robin_ci_migrator
          ROBIN_TEST_CHRONOS_SENTINEL_ROLE: robin_acl_sentinel
        run: |
          python -m alembic upgrade 0013_historical_evidence_index
          python - <<'PY'
          import os
          import sqlalchemy as sa
          from robin.storage.database import build_engine

          engine = build_engine(os.environ["ROBIN_DATABASE_URL"])
          with engine.begin() as connection:
              connection.exec_driver_sql(
                  "CREATE ROLE robin_acl_sentinel NOLOGIN"
              )
              connection.exec_driver_sql(
                  "CREATE ROLE robin_ci_migrator LOGIN NOSUPERUSER "
                  "CREATEROLE PASSWORD 'chronos_ci'"
              )
              connection.exec_driver_sql(
                  "GRANT USAGE, CREATE ON SCHEMA public TO "
                  "robin_ci_migrator WITH GRANT OPTION"
              )
              connection.exec_driver_sql(
                  "GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE "
                  "public.alembic_version TO robin_ci_migrator"
              )
              connection.exec_driver_sql(
                  "ALTER DEFAULT PRIVILEGES FOR ROLE robin_ci_migrator "
                  "IN SCHEMA public GRANT INSERT ON TABLES TO "
                  "robin_acl_sentinel"
              )
          engine.dispose()
          PY
          ROBIN_DATABASE_URL='postgresql+psycopg://robin_ci_migrator:chronos_ci@localhost:5432/robin_ci' python -m alembic upgrade head
          python -m pytest -q tests/chronos/test_chronos_postgresql_v2.py
          python -c "from sqlalchemy import inspect; from robin.storage.database import build_engine; import os; names=set(inspect(build_engine(os.environ['ROBIN_DATABASE_URL'])).get_table_names()); assert {'raw_payloads','scheduler_windows','burn_in_daily_metrics','historical_backfill_tasks','feature_snapshots','backtest_runs','pattern_definitions','pattern_runs','pattern_evaluations','pattern_decisions','pattern_settlements','bankroll_events','evidence_ledger','experiment_registry','deep_feature_definitions','deep_feature_observations','coverage_gates','matchup_hypotheses','matchup_evaluations','prospective_watchlist','shadow_candidate_versions','prospective_fixtures','capture_windows','capture_attempts','capture_receipts','prospective_payload_index','prospective_player_status','prospective_injuries','prospective_lineups','prospective_formations','prospective_odds_snapshots','temporal_data_gates','provider_budget_ledger','prequential_feature_snapshots','prequential_model_versions','prequential_predictions','prequential_fixture_settlements','prequential_prediction_scores','prequential_metric_snapshots','prequential_training_runs','prequential_ledger_events','hypothesis_registry','hypothesis_versions','hypothesis_discovery_metrics','hypothesis_prospective_contracts','hypothesis_observations','hypothesis_settlements','hypothesis_status_events','hypothesis_historical_evidence_summaries','hypothesis_evidence_artifact_indexes','historical_fixture_evidence_indexes','hypothesis_fixture_membership_indexes','chronos_effect_authorities','chronos_effect_events'} <= names"
          ROBIN_DATABASE_URL='postgresql+psycopg://robin_ci_migrator:chronos_ci@localhost:5432/robin_ci' python -m alembic downgrade 0013_historical_evidence_index
          python -m alembic downgrade 0002_jalon2_shadow
          python -m alembic upgrade 0013_historical_evidence_index
          python scripts/check_database_revision.py --expected 0013_historical_evidence_index
          ROBIN_DATABASE_URL='postgresql+psycopg://robin_ci_migrator:chronos_ci@localhost:5432/robin_ci' python -m alembic upgrade head
          ROBIN_DATABASE_URL='postgresql+psycopg://robin_ci_migrator:chronos_ci@localhost:5432/robin_ci' python -m alembic downgrade 0013_historical_evidence_index
          python -m alembic downgrade base
      - name: Executer les tests
        run: python -m pytest -q
      - name: Tester Parquet et les protections anti-fuite
        run: python -m pytest -q tests/jalon5 tests/jalon6 tests/jalon7 tests/jalon8 tests/jalon9
      - name: Tester la factory préquentielle et la sécurité temporelle
        run: python -m pytest -q tests/jalon14
      - name: Tester les configurations et le pipeline mock
        run: |
          python -c "import json,pathlib,yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github').rglob('*.yml')]; yaml.safe_load(pathlib.Path('configs/shadow_v1.yaml').read_text()); json.loads(pathlib.Path('configs/prospective_observatory_v1.json').read_text()); json.loads(pathlib.Path('configs/prequential_learning_v1.json').read_text())"
          python scripts/run_shadow_pipeline.py collect-fixtures --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py collect-odds --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py pre-match-shadow --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py daily-health --mock --output .ci/shadow
      - name: Tester stockage, replay, rattrapage et burn-in
        run: python -m pytest -q tests/jalon4
      - name: Smoke test du dashboard de sante
        run: |
          python -m robin.quality.report --input data/matches.parquet --output .ci/quality
          python -c "from pathlib import Path; assert Path('.ci/quality/health.html').stat().st_size > 1000"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
      - name: Compiler et tester le Cockpit Live V2
        working-directory: cockpit
        run: |
          pnpm install --frozen-lockfile
          pnpm test

  visual-regression:
    needs:
      - hypothesis-evidence-inputs
      - tests
    name: "Robin Experience — preuves visuelles"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restaurer les entrees de preuve verifiees
        uses: actions/download-artifact@v4
        with:
          name: hypothesis-evidence-campaign-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/hypothesis-j10
      - name: Restaurer la campagne compacte byte-identique
        uses: actions/download-artifact@v4
        with:
          name: hypothesis-evidence-compact-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pattern-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
      - name: Installer le Cockpit et Chromium
        working-directory: cockpit
        run: |
          python -m pip install -r ../requirements.txt
          python -m pip install --no-deps -e ..
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Reconstruire les preuves historiques bornees
        run: |
          python scripts/build_hypothesis_evidence.py --git-blobs --no-resume
          python scripts/build_hypothesis_evidence_site_pages.py
          git diff --exit-code -- reports/hypothesis-evidence
      - name: Verifier la publication locale des preuves
        working-directory: cockpit
        run: |
          pnpm run build:data
          git diff --exit-code -- app/cockpit-presentation.json
          pnpm run prepare:evidence-assets:required
          pnpm exec vinext build
          pnpm run test:ssr
      - name: Capturer les vues de référence
        working-directory: cockpit
        run: pnpm run test:visual:prepared
      - name: Publier les preuves visuelles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robin-experience-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cockpit/.ci/visual-regression
            artifacts/hypothesis-evidence/artifact-manifest.json
            artifacts/hypothesis-evidence/run-metrics.json
            artifacts/hypothesis-evidence-site-pages/manifest.json
            .ci/hypothesis-j10/replay.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  jalon12-pilot:
    name: "Pilote Jalon 12 R2-first borne"
    needs: tests
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/jalon-12-prospective-deep-data-observatory' &&
      (contains(github.event.head_commit.message, '[run-j12-pilot]') ||
      contains(github.event.head_commit.message, '[run-j12-replay-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: prospective-deep-state
      cancel-in-progress: false
    env:
      PROSPECTIVE_POLICY: "configs/prospective_observatory_v1.json"
      PROSPECTIVE_OUTPUT: "artifacts/prospective-observatory"
      STORAGE_PAUSED: "true"
      P3_P4_PAUSED: "true"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuser les marqueurs Jalon 12 incompatibles
        if: >-
          contains(github.event.head_commit.message, '[run-j12-pilot]') &&
          contains(github.event.head_commit.message, '[run-j12-replay-only]')
        run: |
          echo "Les modes pilote et replay-only sont mutuellement exclusifs."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer le runtime prospectif
        run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - name: Verifier uniquement la presence des secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Le pilote fournisseur ne peut pas etre relance pour un meme run."
            exit 1
          fi
          for name in DATABASE_URL API_FOOTBALL_KEY ODDS_API_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "Secret requis absent: ${name}"
              exit 1
            fi
          done
      - name: Verifier PostgreSQL Neon en lecture seule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/check_database_revision.py --expected 0013_historical_evidence_index
      - name: Estimer puis enregistrer les fixtures Ligue 1
        if: >-
          contains(github.event.head_commit.message, '[run-j12-pilot]') &&
          !contains(github.event.head_commit.message, '[run-j12-replay-only]')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python scripts/run_prospective_observatory.py fixture-registry --estimate --max-attempts 1 --policy "$PROSPECTIVE_POLICY" --competition "Ligue 1" --output "$PROSPECTIVE_OUTPUT"
          python scripts/run_prospective_observatory.py fixture-registry --execute --max-attempts 1 --policy "$PROSPECTIVE_POLICY" --estimate-file "$PROSPECTIVE_OUTPUT/fixture-registry-estimate.json" --competition "Ligue 1" --output "$PROSPECTIVE_OUTPUT"
      - name: Planifier les fenetres
        if: >-
          contains(github.event.head_commit.message, '[run-j12-pilot]') &&
          !contains(github.event.head_commit.message, '[run-j12-replay-only]')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python scripts/run_prospective_observatory.py scheduler
          --policy "$PROSPECTIVE_POLICY"
          --output "$PROSPECTIVE_OUTPUT"
      - name: Capturer seulement les fenetres actuellement dues
        if: >-
          contains(github.event.head_commit.message, '[run-j12-pilot]') &&
          !contains(github.event.head_commit.message, '[run-j12-replay-only]')
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          for command in capture-general capture-player capture-lineup capture-odds; do
            python scripts/run_prospective_observatory.py "$command" --estimate --max-attempts 1 --policy "$PROSPECTIVE_POLICY" --output "$PROSPECTIVE_OUTPUT"
            case "$command" in
              capture-general) estimate="general-capture-estimate.json" ;;
              capture-player) estimate="player-capture-estimate.json" ;;
              capture-lineup) estimate="lineup-capture-estimate.json" ;;
              capture-odds) estimate="odds-capture-estimate.json" ;;
            esac
            python scripts/run_prospective_observatory.py "$command" --execute --max-attempts 1 --policy "$PROSPECTIVE_POLICY" --estimate-file "$PROSPECTIVE_OUTPUT/$estimate" --output "$PROSPECTIVE_OUTPUT"
          done
      - name: Rejouer R2 sans fournisseur et evaluer les gates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          API_FOOTBALL_KEY: ""
          ODDS_API_KEY: ""
          API_FOOTBALL_CALLS_ALLOWED: "0"
          ODDS_API_CREDITS_ALLOWED: "0"
        run: |
          python scripts/run_prospective_observatory.py replay-audit --policy "$PROSPECTIVE_POLICY" --output "$PROSPECTIVE_OUTPUT"
          python scripts/run_prospective_observatory.py gate-report --policy "$PROSPECTIVE_POLICY" --output "$PROSPECTIVE_OUTPUT"
      - name: Construire le snapshot prospectif Robin Live
        env:
          COCKPIT_PROSPECTIVE_ONLY: "1"
          PROSPECTIVE_REPORT_ROOT: "artifacts/prospective-observatory"
        run: python scripts/build_cockpit_snapshot.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
      - name: Tester Robin Live avec le snapshot du pilote
        working-directory: cockpit
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: jalon12-pilot-${{ github.run_id }}
          path: |
            artifacts/prospective-observatory/*.json
            artifacts/prospective-observatory/*.jsonl
            cockpit/app/cockpit-data.json
            cockpit/app/cockpit-data.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

name: "00 - Qualite continue"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Isolate the marked pilot from ordinary branch CI so a later push cannot
  # interrupt it after a provider call.
  group: >-
    ${{ (github.event_name == 'push' &&
    contains(github.event.head_commit.message, '[run-j12-pilot]')) &&
    'quality-jalon12-pilot' ||
    format('quality-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: >-
    ${{ !(github.event_name == 'push' &&
    contains(github.event.head_commit.message, '[run-j12-pilot]')) }}

jobs:
  historical-deep-quality:
    name: "Historical Deep — contrat cache-only"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances Historical Deep
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Tester Historical Deep
        run: python -m pytest -q tests/historical_deep
      - name: Vérifier Ruff Historical Deep
        run: >-
          python -m ruff check
          src/robin/historical_deep
          tests/historical_deep
          tests/coverage
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Vérifier le typage strict Historical Deep
        run: >-
          python -m mypy --strict
          src/robin/historical_deep
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Auditer la sécurité Historical Deep
        run: >-
          python -m bandit -q -r
          src/robin/historical_deep
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Compiler Historical Deep
        run: >-
          python -m compileall -q
          src/robin/historical_deep
          tests/historical_deep
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Valider JSON et YAML
        run: >-
          python -c "import json,pathlib,yaml;
          json.loads(pathlib.Path('configs/historical-deep-data-harvest-v1.json').read_text(encoding='utf-8'));
          [yaml.safe_load(path.read_text(encoding='utf-8')) for path in
          sorted(pathlib.Path('.github/workflows').glob('*.yml'))]"
      - name: Vérifier les secrets
        run: python scripts/check_no_secrets.py
      - name: Vérifier les dépendances
        run: python -m pip check

  frozen-evidence-windows:
    name: "Jalon 10 - entrees de preuve gelees"
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --require-hashes -r requirements-evidence.lock
          python -m pip install --no-deps -e .
      - name: Reconstruire les entrees Jalon 10 depuis le commit gele
        shell: pwsh
        run: |
          git diff --quiet 423fb7e77ba52286b660956161f02f8a2c1be7f8..HEAD -- src/robin/patterns scripts/run_pattern_campaign.py configs/pattern-research-v1.json
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_FROZEN_ENGINE_DRIFT"
          }

          $j10Root = Join-Path $env:RUNNER_TEMP "j10"
          $j10Archive = Join-Path $env:RUNNER_TEMP "j10-historical.tar"
          $state = Join-Path $j10Root "historical"
          New-Item -ItemType Directory -Force -Path $j10Root | Out-Null
          git archive --format=tar "--output=$j10Archive" 5c85cf20b932df44dca8665de00e52e3f1e02236 -- ':(glob)historical/parquet/competition=*/season=*/entity_type=historical_market/dataset_version=historical_market_v1/*.parquet'
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_ARCHIVE_FAILED"
          }
          tar -xf $j10Archive -C $j10Root
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_EXTRACTION_FAILED"
          }
          $partitions = @(
            Get-ChildItem -Path $state -Recurse -Filter "*.parquet" -File
          )
          if ($partitions.Count -ne 30) {
            throw "JALON_10_EXPECTED_30_PARTITIONS"
          }

          python scripts/run_pattern_campaign.py --state $state --output .ci/hypothesis-j10 --code-revision 423fb7e77ba52286b660956161f02f8a2c1be7f8 --config configs/pattern-research-v1.json
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_PRIMARY_FAILED"
          }
          python scripts/run_pattern_campaign.py --state $state --output .ci/hypothesis-j10 --code-revision 423fb7e77ba52286b660956161f02f8a2c1be7f8 --config configs/pattern-research-v1.json --replay
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_REPLAY_FAILED"
          }
          python -c "from pathlib import Path; path=Path('reports/pattern-research/campaign-summary.json'); data=path.read_bytes().replace(b'\r\n', b'\n'); assert b'\r' not in data; path.write_bytes(data.replace(b'\n', b'\r\n'))"
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_COMPACT_LINE_ENDINGS_FAILED"
          }
          python -c "from pathlib import Path; from robin.hypothesis_evidence.contracts import COMPACT_CAMPAIGN_SHA256, FULL_CAMPAIGN_SHA256, REGISTRY_SHA256, sha256_file; assert sha256_file(Path('.ci/hypothesis-j10/campaign-summary.json')) == FULL_CAMPAIGN_SHA256; assert sha256_file(Path('.ci/hypothesis-j10/hypothesis-registry.jsonl')) == REGISTRY_SHA256; assert sha256_file(Path('reports/pattern-research/campaign-summary.json')) == COMPACT_CAMPAIGN_SHA256"
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_FROZEN_HASH_MISMATCH"
          }
      - name: Produire les Parquet geles canoniques
        shell: pwsh
        run: |
          python scripts/build_hypothesis_evidence.py --git-blobs --no-resume
          if ($LASTEXITCODE -ne 0) {
            throw "FROZEN_EVIDENCE_WINDOWS_BUILD_FAILED"
          }
          git diff --exit-code -- reports/hypothesis-evidence
          if ($LASTEXITCODE -ne 0) {
            throw "FROZEN_EVIDENCE_HISTORICAL_HASH_MISMATCH"
          }
      - name: Construire et verifier le manifeste portable
        shell: pwsh
        run: |
          $sourceSha = git rev-parse HEAD
          $treeSha = git rev-parse 'HEAD^{tree}'
          python scripts/frozen_evidence_manifest.py build `
            --artifact-root artifacts/hypothesis-evidence `
            --output artifacts/hypothesis-evidence/portable-manifest.json `
            --source-sha $sourceSha `
            --tree-sha $treeSha `
            --input .ci/hypothesis-j10/campaign-summary.json `
            --input .ci/hypothesis-j10/hypothesis-registry.jsonl `
            --input .ci/hypothesis-j10/replay.json `
            --input reports/pattern-research/campaign-summary.json `
            --generator scripts/build_hypothesis_evidence.py `
            --generator src/robin/hypothesis_evidence/contracts.py `
            --generator src/robin/hypothesis_evidence/factory.py `
            --generator src/robin/hypothesis_evidence/source.py `
            --dependency-lock requirements-evidence.lock
          if ($LASTEXITCODE -ne 0) {
            throw "FROZEN_EVIDENCE_MANIFEST_BUILD_FAILED"
          }
          python scripts/frozen_evidence_manifest.py verify `
            --artifact-root artifacts/hypothesis-evidence `
            --manifest artifacts/hypothesis-evidence/portable-manifest.json `
            --expected-source-sha $sourceSha `
            --expected-tree-sha $treeSha `
            --input .ci/hypothesis-j10/campaign-summary.json `
            --input .ci/hypothesis-j10/hypothesis-registry.jsonl `
            --input .ci/hypothesis-j10/replay.json `
            --input reports/pattern-research/campaign-summary.json `
            --generator scripts/build_hypothesis_evidence.py `
            --generator src/robin/hypothesis_evidence/contracts.py `
            --generator src/robin/hypothesis_evidence/factory.py `
            --generator src/robin/hypothesis_evidence/source.py `
            --dependency-lock requirements-evidence.lock
          if ($LASTEXITCODE -ne 0) {
            throw "FROZEN_EVIDENCE_MANIFEST_VERIFY_FAILED"
          }
      - name: Conserver les entrees de preuve verifiees
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hypothesis-evidence-campaign-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/hypothesis-j10/campaign-summary.json
            .ci/hypothesis-j10/hypothesis-registry.jsonl
            .ci/hypothesis-j10/replay.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Conserver la campagne compacte byte-identique
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hypothesis-evidence-compact-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pattern-research/campaign-summary.json
          if-no-files-found: error
          retention-days: 1
      - name: Publier les preuves Parquet canoniques immuables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-hypothesis-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/hypothesis-evidence/*.parquet
            artifacts/hypothesis-evidence/artifact-manifest.json
            artifacts/hypothesis-evidence/run-metrics.json
            artifacts/hypothesis-evidence/portable-manifest.json
          if-no-files-found: error
          retention-days: 30

  chronos-postgresql-profiles:
    name: "Chronos PostgreSQL profiles"
    needs: frozen-evidence-windows
    uses: ./.github/workflows/chronos-bootstrap-ci-v3.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  chronos-end-to-end-live-path-replay:
    name: "End-to-End Live Path Replay"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - run: >-
          python -m pytest -q
          tests/activation/test_chronos_end_to_end_live_path_v1.py::test_full_live_path_replay_only_mocks_external_boundaries
          tests/activation/test_chronos_end_to_end_live_path_v1.py::test_full_no_go_replays_stop_at_the_correct_gate

  chronos-residual-fault-matrix:
    name: "Residual Fault Matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - run: >-
          python -m pytest -q
          tests/activation/test_chronos_neon_pure_readonly_preflight_v4.py
          tests/activation/test_chronos_neon_controlled_idle_wake_readonly_v1.py
          tests/activation/test_chronos_end_to_end_live_path_v1.py

  chronos-exact-workflow-entrypoint:
    name: "Exact Workflow Entrypoint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Exercise the exact bounded module and guard commands
        run: |
          python -m pytest -q \
            tests/activation/test_chronos_end_to_end_live_path_v1.py::test_exact_module_command_with_malformed_run_id_still_writes_report

  historical-authority-workflows-disabled:
    name: "Historical Authority Workflows Disabled"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuser toute ancienne route R2 reactivable
        shell: bash
        run: |
          set -euo pipefail
          assert_disabled() {
            local workflow_id="$1"
            local expected_path="$2"
            local observed
            observed="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" \
              --jq '[.id,.path,.state] | @tsv')"
            test "${observed}" = "${workflow_id}"$'\t'"${expected_path}"$'\t'disabled_manually
          }
          assert_disabled 319920551 .github/workflows/historical-backfill.yml
          assert_disabled 327137040 .github/workflows/79-historical-deep-night-controller.yml
          assert_disabled 327137044 .github/workflows/81-historical-deep-coverage-proof-export.yml
          assert_disabled 329278452 .github/workflows/82-p0-e1b-five-league-canary.yml
          assert_disabled 329420317 .github/workflows/83-p0-e2-capability-sample.yml

  tests:
    name: tests
    needs:
      - frozen-evidence-windows
      - chronos-postgresql-profiles
      - chronos-end-to-end-live-path-replay
      - chronos-residual-fault-matrix
      - chronos-exact-workflow-entrypoint
      - historical-authority-workflows-disabled
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: robin_ci
          POSTGRES_USER: robin
          POSTGRES_PASSWORD: robin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robin -d robin_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Refuser tout prerequis absent, annule ou en echec
        env:
          FROZEN_EVIDENCE_RESULT: ${{ needs.frozen-evidence-windows.result }}
          CHRONOS_PROFILES_RESULT: ${{ needs.chronos-postgresql-profiles.result }}
          E2E_LIVE_PATH_RESULT: ${{ needs.chronos-end-to-end-live-path-replay.result }}
          RESIDUAL_FAULT_MATRIX_RESULT: ${{ needs.chronos-residual-fault-matrix.result }}
          EXACT_WORKFLOW_ENTRYPOINT_RESULT: ${{ needs.chronos-exact-workflow-entrypoint.result }}
          HISTORICAL_AUTHORITY_BOUNDARY_RESULT: ${{ needs.historical-authority-workflows-disabled.result }}
        run: |
          test "$FROZEN_EVIDENCE_RESULT" = "success"
          test "$CHRONOS_PROFILES_RESULT" = "success"
          test "$E2E_LIVE_PATH_RESULT" = "success"
          test "$RESIDUAL_FAULT_MATRIX_RESULT" = "success"
          test "$EXACT_WORKFLOW_ENTRYPOINT_RESULT" = "success"
          test "$HISTORICAL_AUTHORITY_BOUNDARY_RESULT" = "success"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restaurer les entrees de preuve verifiees
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hypothesis-evidence-campaign-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/hypothesis-j10
      - name: Restaurer la campagne compacte byte-identique
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hypothesis-evidence-compact-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pattern-research
      - name: Restaurer les Parquet canoniques Windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-hypothesis-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hypothesis-evidence
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Verifier les bytes et le manifeste canoniques
        env:
          EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          EVIDENCE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          python scripts/frozen_evidence_manifest.py verify \
            --artifact-root artifacts/hypothesis-evidence \
            --manifest artifacts/hypothesis-evidence/portable-manifest.json \
            --expected-source-sha "$EVIDENCE_SOURCE_SHA" \
            --expected-tree-sha "$EVIDENCE_TREE_SHA" \
            --input .ci/hypothesis-j10/campaign-summary.json \
            --input .ci/hypothesis-j10/hypothesis-registry.jsonl \
            --input .ci/hypothesis-j10/replay.json \
            --input reports/pattern-research/campaign-summary.json \
            --generator scripts/build_hypothesis_evidence.py \
            --generator src/robin/hypothesis_evidence/contracts.py \
            --generator src/robin/hypothesis_evidence/factory.py \
            --generator src/robin/hypothesis_evidence/source.py \
            --dependency-lock requirements-evidence.lock
      - name: Verifier les chemins suivis
        run: python scripts/check_no_tracked_absolute_paths.py
      - name: Linting
        run: >-
          python -m ruff check
          src/robin tests/jalon1 tests/jalon2 tests/jalon3 tests/jalon4 tests/jalon5 tests/jalon6 tests/jalon7 tests/jalon8 tests/jalon9 tests/jalon10 tests/jalon11 tests/jalon12 tests/jalon13 tests/jalon14
          tests/hypothesis_intelligence tests/hypothesis_evidence tests/chronos
          scripts migrations
      - name: Typage strict
        run: |
          python -m mypy src/robin scripts/run_prospective_observatory.py
          python -m mypy --explicit-package-bases scripts/run_five_league_expansion.py
          python -m mypy --explicit-package-bases scripts/run_prequential_learning_factory.py
          python -m mypy --explicit-package-bases scripts/build_hypothesis_intelligence.py
          python -m mypy --strict scripts/build_hypothesis_evidence.py scripts/build_hypothesis_evidence_site_pages.py scripts/chronos_neon_pure_readonly_preflight_v4.py
      - name: Securite basique
        run: >-
          python -m bandit -q -r
          src/robin
          scripts/build_hypothesis_evidence.py
          scripts/build_hypothesis_evidence_site_pages.py
          scripts/chronos_neon_pure_readonly_preflight_v4.py
          migrations/versions/0013_historical_evidence_index.py
          migrations/versions/0014_chronos_control_plane_v2.py
      - name: Verification des secrets
        run: python scripts/check_no_secrets.py
      - name: Cohérence des dépendances
        run: python -m pip check
      - name: Verifier la syntaxe
        run: python -m compileall -q agents moteur scripts src tests
      - name: Tester les migrations
        env:
          ROBIN_DATABASE_URL: postgresql+psycopg://robin:robin_ci@localhost:5432/robin_ci
          ROBIN_TEST_POSTGRES_URL: postgresql+psycopg://robin:robin_ci@localhost:5432/robin_ci
          ROBIN_TEST_CHRONOS_MIGRATOR_ROLE: robin_ci_migrator
          ROBIN_TEST_CHRONOS_BOOTSTRAP_AUTHORITY_ROLE: chronos_bootstrap_authority
          ROBIN_TEST_CHRONOS_LIFECYCLE_ADMIN_ROLE: robin
          CHRONOS_CI_ADMIN_PROFILE: superuser
          ROBIN_TEST_CHRONOS_AUTHORITY_URL: postgresql+psycopg://chronos_authority_runtime_login:chronos_authority_ci@localhost:5432/robin_ci
          ROBIN_TEST_CHRONOS_RUNTIME_URL: postgresql+psycopg://chronos_effect_runtime_login:chronos_runtime_ci@localhost:5432/robin_ci
          ROBIN_TEST_CHRONOS_READER_URL: postgresql+psycopg://chronos_reader_login:chronos_reader_ci@localhost:5432/robin_ci
        run: |
          python -m pytest -q tests/chronos/test_chronos_postgresql_v2.py::test_non_superuser_createrole_receives_unrevokable_admin_edge
          python -m scripts.run_chronos_dual_principal_ci_v2
          python -m pytest -q \
            tests/chronos/test_chronos_postgresql_v2.py::test_server_clock_claim_is_atomic_and_hashes_match_python \
            tests/chronos/test_chronos_postgresql_v2.py::test_database_expiry_cannot_be_reactivated_by_caller_time \
            tests/chronos/test_chronos_postgresql_v2.py::test_get_permit_and_finalization_are_allowed_after_put_expiry \
            tests/chronos/test_chronos_postgresql_v2.py::test_null_nonce_and_identity_inputs_fail_closed \
            tests/chronos/test_chronos_postgresql_v2.py::test_tables_are_append_only_even_for_owner \
            tests/chronos/test_chronos_postgresql_v2.py::test_roles_have_only_the_reviewed_capabilities \
            tests/chronos/test_chronos_postgresql_v2.py::test_scoped_login_connections_enforce_allows_and_denials \
            tests/chronos/test_chronos_postgresql_v2.py::test_non_superuser_migrator_is_nocreaterole_and_has_no_runtime_edge
          python scripts/check_database_revision.py --expected 0014_chronos_control_plane_v2
          python -c "from sqlalchemy import inspect; from robin.storage.database import build_engine; import os; names=set(inspect(build_engine(os.environ['ROBIN_DATABASE_URL'])).get_table_names()); assert {'pattern_definitions','experiment_registry','chronos_effect_authorities','chronos_effect_events'} <= names"
      - name: Publier la matrice d'edges CI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronos-dual-principal-superuser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/chronos-dual-principal-superuser-v2.json
          if-no-files-found: error
      - name: Executer les tests
        run: python -m pytest -q
      - name: Tester Parquet et les protections anti-fuite
        run: python -m pytest -q tests/jalon5 tests/jalon6 tests/jalon7 tests/jalon8 tests/jalon9
      - name: Tester la factory préquentielle et la sécurité temporelle
        run: python -m pytest -q tests/jalon14
      - name: Tester les configurations et le pipeline mock
        run: |
          python -c "import json,pathlib,yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github').rglob('*.yml')]; yaml.safe_load(pathlib.Path('configs/shadow_v1.yaml').read_text()); json.loads(pathlib.Path('configs/prospective_observatory_v1.json').read_text()); json.loads(pathlib.Path('configs/prequential_learning_v1.json').read_text())"
          python scripts/run_shadow_pipeline.py collect-fixtures --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py collect-odds --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py pre-match-shadow --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py daily-health --mock --output .ci/shadow
      - name: Tester stockage, replay, rattrapage et burn-in
        run: python -m pytest -q tests/jalon4
      - name: Smoke test du dashboard de sante
        run: |
          python -m robin.quality.report --input data/matches.parquet --output .ci/quality
          python -c "from pathlib import Path; assert Path('.ci/quality/health.html').stat().st_size > 1000"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.9.0"
      - name: Compiler et tester le Cockpit Live V2
        working-directory: cockpit
        run: |
          pnpm install --frozen-lockfile
          pnpm test

  visual-regression:
    needs:
      - frozen-evidence-windows
      - tests
    name: "Robin Experience — preuves visuelles"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restaurer les entrees de preuve verifiees
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hypothesis-evidence-campaign-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/hypothesis-j10
      - name: Restaurer la campagne compacte byte-identique
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hypothesis-evidence-compact-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pattern-research
      - name: Restaurer les Parquet canoniques Windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-hypothesis-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hypothesis-evidence
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.9.0"
      - name: Installer le Cockpit et Chromium
        working-directory: cockpit
        run: |
          python -m pip install -r ../requirements.txt
          python -m pip install --no-deps -e ..
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verifier et materialiser les preuves historiques bornees
        env:
          EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          EVIDENCE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          python scripts/frozen_evidence_manifest.py verify \
            --artifact-root artifacts/hypothesis-evidence \
            --manifest artifacts/hypothesis-evidence/portable-manifest.json \
            --expected-source-sha "$EVIDENCE_SOURCE_SHA" \
            --expected-tree-sha "$EVIDENCE_TREE_SHA" \
            --input .ci/hypothesis-j10/campaign-summary.json \
            --input .ci/hypothesis-j10/hypothesis-registry.jsonl \
            --input .ci/hypothesis-j10/replay.json \
            --input reports/pattern-research/campaign-summary.json \
            --generator scripts/build_hypothesis_evidence.py \
            --generator src/robin/hypothesis_evidence/contracts.py \
            --generator src/robin/hypothesis_evidence/factory.py \
            --generator src/robin/hypothesis_evidence/source.py \
            --dependency-lock requirements-evidence.lock
          python scripts/build_hypothesis_evidence_site_pages.py
      - name: Verifier la publication locale des preuves
        working-directory: cockpit
        run: |
          pnpm run build:data
          git diff --exit-code -- app/cockpit-presentation.json
          pnpm run prepare:evidence-assets:required
          pnpm exec vinext build
          pnpm run test:ssr
      - name: Capturer les vues de référence
        working-directory: cockpit
        run: pnpm run test:visual:prepared
      - name: Publier les preuves visuelles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: robin-experience-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cockpit/.ci/visual-regression
            artifacts/hypothesis-evidence/artifact-manifest.json
            artifacts/hypothesis-evidence/portable-manifest.json
            artifacts/hypothesis-evidence/run-metrics.json
            artifacts/hypothesis-evidence-site-pages/manifest.json
            .ci/hypothesis-j10/replay.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  jalon12-pilot:
    name: "Pilote Jalon 12 R2-first borne"
    needs: tests
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/jalon-12-prospective-deep-data-observatory' &&
      (contains(github.event.head_commit.message, '[run-j12-pilot]') ||
      contains(github.event.head_commit.message, '[run-j12-replay-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: prospective-deep-state
      cancel-in-progress: false
    env:
      PROSPECTIVE_POLICY: "configs/prospective_observatory_v1.json"
      PROSPECTIVE_OUTPUT: "artifacts/prospective-observatory"
      STORAGE_PAUSED: "true"
      P3_P4_PAUSED: "true"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuser les marqueurs Jalon 12 incompatibles
        if: >-
          contains(github.event.head_commit.message, '[run-j12-pilot]') &&
          contains(github.event.head_commit.message, '[run-j12-replay-only]')
        run: |
          echo "Les modes pilote et replay-only sont mutuellement exclusifs."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer le runtime prospectif
        run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - name: Verifier uniquement la presence des secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ "${GITHUB_RUN_ATTEMPT}" != "1" ]; then
            echo "Le pilote fournisseur ne peut pas etre relance pour un meme run."
            exit 1
          fi
          for name in DATABASE_URL API_FOOTBALL_KEY ODDS_API_KEY R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "Secret requis absent: ${name}"
              exit 1
            fi
          done
      - name: Verifier PostgreSQL Neon en lecture seule
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/check_database_revision.py --expected 0013_historical_evidence_index
      - name: Estimer puis enregistrer les fixtures Ligue 1
        if: >-
          contains(github.event.head_commit.message, '[run-j12-pilot]') &&
          !contains(github.event.head_commit.message, '[run-j12-replay-only]')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python scripts/run_prospective_observatory.py fixture-registry --estimate --max-attempts 1 --policy "$PROSPECTIVE_POLICY" --competition "Ligue 1" --output "$PROSPECTIVE_OUTPUT"
          python scripts/run_prospective_observatory.py fixture-registry --execute --max-attempts 1 --policy "$PROSPECTIVE_POLICY" --estimate-file "$PROSPECTIVE_OUTPUT/fixture-registry-estimate.json" --competition "Ligue 1" --output "$PROSPECTIVE_OUTPUT"
      - name: Planifier les fenetres
        if: >-
          contains(github.event.head_commit.message, '[run-j12-pilot]') &&
          !contains(github.event.head_commit.message, '[run-j12-replay-only]')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python scripts/run_prospective_observatory.py scheduler
          --policy "$PROSPECTIVE_POLICY"
          --output "$PROSPECTIVE_OUTPUT"
      - name: Capturer seulement les fenetres actuellement dues
        if: >-
          contains(github.event.head_commit.message, '[run-j12-pilot]') &&
          !contains(github.event.head_commit.message, '[run-j12-replay-only]')
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          for command in capture-general capture-player capture-lineup capture-odds; do
            python scripts/run_prospective_observatory.py "$command" --estimate --max-attempts 1 --policy "$PROSPECTIVE_POLICY" --output "$PROSPECTIVE_OUTPUT"
            case "$command" in
              capture-general) estimate="general-capture-estimate.json" ;;
              capture-player) estimate="player-capture-estimate.json" ;;
              capture-lineup) estimate="lineup-capture-estimate.json" ;;
              capture-odds) estimate="odds-capture-estimate.json" ;;
            esac
            python scripts/run_prospective_observatory.py "$command" --execute --max-attempts 1 --policy "$PROSPECTIVE_POLICY" --estimate-file "$PROSPECTIVE_OUTPUT/$estimate" --output "$PROSPECTIVE_OUTPUT"
          done
      - name: Rejouer R2 sans fournisseur et evaluer les gates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          API_FOOTBALL_KEY: ""
          ODDS_API_KEY: ""
          API_FOOTBALL_CALLS_ALLOWED: "0"
          ODDS_API_CREDITS_ALLOWED: "0"
        run: |
          python scripts/run_prospective_observatory.py replay-audit --policy "$PROSPECTIVE_POLICY" --output "$PROSPECTIVE_OUTPUT"
          python scripts/run_prospective_observatory.py gate-report --policy "$PROSPECTIVE_POLICY" --output "$PROSPECTIVE_OUTPUT"
      - name: Construire le snapshot prospectif Robin Live
        env:
          COCKPIT_PROSPECTIVE_ONLY: "1"
          PROSPECTIVE_REPORT_ROOT: "artifacts/prospective-observatory"
        run: python scripts/build_cockpit_snapshot.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
      - name: Tester Robin Live avec le snapshot du pilote
        working-directory: cockpit
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: jalon12-pilot-${{ github.run_id }}
          path: |
            artifacts/prospective-observatory/*.json
            artifacts/prospective-observatory/*.jsonl
            cockpit/app/cockpit-data.json
            cockpit/app/cockpit-data.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

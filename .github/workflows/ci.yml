name: "00 - Qualite continue"

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: robin_ci
          POSTGRES_USER: robin
          POSTGRES_PASSWORD: robin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robin -d robin_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Linting
        run: >-
          python -m ruff check
          src/robin tests/jalon1 tests/jalon2 tests/jalon3 tests/jalon4 tests/jalon5
          scripts migrations
      - name: Typage strict
        run: python -m mypy src/robin
      - name: Securite basique
        run: python -m bandit -q -r src/robin
      - name: Verification des secrets
        run: python scripts/check_no_secrets.py
      - name: Verifier la syntaxe
        run: python -m compileall -q agents moteur src tests
      - name: Tester les migrations
        env:
          ROBIN_DATABASE_URL: postgresql+psycopg://robin:robin_ci@localhost:5432/robin_ci
        run: |
          python -m alembic upgrade head
          python -c "from sqlalchemy import inspect; from robin.storage.database import build_engine; import os; names=set(inspect(build_engine(os.environ['ROBIN_DATABASE_URL'])).get_table_names()); assert {'raw_payloads','scheduler_windows','burn_in_daily_metrics','historical_backfill_tasks','feature_snapshots','backtest_runs'} <= names"
          python -m alembic downgrade 0002_jalon2_shadow
          python -m alembic upgrade head
          python -m alembic downgrade base
      - name: Executer les tests
        run: python -m pytest -q
      - name: Tester Parquet et les protections anti-fuite
        run: python -m pytest -q tests/jalon5
      - name: Tester les configurations et le pipeline mock
        run: |
          python -c "import pathlib,yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github').rglob('*.yml')]; yaml.safe_load(pathlib.Path('configs/shadow_v1.yaml').read_text())"
          python scripts/run_shadow_pipeline.py collect-fixtures --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py collect-odds --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py pre-match-shadow --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py daily-health --mock --output .ci/shadow
      - name: Tester stockage, replay, rattrapage et burn-in
        run: python -m pytest -q tests/jalon4
      - name: Smoke test du dashboard de sante
        run: |
          python -m robin.quality.report --input data/matches.parquet --output .ci/quality
          python -c "from pathlib import Path; assert Path('.ci/quality/health.html').stat().st_size > 1000"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
      - name: Compiler et tester le Cockpit Live V2
        working-directory: cockpit
        run: |
          pnpm install --frozen-lockfile
          pnpm test

name: "00 - Qualite continue"

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Verifier la syntaxe
        run: python -m compileall -q agents moteur tests
      - name: Executer les tests
        run: python -m pytest -q

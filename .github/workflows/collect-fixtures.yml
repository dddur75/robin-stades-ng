name: "10 - Collecte fixtures shadow"
on:
  workflow_dispatch:
    inputs:
      mock:
        description: "Exécuter avec des fixtures DEMO"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 4,16 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: shadow-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Restaurer l'état shadow durable
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_shadow_state.py restore
          --repo "${{ github.repository }}"
          --destination data/shadow
          --current-run-id "${{ github.run_id }}"
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Collecter les fixtures
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DURABLE_STORAGE_REQUIRED: "true"
        run: >-
          python scripts/run_shadow_pipeline.py collect-fixtures
          ${{ inputs.mock && '--mock' || '' }}
      - uses: ./.github/actions/durable-shadow
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-state-${{ github.run_id }}
          path: data/shadow
          retention-days: 30
          compression-level: 9
      - name: Conserver seulement les deux états durables les plus récents
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_shadow_state.py prune
          --repo "${{ github.repository }}"
          --current-artifact-name "shadow-state-${{ github.run_id }}"
          --keep 2

name: "10 - Collecte fixtures shadow"
on:
  workflow_dispatch:
    inputs:
      mock:
        description: "Exécuter avec des fixtures DEMO"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 4,16 * * *"
permissions:
  contents: read
concurrency:
  group: shadow-fixtures
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with:
          path: data/shadow
          key: shadow-data-${{ github.run_id }}
          restore-keys: shadow-data-
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Collecter les fixtures
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: >-
          python scripts/run_shadow_pipeline.py collect-fixtures
          ${{ inputs.mock && '--mock' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-fixtures-${{ github.run_id }}
          path: data/shadow
          retention-days: 30

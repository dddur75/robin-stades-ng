name: "43 - Pattern Settlement append-only"
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: shadow-state
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/database-revision-guard
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          expected-revision: 0013_historical_evidence_index
      - name: Restaurer le shadow durable
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_shadow_state.py restore
          --repo "${{ github.repository }}"
          --destination data/shadow
          --current-run-id "${{ github.run_id }}"
      - name: Règlement cache-only ou NOOP honnête
        id: settlement
        shell: bash
        run: |
          mkdir -p artifacts/pattern-settlement
          if test -f data/shadow/pattern-evidence-ledger.jsonl &&
             test -f data/shadow/settlement-results-point-in-time.json; then
            python scripts/settle_pattern_decisions.py \
              --ledger data/shadow/pattern-evidence-ledger.jsonl \
              --results data/shadow/settlement-results-point-in-time.json \
              --output artifacts/pattern-settlement/report.json
            echo "durable=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' '{"status":"NO_SETTLEMENT_DUE","provider_calls":0,"real_bets":false}' \
              > artifacts/pattern-settlement/report.json
            echo "durable=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/durable-shadow
        if: steps.settlement.outputs.durable == 'true'
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: pattern-settlement-${{ github.run_id }}
          path: artifacts/pattern-settlement
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: steps.settlement.outputs.durable == 'true'
        with:
          name: shadow-state-${{ github.run_id }}
          path: data/shadow
          retention-days: 14
          compression-level: 9
      - name: Élaguer les anciens artefacts shadow
        if: steps.settlement.outputs.durable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_shadow_state.py prune
          --repo "${{ github.repository }}"
          --current-artifact-name "shadow-state-${{ github.run_id }}"
          --keep 2

name: "25 - Backtest historique V3"
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "24 - Model Lab historique"
    types: [completed]
  schedule:
    - cron: "43 3 * * 3"
permissions:
  contents: write
concurrency:
  group: historical-state
  cancel-in-progress: false
jobs:
  backtest:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Backtester et protéger contre le data mining
        run: |
          if [ ! -f data/historical/datasets/api_team_pre_match_v1.json ]; then
            python scripts/run_historical_pipeline.py \
              --run-id "${{ github.run_id }}" readiness
            python scripts/run_historical_pipeline.py \
              --run-id "${{ github.run_id }}" datasets
          fi
          if [ ! -f data/historical/models/api_team_multinomial_v1.json ]; then
            python scripts/run_historical_pipeline.py \
              --run-id "${{ github.run_id }}" model-lab
          fi
          python scripts/run_historical_pipeline.py \
            --run-id "${{ github.run_id }}" strategy-lab
      - uses: ./.github/actions/historical-state-persist
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}

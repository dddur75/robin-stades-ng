name: "25 - Strategy Lab V2"
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "24 - Scientific Model Arena"
    types: [completed]
  schedule:
    - cron: "43 3 * * 3"
permissions:
  contents: write
concurrency:
  group: historical-state
  cancel-in-progress: false
jobs:
  backtest:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/database-revision-guard
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          expected-revision: 0013_historical_evidence_index
      - uses: ./.github/actions/historical-state-restore
      - name: Backtester le protocole préenregistré sans fournisseur
        run: |
          if [ ! -f data/historical/datasets/api_team_pre_match_v1.json ]; then
            python scripts/run_historical_pipeline.py \
              --run-id "${{ github.run_id }}" readiness
            python scripts/run_historical_pipeline.py \
              --run-id "${{ github.run_id }}" datasets
          fi
          if [ ! -f data/historical/models/api_team_multinomial_v1.json ]; then
            python scripts/run_historical_pipeline.py \
              --run-id "${{ github.run_id }}" model-lab
          fi
          if [ ! -f data/historical/models/jalon7-arena-run.json ]; then
            python scripts/run_historical_pipeline.py \
              --max-calls 0 \
              --run-id "${{ github.run_id }}" scientific-arena
          fi
          python scripts/run_historical_pipeline.py \
            --max-calls 0 \
            --run-id "${{ github.run_id }}" strategy-lab-v2
      - uses: ./.github/actions/historical-state-persist
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}
          r2-replication-enabled: "true"
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket-name: ${{ secrets.R2_BUCKET_NAME }}

name: "76 - As-Of Feature Build"

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET_NAME:
        required: true

permissions:
  contents: read

concurrency:
  group: historical-deep-r2-state
  cancel-in-progress: false

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      STORAGE_PAUSED: "true"
      P3_P4_PAUSED: "true"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      PROMOTION_LOCKED: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
      POSTGRESQL_PRODUCTION_DESTRUCTIVE_WRITES: "false"
      THE_ODDS_API_HISTORICAL_CREDITS: "false"
      API_FOOTBALL_CALLS_ALLOWED: "0"
      ODDS_API_CREDITS_ALLOWED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - name: Construire les six datasets temporels séparés
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: >-
          python scripts/run_historical_deep_harvest.py
          --config configs/historical-deep-data-harvest-v1.json
          --output artifacts/historical-deep
          --code-revision "${GITHUB_SHA}"
          features
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-deep-76-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/historical-deep/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

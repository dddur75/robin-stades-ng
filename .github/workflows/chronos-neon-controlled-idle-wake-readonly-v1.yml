name: "Chronos Neon Controlled Idle Wake Read-Only V1"

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "SHA main exact autorise"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: chronos-data-torrent-production-global-v1
  cancel-in-progress: false

jobs:
  preflight:
    name: "Controlled idle wake and read-only database preflight V1"
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chronos-control-plane-production
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Refuser toute source stale ou relance
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$CURRENT_MAIN_SHA" == "$EXPECTED_MAIN_SHA" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Installer le runtime borne
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          -r requirements-chronos-neon-readonly-v4.lock
      - name: Valider localement l autorite de mission non expiree
        run: >-
          python -c
          "from robin.chronos_production import validate_data_torrent_authority;
          validate_data_torrent_authority()"
      - name: Verifier les gardes et Golden Packs synthetiques
        run: >-
          python -m pytest -q
          tests/activation/test_chronos_neon_pure_readonly_preflight_v4.py
          tests/activation/test_chronos_neon_controlled_idle_wake_readonly_v1.py
          tests/activation/test_chronos_end_to_end_live_path_v1.py
      - name: Exiger le hold global et la CI post-merge exacte avant tout effet
        id: pre_effect_gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: >-
          python scripts/check_chronos_github_hold_v3.py
          --report .chronos/reports/chronos-controlled-readonly-hold-v1.json
          --required-successful-ci-sha "$EXPECTED_MAIN_SHA"
      - name: Masquer et verifier les secrets requis
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
        run: |
          for name in NEON_API_KEY NEON_BOOTSTRAP_DATABASE_URL NEON_PROJECT_ID NEON_ORG_ID; do
            if test -n "${!name:-}"; then
              value="${!name}"
              value="${value//'%'/'%25'}"
              value="${value//$'\r'/'%0D'}"
              value="${value//$'\n'/'%0A'}"
              printf '%s\n' "::add-mask::$value"
            elif test "$name" = NEON_API_KEY || test "$name" = NEON_BOOTSTRAP_DATABASE_URL; then
              echo "SECRET_MISSING:$name"
            fi
          done
      - name: Executer le reveil controle et le preflight read-only
        id: live_preflight
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
          NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
        run: >-
          timeout --signal=TERM --kill-after=5s 120s
          python -m scripts.chronos_neon_controlled_idle_wake_readonly_v1
          --report .chronos/reports/chronos-neon-controlled-idle-wake-readonly-v1.json
        working-directory: ${{ github.workspace }}
      - name: Garantir un rapport fail-closed sans secret avant le gate
        id: artifact_guard_no_secrets
        if: ${{ always() && steps.pre_effect_gate.outcome != 'success' }}
        run: >-
          python -m scripts.chronos_live_path_artifact_guard_v1
          --report .chronos/reports/chronos-neon-controlled-idle-wake-readonly-v1.json
          --live-outcome "${{ steps.live_preflight.outcome }}"
        working-directory: ${{ github.workspace }}
      - name: Garantir un rapport sanitise apres liberation des secrets
        id: artifact_guard
        if: ${{ always() && steps.pre_effect_gate.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
        run: >-
          python -m scripts.chronos_live_path_artifact_guard_v1
          --report .chronos/reports/chronos-neon-controlled-idle-wake-readonly-v1.json
          --live-outcome "${{ steps.live_preflight.outcome }}"
        working-directory: ${{ github.workspace }}
      - name: Publier uniquement le rapport sanitise
        if: >-
          ${{ always() &&
          (steps.artifact_guard.outcome == 'success' ||
          steps.artifact_guard_no_secrets.outcome == 'success') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronos-neon-controlled-idle-wake-readonly-v1-${{ github.run_id }}
          path: .chronos/reports/chronos-neon-controlled-idle-wake-readonly-v1.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

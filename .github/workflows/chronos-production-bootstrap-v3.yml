name: "Chronos Production Bootstrap V3"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Phase administrative exclusive"
        required: true
        type: choice
        options:
          - PREFLIGHT
          - MIGRATE
          - VERIFY
      expected_main_sha:
        description: "SHA main exact autorise"
        required: true
        type: string
      post_merge_ci_sha:
        description: "SHA main exact dont le CI post-merge est vert"
        required: true
        type: string
      controlled_run_id:
        description: "Run controlled read-only GO atteste, requis seulement pour PREFLIGHT"
        required: false
        type: string
      controlled_seal_run_id:
        description: "Run de scellement R2 du GO, requis seulement pour PREFLIGHT"
        required: false
        type: string
      preflight_run_id:
        description: "Run PREFLIGHT atteste, requis seulement pour MIGRATE"
        required: false
        type: string
      migration_run_id:
        description: "Run MIGRATE atteste, requis seulement pour VERIFY"
        required: false
        type: string

concurrency:
  group: chronos-data-torrent-production-global-v1
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  STORAGE_PAUSED: "true"
  P3_P4_PAUSED: "true"
  PRODUCTION_LOCKED: "true"
  REAL_BETS: "false"
  NO_BET_DEFAULT: "true"
  PROMOTION_LOCKED: "true"
  SOCIAL_PUBLISHING_ENABLED: "false"
  DEMO_MODE_ENABLED: "false"
  POSTGRESQL_PRODUCTION_DESTRUCTIVE_WRITES: "false"
  THE_ODDS_API_HISTORICAL_CREDITS: "false"
  API_FOOTBALL_CALLS_ALLOWED: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Refuser tout dispatch ambigu, stale ou relance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          POST_MERGE_CI_SHA: ${{ inputs.post_merge_ci_sha }}
          CONTROLLED_RUN_ID: ${{ inputs.controlled_run_id }}
          CONTROLLED_SEAL_RUN_ID: ${{ inputs.controlled_seal_run_id }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$POST_MERGE_CI_SHA" == "$EXPECTED_MAIN_SHA" ]]
          case "$MODE" in
            PREFLIGHT)
              [[ "$CONTROLLED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ "$CONTROLLED_SEAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ -z "$PREFLIGHT_RUN_ID" && -z "$MIGRATION_RUN_ID" ]]
              ;;
            MIGRATE)
              [[ -z "$CONTROLLED_RUN_ID" ]]
              [[ -z "$CONTROLLED_SEAL_RUN_ID" ]]
              [[ "$PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [[ -z "$MIGRATION_RUN_ID" ]]
              ;;
            VERIFY)
              [[ -z "$CONTROLLED_RUN_ID" ]]
              [[ -z "$CONTROLLED_SEAL_RUN_ID" ]]
              [[ -z "$PREFLIGHT_RUN_ID" ]]
              [[ "$MIGRATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              ;;
            *) exit 1 ;;
          esac
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$CURRENT_MAIN_SHA" == "$EXPECTED_MAIN_SHA" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Installer le runtime borne de validation
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r requirements-chronos-canary.lock
      - name: Verifier autorite et ordinal avant environnement production
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: >-
          python -c
          "import os;
          from robin.chronos_production import validate_data_torrent_authority;
          from scripts.chronos_production_bootstrap_v3 import _assert_bootstrap_dispatch_ordinal;
          validate_data_torrent_authority();
          _assert_bootstrap_dispatch_ordinal(mode=os.environ['MODE'],
          main_sha=os.environ['EXPECTED_MAIN_SHA'])"

  preflight:
    needs: validate
    if: inputs.mode == 'PREFLIGHT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chronos-control-plane-production
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Installer le runtime borne
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r requirements-chronos-canary.lock
      - name: Attester et telecharger le GO controlled read-only exact
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLED_RUN_ID: ${{ inputs.controlled_run_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: >-
          python scripts/github_release_attestation_v1.py
          --workflow-path .github/workflows/chronos-neon-controlled-idle-wake-readonly-v1.yml
          --run-id "$CONTROLLED_RUN_ID" --main-sha "$EXPECTED_MAIN_SHA"
          --artifact-name "chronos-neon-controlled-idle-wake-readonly-v1-$CONTROLLED_RUN_ID"
          --artifact-filename chronos-neon-controlled-idle-wake-readonly-v1.json
          --output .chronos/controlled/chronos-neon-controlled-idle-wake-readonly-v1.json
          --report .chronos/reports/github-controlled-readonly-artifact-attestation-v1.json
      - name: Attester et telecharger le scellement durable exact
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLED_SEAL_RUN_ID: ${{ inputs.controlled_seal_run_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: >-
          python scripts/github_release_attestation_v1.py
          --workflow-path .github/workflows/chronos-controlled-go-durable-seal-v1.yml
          --run-id "$CONTROLLED_SEAL_RUN_ID" --main-sha "$EXPECTED_MAIN_SHA"
          --artifact-name "chronos-controlled-go-durable-seal-v1-$CONTROLLED_SEAL_RUN_ID"
          --artifact-filename chronos-controlled-go-durable-seal-v1.json
          --output .chronos/controlled/chronos-controlled-go-durable-seal-v1.json
          --report .chronos/reports/github-controlled-seal-artifact-attestation-v1.json
      - name: Revalider le hold GitHub et le CI post-merge en direct
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_SUCCESSFUL_CI_SHA: ${{ inputs.post_merge_ci_sha }}
        run: >-
          python scripts/check_chronos_github_hold_v3.py
          --report .chronos/reports/chronos-production-workflow-hold-live-v3.json
          --required-successful-ci-sha "$REQUIRED_SUCCESSFUL_CI_SHA"
      - name: Revalider le head main juste avant le point de recuperation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$CURRENT_MAIN_SHA" == "$EXPECTED_MAIN_SHA" ]]
      - name: Executer PREFLIGHT et creer le point de recuperation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHRONOS_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CHRONOS_EXPECTED_CONTROLLED_RUN_ID: ${{ inputs.controlled_run_id }}
          CHRONOS_EXPECTED_CONTROLLED_SEAL_RUN_ID: ${{ inputs.controlled_seal_run_id }}
          CHRONOS_POST_MERGE_CI_SHA: ${{ inputs.post_merge_ci_sha }}
          CHRONOS_HOLD_REPORT: .chronos/reports/chronos-production-workflow-hold-live-v3.json
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: >-
          python -m scripts.chronos_production_bootstrap_v3
          --mode PREFLIGHT --report-dir .chronos/reports
          --controlled-readonly-artifact
          .chronos/controlled/chronos-neon-controlled-idle-wake-readonly-v1.json
          --controlled-seal-artifact
          .chronos/controlled/chronos-controlled-go-durable-seal-v1.json
      - name: Publier seulement les preuves sanitisees signees
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronos-preflight-v3-${{ github.run_id }}
          path: .chronos/reports/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  migrate:
    needs: validate
    if: inputs.mode == 'MIGRATE'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: chronos-control-plane-production
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Installer le runtime borne
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r requirements-chronos-canary.lock
      - name: Attester et telecharger l'artifact PREFLIGHT exact
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: >-
          python scripts/github_release_attestation_v1.py
          --workflow-path .github/workflows/chronos-production-bootstrap-v3.yml
          --run-id "$PREFLIGHT_RUN_ID" --main-sha "$EXPECTED_MAIN_SHA"
          --artifact-name "chronos-preflight-v3-$PREFLIGHT_RUN_ID"
          --artifact-filename chronos-preflight-artifact-v3.json
          --output .chronos/preflight/chronos-preflight-artifact-v3.json
          --report .chronos/reports/github-preflight-artifact-attestation-v1.json
      - name: Revalider le hold avant l'unique migration
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_SUCCESSFUL_CI_SHA: ${{ inputs.post_merge_ci_sha }}
        run: >-
          python scripts/check_chronos_github_hold_v3.py
          --report .chronos/reports/chronos-production-workflow-hold-live-v3.json
          --required-successful-ci-sha "$REQUIRED_SUCCESSFUL_CI_SHA"
      - name: Revalider le head main juste avant la migration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$CURRENT_MAIN_SHA" == "$EXPECTED_MAIN_SHA" ]]
      - name: Migrer exactement vers 0015 et creer les identites scoped
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHRONOS_AUTHORITY_DATABASE_URL: ${{ secrets.CHRONOS_AUTHORITY_DATABASE_URL }}
          CHRONOS_CONTROL_PLANE_GENERATION_NONCE: ${{ secrets.CHRONOS_CONTROL_PLANE_GENERATION_NONCE }}
          CHRONOS_EXPECTED_PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
          CHRONOS_POST_MERGE_CI_SHA: ${{ inputs.post_merge_ci_sha }}
          CHRONOS_HOLD_REPORT: .chronos/reports/chronos-production-workflow-hold-live-v3.json
          CHRONOS_READER_DATABASE_URL: ${{ secrets.CHRONOS_READER_DATABASE_URL }}
          CHRONOS_RUNTIME_DATABASE_URL: ${{ secrets.CHRONOS_RUNTIME_DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
        run: >-
          python -m scripts.chronos_production_bootstrap_v3
          --mode MIGRATE --report-dir .chronos/reports
          --preflight-artifact .chronos/preflight/chronos-preflight-artifact-v3.json
      - name: Publier la sortie sanitisee du bootstrap
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronos-migration-v3-${{ github.run_id }}
          path: .chronos/reports/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  verify:
    needs: validate
    if: inputs.mode == 'VERIFY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chronos-control-plane-production
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Installer le runtime borne
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r requirements-chronos-canary.lock
      - name: Attester et telecharger l'artifact MIGRATE exact
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: >-
          python scripts/github_release_attestation_v1.py
          --workflow-path .github/workflows/chronos-production-bootstrap-v3.yml
          --run-id "$MIGRATION_RUN_ID" --main-sha "$EXPECTED_MAIN_SHA"
          --artifact-name "chronos-migration-v3-$MIGRATION_RUN_ID"
          --artifact-filename chronos-bootstrap-output-v3.json
          --output .chronos/migration/chronos-bootstrap-output-v3.json
          --report .chronos/reports/github-migration-artifact-attestation-v1.json
      - name: Revalider le hold et le CI avant VERIFY
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_SUCCESSFUL_CI_SHA: ${{ inputs.post_merge_ci_sha }}
        run: >-
          python scripts/check_chronos_github_hold_v3.py
          --report .chronos/reports/chronos-production-workflow-hold-live-v3.json
          --required-successful-ci-sha "$REQUIRED_SUCCESSFUL_CI_SHA"
      - name: Revalider le head main juste avant VERIFY
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$CURRENT_MAIN_SHA" == "$EXPECTED_MAIN_SHA" ]]
      - name: Verifier sans modifier de donnee metier
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHRONOS_AUTHORITY_DATABASE_URL: ${{ secrets.CHRONOS_AUTHORITY_DATABASE_URL }}
          CHRONOS_CONTROL_PLANE_GENERATION_NONCE: ${{ secrets.CHRONOS_CONTROL_PLANE_GENERATION_NONCE }}
          CHRONOS_EXPECTED_MIGRATION_RUN_ID: ${{ inputs.migration_run_id }}
          CHRONOS_POST_MERGE_CI_SHA: ${{ inputs.post_merge_ci_sha }}
          CHRONOS_HOLD_REPORT: .chronos/reports/chronos-production-workflow-hold-live-v3.json
          CHRONOS_READER_DATABASE_URL: ${{ secrets.CHRONOS_READER_DATABASE_URL }}
          CHRONOS_RUNTIME_DATABASE_URL: ${{ secrets.CHRONOS_RUNTIME_DATABASE_URL }}
        run: >-
          python -m scripts.chronos_production_bootstrap_v3
          --mode VERIFY --report-dir .chronos/reports
          --migration-artifact .chronos/migration/chronos-bootstrap-output-v3.json
      - name: Publier la verification sanitisee
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronos-verify-v3-${{ github.run_id }}
          path: .chronos/reports/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

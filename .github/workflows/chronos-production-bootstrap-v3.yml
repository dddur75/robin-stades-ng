name: "Chronos Production Bootstrap V3"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Phase administrative exclusive"
        required: true
        type: choice
        options:
          - PREFLIGHT
          - MIGRATE
          - VERIFY
      expected_main_sha:
        description: "SHA main exact autorise"
        required: true
        type: string
      preflight_run_id:
        description: "Run PREFLIGHT signe, requis seulement pour MIGRATE"
        required: false
        type: string

concurrency:
  group: chronos-production-bootstrap-v3
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    if: inputs.mode == 'PREFLIGHT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chronos-control-plane-production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer le runtime borne
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Masquer et verifier les deux secrets bootstrap
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
        run: |
          test -n "$NEON_API_KEY" || { echo "MISSING_SECRET:NEON_API_KEY"; exit 1; }
          test -n "$NEON_BOOTSTRAP_DATABASE_URL" || { echo "MISSING_SECRET:NEON_BOOTSTRAP_DATABASE_URL"; exit 1; }
          echo "::add-mask::$NEON_API_KEY"
          echo "::add-mask::$NEON_BOOTSTRAP_DATABASE_URL"
      - name: Revalider le hold GitHub en direct
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_chronos_github_hold_v3.py
          --report .chronos/reports/chronos-production-workflow-hold-live-v3.json
      - name: Executer PREFLIGHT et creer le point de recuperation
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          CHRONOS_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CHRONOS_HOLD_REPORT: .chronos/reports/chronos-production-workflow-hold-live-v3.json
        run: >-
          python scripts/chronos_production_bootstrap_v3.py
          --mode PREFLIGHT
          --report-dir .chronos/reports
      - name: Publier seulement les preuves sanitisees signees
        uses: actions/upload-artifact@v4
        with:
          name: chronos-preflight-v3-${{ github.run_id }}
          path: .chronos/reports/*.json
          if-no-files-found: error
          retention-days: 7
  migrate:
    if: inputs.mode == 'MIGRATE'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: chronos-control-plane-production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Refuser MIGRATE sans run PREFLIGHT exact
        shell: bash
        run: test -n "${{ inputs.preflight_run_id }}" || exit 1
      - name: Telecharger l'artifact PREFLIGHT exact
        uses: actions/download-artifact@v4
        with:
          name: chronos-preflight-v3-${{ inputs.preflight_run_id }}
          path: .chronos/preflight
          run-id: ${{ inputs.preflight_run_id }}
          github-token: ${{ github.token }}
      - name: Installer le runtime borne
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Masquer et verifier les secrets MIGRATE
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
          CHRONOS_BOOTSTRAP_AUTHORITY_PASSWORD: ${{ secrets.CHRONOS_BOOTSTRAP_AUTHORITY_PASSWORD }}
          CHRONOS_BOOTSTRAP_RUNTIME_PASSWORD: ${{ secrets.CHRONOS_BOOTSTRAP_RUNTIME_PASSWORD }}
          CHRONOS_BOOTSTRAP_READER_PASSWORD: ${{ secrets.CHRONOS_BOOTSTRAP_READER_PASSWORD }}
          CHRONOS_CONTROL_PLANE_GENERATION_NONCE: ${{ secrets.CHRONOS_CONTROL_PLANE_GENERATION_NONCE }}
        run: |
          for name in NEON_API_KEY NEON_BOOTSTRAP_DATABASE_URL CHRONOS_BOOTSTRAP_AUTHORITY_PASSWORD CHRONOS_BOOTSTRAP_RUNTIME_PASSWORD CHRONOS_BOOTSTRAP_READER_PASSWORD CHRONOS_CONTROL_PLANE_GENERATION_NONCE; do
            test -n "${!name:-}" || { echo "MISSING_SECRET:$name"; exit 1; }
            echo "::add-mask::${!name}"
          done
      - name: Revalider le hold avant l'unique dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_chronos_github_hold_v3.py
          --report .chronos/reports/chronos-production-workflow-hold-live-v3.json
      - name: Migrer exactement vers 0014 et creer les identites scoped
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
          CHRONOS_BOOTSTRAP_AUTHORITY_PASSWORD: ${{ secrets.CHRONOS_BOOTSTRAP_AUTHORITY_PASSWORD }}
          CHRONOS_BOOTSTRAP_RUNTIME_PASSWORD: ${{ secrets.CHRONOS_BOOTSTRAP_RUNTIME_PASSWORD }}
          CHRONOS_BOOTSTRAP_READER_PASSWORD: ${{ secrets.CHRONOS_BOOTSTRAP_READER_PASSWORD }}
          CHRONOS_CONTROL_PLANE_GENERATION_NONCE: ${{ secrets.CHRONOS_CONTROL_PLANE_GENERATION_NONCE }}
        run: >-
          python scripts/chronos_production_bootstrap_v3.py
          --mode MIGRATE
          --report-dir .chronos/reports
          --preflight-artifact .chronos/preflight/chronos-preflight-artifact-v3.json
      - name: Publier la sortie sanitisee du bootstrap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronos-migration-v3-${{ github.run_id }}
          path: .chronos/reports/*.json
          if-no-files-found: error
          retention-days: 7

  verify:
    if: inputs.mode == 'VERIFY'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chronos-control-plane-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer le runtime borne
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Masquer les trois URLs scoped
        shell: bash
        env:
          CHRONOS_AUTHORITY_DATABASE_URL: ${{ secrets.CHRONOS_AUTHORITY_DATABASE_URL }}
          CHRONOS_RUNTIME_DATABASE_URL: ${{ secrets.CHRONOS_RUNTIME_DATABASE_URL }}
          CHRONOS_READER_DATABASE_URL: ${{ secrets.CHRONOS_READER_DATABASE_URL }}
        run: |
          for name in CHRONOS_AUTHORITY_DATABASE_URL CHRONOS_RUNTIME_DATABASE_URL CHRONOS_READER_DATABASE_URL; do
            test -n "${!name:-}" || { echo "MISSING_SECRET:$name"; exit 1; }
            echo "::add-mask::${!name}"
          done
      - name: Verifier sans modifier de donnee metier
        env:
          CHRONOS_AUTHORITY_DATABASE_URL: ${{ secrets.CHRONOS_AUTHORITY_DATABASE_URL }}
          CHRONOS_RUNTIME_DATABASE_URL: ${{ secrets.CHRONOS_RUNTIME_DATABASE_URL }}
          CHRONOS_READER_DATABASE_URL: ${{ secrets.CHRONOS_READER_DATABASE_URL }}
        run: >-
          python scripts/chronos_production_bootstrap_v3.py
          --mode VERIFY
          --report-dir .chronos/reports
      - uses: actions/upload-artifact@v4
        with:
          name: chronos-verify-v3-${{ github.run_id }}
          path: .chronos/reports/*.json
          if-no-files-found: error
          retention-days: 7

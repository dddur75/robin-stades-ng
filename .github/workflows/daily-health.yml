name: "14 - Sante quotidienne shadow"
on:
  workflow_dispatch:
  schedule:
    - cron: "53 6 * * *"
permissions:
  contents: read
concurrency:
  group: shadow-health
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/cache@v4
        with:
          path: data/shadow
          key: shadow-data-${{ github.run_id }}
          restore-keys: shadow-data-
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Calculer la sante
        run: python scripts/run_shadow_pipeline.py daily-health
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-health-${{ github.run_id }}
          path: data/shadow
          retention-days: 30

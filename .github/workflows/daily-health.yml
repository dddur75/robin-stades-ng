name: "14 - Sante quotidienne shadow"
on:
  workflow_dispatch:
  schedule:
    - cron: "53 6 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: shadow-state
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBIN_DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Restaurer l'état shadow durable
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_shadow_state.py restore
          --repo "${{ github.repository }}"
          --destination data/shadow
          --current-run-id "${{ github.run_id }}"
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/checkout@v4
        if: env.ROBIN_DATABASE_URL != ''
        with:
          ref: shadow-data
          path: .bootstrap-registry
      - name: Verifier la revision Neon sans migration
        if: env.ROBIN_DATABASE_URL != ''
        run: >-
          python scripts/check_database_revision.py
          --expected 0013_historical_evidence_index
      - name: Calculer la sante
        env:
          DURABLE_STORAGE_REQUIRED: "true"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/run_shadow_pipeline.py daily-health
      - uses: ./.github/actions/durable-shadow
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-state-${{ github.run_id }}
          path: data/shadow
          retention-days: 30
          compression-level: 9
      - name: Conserver seulement les deux états durables les plus récents
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/manage_shadow_state.py prune
          --repo "${{ github.repository }}"
          --current-artifact-name "shadow-state-${{ github.run_id }}"
          --keep 2

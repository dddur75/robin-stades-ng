name: "Chronos Neon Pure Read-Only Preflight V4"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronos-neon-pure-readonly-preflight-v4
  cancel-in-progress: false

jobs:
  preflight:
    name: "Neon pure read-only preflight V4"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chronos-control-plane-production
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Refuser toute relance
        shell: bash
        run: test "$GITHUB_RUN_ATTEMPT" = "1" || exit 1
      - name: Installer le runtime borne
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          -r requirements-chronos-neon-readonly-v4.lock
      - name: Verifier les gardes et Golden Packs synthetiques
        run: >-
          python -m pytest -q
          tests/activation/test_chronos_neon_pure_readonly_preflight_v4.py
      - name: Masquer et verifier les secrets requis
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
        run: |
          for name in NEON_API_KEY NEON_BOOTSTRAP_DATABASE_URL; do
            if test -n "${!name:-}"; then
              echo "::add-mask::${!name}"
            else
              echo "SECRET_MISSING:$name"
            fi
          done
      - name: Executer le preflight purement read-only
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_BOOTSTRAP_DATABASE_URL: ${{ secrets.NEON_BOOTSTRAP_DATABASE_URL }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: >-
          python scripts/chronos_neon_pure_readonly_preflight_v4.py
          --report .chronos/reports/chronos-neon-pure-readonly-preflight-v4.json
      - name: Publier uniquement le rapport sanitise
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronos-neon-pure-readonly-preflight-v4-${{ github.run_id }}
          path: .chronos/reports/chronos-neon-pure-readonly-preflight-v4.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

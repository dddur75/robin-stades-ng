name: "91 - Robin real data result"

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Exact successor mission execution token"
        required: true
        type: string
      expected_main_sha:
        description: "Exact reviewed and merged main SHA"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: robin-real-data-result-20261003-global
  cancel-in-progress: false

env:
  STORAGE_PAUSED: "true"
  P3_P4_PAUSED: "true"
  PRODUCTION_LOCKED: "true"
  REAL_BETS: "false"
  NO_BET_DEFAULT: "true"
  PROMOTION_LOCKED: "true"
  SOCIAL_PUBLISHING_ENABLED: "false"
  DEMO_MODE_ENABLED: "false"
  API_FOOTBALL_CALLS_ALLOWED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  capture:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.actor == 'dddur75' &&
      github.triggering_actor == 'dddur75' &&
      inputs.execute == 'ROBIN_REAL_DATA_RESULT_20261003'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}

      - name: Verify exact merged authority and bounded dispatch
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MANIFEST_SHA256: "4d91084d8446d794083b3729c34ac32e438c72c28b9db180979c4c5f2af74aa2"
          EXPECTED_SOURCE_SHA256: "f01be9dddc7d7a098caec9fc3bf623ab2b53803ce03b6202f5b3fcdcad0ad25b"
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == "dddur75/robin-stades-ng" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$GITHUB_ACTOR" == "dddur75" ]]
          [[ "$GITHUB_TRIGGERING_ACTOR" == "dddur75" ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$current_main_sha" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$(sha256sum configs/execution/robin-real-data-result-20261003.json | cut -d' ' -f1)" == "$EXPECTED_MANIFEST_SHA256" ]]
          [[ "$(sha256sum docs/data-sourcing/ROBIN-REAL-DATA-RESULT-2026-10-03.md | cut -d' ' -f1)" == "$EXPECTED_SOURCE_SHA256" ]]
          runs_file="$RUNNER_TEMP/real-data-result-dispatch-run-ids.txt"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/91-robin-real-data-result.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[] | select(.actor.login == "dddur75" and .triggering_actor.login == "dddur75") | .id' > "$runs_file"
          dispatch_count="$(awk 'NF { count += 1 } END { print count + 0 }' "$runs_file")"
          [[ "$dispatch_count" -ge 1 && "$dispatch_count" -le 3 ]]
          [[ "$(grep -Fxc "$GITHUB_RUN_ID" "$runs_file")" == "1" ]]
          python -I - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest_path = Path("configs/execution/robin-real-data-result-20261003.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert set(manifest) == {
              "mission_id", "authorized_stages", "maximum_stage", "external_effects",
              "compute_budget", "time_budget", "source_hash", "expires_at",
          }
          assert manifest["mission_id"] == "ROBIN_REAL_DATA_RESULT_20261003"
          assert manifest["authorized_stages"] == ["E1", "E2", "E3A", "E3B"]
          assert manifest["maximum_stage"] == "E3B"
          assert manifest["time_budget"] == 28800
          assert manifest["source_hash"] == os.environ["EXPECTED_SOURCE_SHA256"]
          expires = datetime.datetime.fromisoformat(manifest["expires_at"].replace("Z", "+00:00"))
          assert datetime.datetime.now(datetime.UTC) + datetime.timedelta(minutes=30) <= expires
          old_run = json.loads(
              subprocess.run(
                  [
                      "gh", "api",
                      "repos/dddur75/robin-stades-ng/actions/runs/37118924677",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
          )
          assert old_run["status"] == "completed"
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_MANIFEST_SHA256"
          ]
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Install exact existing runtime dependencies
        id: install
        run: >-
          python -I -m pip install --only-binary=:all: --require-hashes -r requirements-data-torrent.lock

      - name: Prepare normalized delivery directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RUNNER_TEMP/real-data-result"

      - name: Execute three programmed cycles
        id: capture
        continue-on-error: true
        shell: bash
        env:
          THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          python -I scripts/run_real_data_result.py \
            --execute ROBIN_REAL_DATA_RESULT_20261003 \
            --manifest configs/execution/robin-real-data-result-20261003.json \
            --output-directory "$RUNNER_TEMP/real-data-result" \
            --interval-seconds 120

      - name: Validate normalized delivery and write run summary
        id: validate
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "real-data-result"
          expected = {
              "public-receipt.json", "robin-real-data.json",
              "robin-real-data.csv", "robin-real-data.html",
          }
          assert {path.name for path in root.iterdir() if path.is_file()} == expected
          receipt = json.loads((root / "public-receipt.json").read_text(encoding="utf-8"))
          report = json.loads((root / "robin-real-data.json").read_text(encoding="utf-8"))
          assert receipt["mission_id"] == "ROBIN_REAL_DATA_RESULT_20261003"
          assert receipt["repository_sha"] == os.environ["GITHUB_SHA"]
          assert receipt["github_run_id"] == os.environ["GITHUB_RUN_ID"]
          assert receipt["cycle_count"] == receipt["completed_cycle_count"] == 3
          assert receipt["completed_branch_count"] + receipt["incomplete_branch_count"] == 15
          assert receipt["terminal_safety_status"] in {"PASS", "FAIL_CLOSED"}
          assert (receipt["global_stop_code"] is None) == (
              receipt["terminal_safety_status"] == "PASS"
          )
          if receipt["status"] == "REAL_DATA_COMPLETE":
              assert receipt["terminal_safety_status"] == "PASS"
          assert receipt["provider_requests_new"] <= 15
          assert receipt["provider_requests_cumulative"] <= 40
          credits_upper = receipt["provider_credits_cumulative_upper_bound"]
          if credits_upper is None:
              assert receipt["status"] != "REAL_DATA_COMPLETE"
              assert receipt["consumption"]["accounting_status"] == (
                  "UNBOUNDED_COST_HEADER_MISSING_STOPPED_WITH_PRIOR_RESERVE"
              )
          else:
              assert credits_upper <= 60
          assert receipt["automatic_retries"] == 0
          assert receipt["purchases"] == receipt["real_bets"] == 0
          assert receipt["backfills"] == receipt["promotions"] == 0
          assert receipt["effect_accounting"]["r2_put_requests"] <= 34
          assert receipt["effect_accounting"]["r2_get_requests"] <= 34
          assert report["retention"]["raw_payloads"] == "R2_IMMUTABLE_PRIVATE_ONLY"
          assert report["retention"]["normalization_source"] == "R2_EXACT_READBACK_ONLY"
          assert "raw_payload_base64" not in json.dumps(report)
          assert receipt["private_json_sha256"] == hashlib.sha256(
              (root / "robin-real-data.json").read_bytes()
          ).hexdigest()
          assert receipt["csv_sha256"] == hashlib.sha256(
              (root / "robin-real-data.csv").read_bytes()
          ).hexdigest()
          assert receipt["html_sha256"] == hashlib.sha256(
              (root / "robin-real-data.html").read_bytes()
          ).hexdigest()
          with (root / "robin-real-data.csv").open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == receipt["row_count"]

          lines = [
              "# Robin — résultat données réelles",
              "",
              f"- Statut : `{receipt['status']}`",
              f"- Sécurité terminale : `{receipt['terminal_safety_status']}`",
              f"- Code d’arrêt global : `{receipt['global_stop_code']}`",
              f"- Cycles : `{receipt['completed_cycle_count']}/3`",
              f"- Captures relues/rejouées : `{receipt['validated_capture_count']}`",
              f"- Branches complètes : `{receipt['completed_branch_count']}/15`",
              f"- Lignes : `{receipt['row_count']}`",
              f"- Requêtes nouvelles / cumulatives : `{receipt['provider_requests_new']}` / `{receipt['provider_requests_cumulative']}`",
              f"- Crédits nouveaux exacts : `{receipt['provider_credits_new_exact']}`",
              f"- Crédits cumulatifs (borne haute) : `{receipt['provider_credits_cumulative_upper_bound']}`",
              f"- Premier instant de capture vérifiée : `{receipt['first_verified_capture_time_utc']}`",
              "",
              "Le tableau HTML et le CSV normalisés sont dans l’artifact de ce run; les payloads bruts restent exclusivement dans R2.",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Upload directly consultable normalized table
        id: upload
        if: ${{ always() && !cancelled() && steps.validate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robin-real-data-result-${{ github.run_id }}
          path: ${{ runner.temp }}/real-data-result
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

      - name: Preserve exact terminal outcome
        id: terminal
        if: ${{ always() }}
        shell: bash
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CAPTURE_OUTCOME" == "success" \
             && "$VALIDATE_OUTCOME" == "success" \
             && "$UPLOAD_OUTCOME" == "success" ]]; then
            exit 0
          fi
          echo "REAL_DATA_RESULT_DELIVERY_INCOMPLETE" >&2
          exit 1

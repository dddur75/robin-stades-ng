name: "24 - Scientific Model Arena"
on:
  workflow_dispatch:
    inputs:
      run-external-validation:
        description: "Exécuter aussi le Jalon 8 depuis une branche pré-fusion"
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows:
      - "23 - Feature Factory"
    types: [completed]
  schedule:
    - cron: "17 3 * * 3"
permissions:
  contents: write
concurrency:
  group: historical-state
  cancel-in-progress: false
jobs:
  training:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Geler Jalon 6 et exécuter l'arène sans fournisseur
        run: |
          if [ ! -f data/historical/datasets/api_team_pre_match_v1.json ]; then
            python scripts/run_historical_pipeline.py \
              --run-id "${{ github.run_id }}" readiness
            python scripts/run_historical_pipeline.py \
              --run-id "${{ github.run_id }}" datasets
          fi
          if [ ! -f data/historical/models/jalon6-run.json ]; then
            python scripts/run_historical_pipeline.py \
              --run-id "${{ github.run_id }}" model-lab
          fi
          python scripts/run_historical_pipeline.py \
            --max-calls 0 \
            --run-id "${{ github.run_id }}" scientific-arena
      - name: Exécuter la validation externe pré-fusion sans fournisseur
        if: github.event_name == 'workflow_dispatch' && inputs.run-external-validation
        run: >-
          python scripts/run_external_validation.py
          --state data/historical
          --run-id "${{ github.run_id }}"
          --source-commit "${{ github.sha }}"
      - uses: ./.github/actions/historical-state-persist
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}

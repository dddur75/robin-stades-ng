name: "86 - Phase C Raw Field Census"

on:
  workflow_dispatch:
    inputs:
      execution_sha:
        description: "Exact activated Phase C branch SHA"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: p0-phase-c-raw-field-census
  cancel-in-progress: false

env:
  PHASE_C_BRANCH: codex/hypothesis-tag-mask-pair-factory-v1
  SOURCE_RUN_ID: "30853757779"
  API_FOOTBALL_CALLS_ALLOWED: "0"
  ODDS_CREDITS_ALLOWED: "0"
  REMOTE_SQL_ALLOWED: "0"
  R2_GET_ALLOWED: "0"
  R2_LIST_ALLOWED: "0"
  R2_HEAD_ALLOWED: "0"
  R2_WRITES_ALLOWED: "0"
  R2_DELETES_ALLOWED: "0"
  TRIPLE_SEARCH_LOCKED: "true"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.execution_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Require trusted-main activation and exact branch head
        env:
          EXECUTION_SHA: ${{ inputs.execution_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXECUTION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXECUTION_SHA}"
          test "$(git ls-remote origin "refs/heads/${PHASE_C_BRANCH}" | cut -f1)" = "${EXECUTION_SHA}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          activation = json.loads(Path("configs/execution/phase-c-execution-activation-v1.json").read_text())
          if activation["activation_status"] != "ACTIVE": raise SystemExit("PHASE_C_ACTIVATION_HOLD")
          if activation["allowed_execution_sha"] != os.environ["EXECUTION_SHA"]: raise SystemExit("ACTIVATED_SHA_MISMATCH")
          lock = json.loads(Path("configs/execution/p0-e3-artifact-lock-v1.json").read_text())
          if lock["source_run_id"] != 30853757779 or lock["source_run_attempt"] != 1: raise SystemExit("SOURCE_RUN_LOCK_MISMATCH")
          if lock["mission_source_bytes"] != 95006161 or len(lock["artifacts"]) != 5: raise SystemExit("SOURCE_BUDGET_OR_CARDINALITY_MISMATCH")
          PY
          unshare --user --map-root-user --net true

  census:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.execution_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          artifact-ids: 8875626108,8875918562,8876203323,8875016575,8875329908
          path: _phase_c/source
      - name: Census in a network-isolated namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _phase_c/raw-field-census
          unshare --user --map-root-user --net -- python scripts/run_hypothesis_tag_mask_pair_factory.py census --source-root _phase_c/source --output-root _phase_c/raw-field-census --store-root "$RUNNER_TEMP/robin-phase-c-census" --skip-benchmark
          cp "$RUNNER_TEMP/robin-phase-c-census/checkpoint-v1.json" _phase_c/raw-field-census/checkpoint-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-c-raw-field-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _phase_c/raw-field-census/reports/data-quality/raw-field-census-v1.json
            _phase_c/raw-field-census/reports/data-quality/unmapped-field-registry-v1.json
            _phase_c/raw-field-census/reports/data-quality/external-data-gap-registry-v1.json
            _phase_c/raw-field-census/checkpoint-v1.json
          if-no-files-found: error
          retention-days: 90

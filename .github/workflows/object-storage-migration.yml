name: "30 - Migration object storage"
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Exécuter la double écriture (sinon dry-run)"
        type: boolean
        default: false
      max_files:
        type: number
        default: 100
permissions:
  contents: write
concurrency:
  group: historical-state
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Migration bornée sans suppression
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: >-
          python scripts/migrate_object_storage.py
          --state data/historical
          --max-files "${{ inputs.max_files }}"
          ${{ inputs.execute && '--execute' || '' }}
      - uses: ./.github/actions/historical-state-persist
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}

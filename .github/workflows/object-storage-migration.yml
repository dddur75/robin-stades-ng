name: "30 - Migration object storage"
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Exécuter la double écriture (sinon dry-run)"
        type: boolean
        default: false
      max_files:
        type: number
        default: 25
      resume:
        description: "Reprendre depuis le checkpoint durable"
        type: boolean
        default: false
      start_after:
        description: "Clé exacte après laquelle reprendre (optionnel)"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: historical-state
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Migration bornée sans suppression
        id: object_storage_migration
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ inputs.execute && secrets.R2_ACCOUNT_ID || '' }}
          R2_ACCESS_KEY_ID: ${{ inputs.execute && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ inputs.execute && secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_BUCKET_NAME: ${{ inputs.execute && secrets.R2_BUCKET_NAME || '' }}
          R2_MIGRATION_START_AFTER: ${{ inputs.start_after }}
        run: |
          args=(
            --state data/historical
            --max-files "${{ inputs.max_files }}"
          )
          if [ "${{ inputs.resume }}" = "true" ]; then
            args+=(--resume)
          fi
          if [ -n "$R2_MIGRATION_START_AFTER" ]; then
            args+=(--start-after "$R2_MIGRATION_START_AFTER")
          fi
          if [ "${{ inputs.execute }}" = "true" ]; then
            args+=(--execute)
          fi
          python scripts/migrate_object_storage.py "${args[@]}"
      - uses: ./.github/actions/historical-state-persist
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}
      - name: Échouer après persistance d'un rapport R2 en erreur
        if: steps.object_storage_migration.outcome == 'failure'
        run: |
          echo "::error::La migration R2 a échoué; le rapport a été persisté."
          exit 1

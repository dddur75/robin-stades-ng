name: "30 - Migration object storage"
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Exécuter la double écriture (sinon dry-run)"
        type: boolean
        default: false
      max_files:
        type: number
        default: 25
      resume:
        description: "Reprendre depuis le checkpoint durable"
        type: boolean
        default: false
      start_after:
        description: "Clé exacte après laquelle reprendre (optionnel)"
        type: string
        default: ""
      max_batches_per_run:
        description: "Nombre maximal de lots enchaînés sous le même verrou"
        type: number
        default: 1
      audit:
        description: "Relire sans écriture tout le périmètre avec un checkpoint séparé"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: historical-state
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Valider le mode d'enchaînement
        if: (inputs.max_batches_per_run > 1 || inputs.audit) && !inputs.resume
        run: |
          echo "::error::L'enchaînement et l'audit exigent resume=true"
          exit 1
      - name: Migration bornée sans suppression
        id: object_storage_migration
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ inputs.execute && secrets.R2_ACCOUNT_ID || '' }}
          R2_ACCESS_KEY_ID: ${{ inputs.execute && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ inputs.execute && secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_BUCKET_NAME: ${{ inputs.execute && secrets.R2_BUCKET_NAME || '' }}
          R2_MIGRATION_START_AFTER: ${{ inputs.start_after }}
        run: |
          for ((batch=1; batch<=${{ inputs.max_batches_per_run }}; batch++)); do
            args=(
              --state data/historical
              --max-files "${{ inputs.max_files }}"
            )
            if [ "${{ inputs.resume }}" = "true" ]; then
              args+=(--resume)
            fi
            if [ "${{ inputs.audit }}" = "true" ]; then
              args+=(--audit)
            fi
            if [ "$batch" = "1" ] && [ -n "$R2_MIGRATION_START_AFTER" ]; then
              args+=(--start-after "$R2_MIGRATION_START_AFTER")
            fi
            if [ "${{ inputs.execute }}" = "true" ]; then
              args+=(--execute)
            fi
            python scripts/migrate_object_storage.py "${args[@]}"
            complete="$(python -c "import json; print(str(json.load(open('data/historical/storage/r2-migration-latest.json'))['complete']).lower())")"
            if [ "$complete" = "true" ]; then
              break
            fi
          done
      - uses: ./.github/actions/historical-r2-control-persist
        with:
          run-id: ${{ github.run_id }}
      - name: Échouer après persistance d'un rapport R2 en erreur
        if: steps.object_storage_migration.outcome == 'failure'
        run: |
          echo "::error::La migration R2 a échoué; le rapport a été persisté."
          exit 1

name: "61 - Robin autonomous lab — established scheduler"

on:
  schedule:
    - cron: "13 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: robin-autonomous-lab-20261004-global
  cancel-in-progress: false

env:
  STORAGE_PAUSED: "true"
  P3_P4_PAUSED: "true"
  PRODUCTION_LOCKED: "true"
  REAL_BETS: "false"
  NO_BET_DEFAULT: "true"
  PROMOTION_LOCKED: "true"
  SOCIAL_PUBLISHING_ENABLED: "false"
  DEMO_MODE_ENABLED: "false"
  API_FOOTBALL_CALLS_ALLOWED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  capture:
    if: >-
      github.event_name == 'schedule' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify current authority and retire every prior provider route
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: "98b1538384f942d54535517e445ab2e9bf347e080b7f20bc92f3bb02aaede00a"
          EXPECTED_SOURCE_SHA256: "c611e5cfdb2fb6bc2b1a6238e7bc8ec94191d4841c9cad177abcf6bb8662a813"
          EXPECTED_SCHEDULE_MANIFEST_SHA256: "0905b3044849b81ea0f574f066e8ae132e61f0deb5412a8a6743d2ab0c15e0bc"
          EXPECTED_SCHEDULE_SOURCE_SHA256: "7e654d17751685b62aff5ab0a7c9d0460feaabd8b304f1ee80c5fd80596cd65c"
          EXPECTED_ESTABLISHED_MANIFEST_SHA256: "c1e3375370f55f288aaa76a5e706939e5617a54dc61598f85a510fc9d3be14fd"
          EXPECTED_ESTABLISHED_SOURCE_SHA256: "2cf16116c41803c3300bee2fc7cc3cc501b09fa5f80c6c27affce08589e5f84e"
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == "dddur75/robin-stades-ng" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_EVENT_NAME" == "schedule" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "dddur75/robin-stades-ng/.github/workflows/prospective-deep-scheduler.yml@refs/heads/main" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$GITHUB_SHA" == "$current_main_sha" ]]
          [[ "$(sha256sum configs/execution/robin-autonomous-lab-20261004.json | cut -d' ' -f1)" == "$EXPECTED_MANIFEST_SHA256" ]]
          [[ "$(sha256sum docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-2026-10-04.md | cut -d' ' -f1)" == "$EXPECTED_SOURCE_SHA256" ]]
          [[ "$(sha256sum configs/execution/robin-autonomous-lab-schedule-reliability-20261004.json | cut -d' ' -f1)" == "$EXPECTED_SCHEDULE_MANIFEST_SHA256" ]]
          [[ "$(sha256sum docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-SCHEDULE-RELIABILITY-2026-10-04.md | cut -d' ' -f1)" == "$EXPECTED_SCHEDULE_SOURCE_SHA256" ]]
          [[ "$(sha256sum configs/execution/robin-autonomous-lab-established-scheduler-20261004.json | cut -d' ' -f1)" == "$EXPECTED_ESTABLISHED_MANIFEST_SHA256" ]]
          [[ "$(sha256sum docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-ESTABLISHED-SCHEDULER-2026-10-04.md | cut -d' ' -f1)" == "$EXPECTED_ESTABLISHED_SOURCE_SHA256" ]]
          python -I - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          current_workflow = json.loads(
              subprocess.run(
                  [
                      "gh", "api",
                      "repos/dddur75/robin-stades-ng/actions/workflows/321915839",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
          )
          assert current_workflow["id"] == 321915839
          assert current_workflow["path"] == (
              ".github/workflows/prospective-deep-scheduler.yml"
          )
          assert current_workflow["state"] == "active"

          expected_workflows = {
              308531686: "03_archive.yml",
              319598077: "collect-fixtures.yml",
              319598078: "collect-odds.yml",
              319598079: "daily-health.yml",
              319598080: "post-match-settlement.yml",
              319598083: "pre-match-shadow.yml",
              319799017: "shadow-diagnostics.yml",
              321915844: "prospective-odds-capture.yml",
              345580923: "data-torrent-live-v1.yml",
              373855898: "90-reprise-collecte-pilot.yml",
              374107131: "91-robin-real-data-result.yml",
              374470410: "92-robin-autonomous-lab.yml",
          }
          for workflow_id, filename in expected_workflows.items():
              response = json.loads(
                  subprocess.run(
                      [
                          "gh", "api",
                          f"repos/dddur75/robin-stades-ng/actions/workflows/{workflow_id}",
                      ],
                      check=True,
                      capture_output=True,
                      text=True,
                  ).stdout
              )
              assert response["id"] == workflow_id
              assert response["path"] == f".github/workflows/{filename}"
              assert response["state"] == "disabled_manually"

          manifest_path = Path("configs/execution/robin-autonomous-lab-20261004.json")
          source_path = Path("docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-2026-10-04.md")
          schedule_manifest_path = Path(
              "configs/execution/robin-autonomous-lab-schedule-reliability-20261004.json"
          )
          schedule_source_path = Path(
              "docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-SCHEDULE-RELIABILITY-2026-10-04.md"
          )
          established_manifest_path = Path(
              "configs/execution/robin-autonomous-lab-established-scheduler-20261004.json"
          )
          established_source_path = Path(
              "docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-ESTABLISHED-SCHEDULER-2026-10-04.md"
          )
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          schedule_manifest = json.loads(
              schedule_manifest_path.read_text(encoding="utf-8")
          )
          established_manifest = json.loads(
              established_manifest_path.read_text(encoding="utf-8")
          )
          assert set(manifest) == {
              "mission_id", "authorized_stages", "maximum_stage", "external_effects",
              "compute_budget", "time_budget", "source_hash", "expires_at",
          }
          assert manifest["mission_id"] == "ROBIN_AUTONOMOUS_LAB_20261004"
          assert manifest["authorized_stages"] == ["E1", "E2", "E3A", "E3B"]
          assert manifest["maximum_stage"] == "E3B"
          assert manifest["source_hash"] == os.environ["EXPECTED_SOURCE_SHA256"]
          assert set(schedule_manifest) == set(manifest)
          assert set(established_manifest) == set(manifest)
          assert schedule_manifest["mission_id"] == (
              "ROBIN_AUTONOMOUS_LAB_SCHEDULE_RELIABILITY_20261004"
          )
          assert schedule_manifest["authorized_stages"] == manifest["authorized_stages"]
          assert schedule_manifest["maximum_stage"] == manifest["maximum_stage"] == "E3B"
          assert schedule_manifest["compute_budget"] == manifest["compute_budget"]
          assert schedule_manifest["time_budget"] == manifest["time_budget"]
          assert schedule_manifest["expires_at"] == manifest["expires_at"]
          assert schedule_manifest["source_hash"] == os.environ[
              "EXPECTED_SCHEDULE_SOURCE_SHA256"
          ]
          assert set(schedule_manifest["external_effects"]) == {
              "github_actions_schedule_hourly_minute_37",
              "github_actions_schedule_reuses_parent_two_hour_idempotent_slots",
              "github_actions_duplicate_closed_slot_zero_provider_dispatch",
              "github_actions_parent_rolling_budgets_unchanged",
          }
          assert established_manifest["mission_id"] == (
              "ROBIN_AUTONOMOUS_LAB_ESTABLISHED_SCHEDULER_20261004"
          )
          assert established_manifest["authorized_stages"] == manifest["authorized_stages"]
          assert established_manifest["maximum_stage"] == manifest["maximum_stage"] == "E3B"
          assert established_manifest["compute_budget"] == manifest["compute_budget"]
          assert established_manifest["time_budget"] == manifest["time_budget"]
          assert established_manifest["expires_at"] == manifest["expires_at"]
          assert established_manifest["source_hash"] == os.environ[
              "EXPECTED_ESTABLISHED_SOURCE_SHA256"
          ]
          assert set(established_manifest["external_effects"]) == {
              "github_actions_established_workflow_id_321915839",
              "github_actions_schedule_hourly_minute_13",
              "github_actions_prior_workflow_id_374470410_disabled",
              "github_actions_schedule_reuses_parent_two_hour_idempotent_slots",
              "github_actions_parent_rolling_budgets_unchanged",
          }
          expires = datetime.datetime.fromisoformat(
              manifest["expires_at"].replace("Z", "+00:00")
          )
          assert datetime.datetime.now(datetime.UTC) + datetime.timedelta(hours=3) <= expires
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_MANIFEST_SHA256"
          ]
          assert hashlib.sha256(source_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_SOURCE_SHA256"
          ]
          assert hashlib.sha256(schedule_manifest_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_SCHEDULE_MANIFEST_SHA256"
          ]
          assert hashlib.sha256(schedule_source_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_SCHEDULE_SOURCE_SHA256"
          ]
          assert hashlib.sha256(established_manifest_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_ESTABLISHED_MANIFEST_SHA256"
          ]
          assert hashlib.sha256(established_source_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_ESTABLISHED_SOURCE_SHA256"
          ]
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Install exact existing runtime dependencies
        id: install
        run: >-
          python -I -m pip install --only-binary=:all: --require-hashes -r requirements-data-torrent.lock

      - name: Prepare normalized delivery directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RUNNER_TEMP/robin-autonomous-lab"

      - name: Collect one admitted recurring slot
        id: capture
        continue-on-error: true
        shell: bash
        env:
          THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          python -I scripts/run_recurring_real_data.py \
            --execute ROBIN_AUTONOMOUS_LAB_20261004 \
            --manifest configs/execution/robin-autonomous-lab-20261004.json \
            --output-directory "$RUNNER_TEMP/robin-autonomous-lab"

      - name: Validate normalized delivery and publish run summary
        id: validate
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "robin-autonomous-lab"
          expected = {
              "public-receipt.json", "robin-real-data.json",
              "robin-real-data.csv", "robin-real-data.html",
          }
          descendants = list(root.rglob("*"))
          if any(path.is_symlink() or not path.is_file() for path in descendants):
              raise RuntimeError("RECURRING_NORMALIZED_TREE_INVALID")
          observed = {path.relative_to(root).as_posix() for path in descendants}
          missing = sorted(expected - observed)
          unexpected_count = len(observed - expected)
          if missing or unexpected_count:
              raise RuntimeError(
                  "RECURRING_NORMALIZED_FILE_SET_INVALID "
                  f"missing={','.join(missing) or 'none'} "
                  f"unexpected_count={unexpected_count}"
              )
          receipt = json.loads((root / "public-receipt.json").read_text(encoding="utf-8"))
          snapshot = json.loads((root / "robin-real-data.json").read_text(encoding="utf-8"))
          RECURRING_CLAIM_IDS = [
              "DATA.ROBIN.AUTONOMOUS_LAB.RECURRING_CAPTURES.V1.001",
              "DATA.ROBIN.AUTONOMOUS_LAB.RECURRING_VIEW.V1.001",
              "GOV.ROBIN.AUTONOMOUS_LAB.RECURRING_CONSUMPTION.V1.001",
          ]
          SEED_CLAIM_IDS = [
              "DATA.ROBIN.AUTONOMOUS_LAB.SEED_CAPTURES.V1.001",
              "DATA.ROBIN.AUTONOMOUS_LAB.SEED_VIEW.V1.001",
              "GOV.ROBIN.AUTONOMOUS_LAB.SEED_CONSUMPTION.V1.001",
          ]
          assert receipt["mission_id"] == "ROBIN_AUTONOMOUS_LAB_20261004"
          assert receipt["delivery_repository_sha"] == os.environ["GITHUB_SHA"]
          assert receipt["delivery_github_run_id"] == os.environ["GITHUB_RUN_ID"]
          assert receipt["status"] in {
              "REAL_DATA_COMPLETE", "REAL_DATA_PARTIAL", "REAL_DATA_FAILED"
          }
          if receipt["status"] in {"REAL_DATA_COMPLETE", "REAL_DATA_PARTIAL"}:
              assert receipt["validated_capture_count"] > 0
          assert receipt["provider_requests_new"] <= 5
          assert receipt["provider_requests_reserved"] == 5
          assert receipt["provider_credits_reserved"] == 10
          assert receipt["rolling_24h_requests"] <= 140
          assert receipt["rolling_24h_credits"] <= 280
          assert receipt["rolling_30d_requests"] <= 4000
          assert receipt["rolling_30d_credits"] <= 8000
          assert isinstance(receipt["credit_bound_valid"], bool)
          assert receipt["automatic_retries"] == 0
          assert receipt["purchases"] == receipt["real_bets"] == 0
          assert receipt["backfills"] == receipt["promotions"] == 0
          assert receipt["private_report_r2_status"] == "VERIFIED"
          assert snapshot["schema_version"] == "robin-real-data-dashboard-v1"
          assert snapshot["mission_id"] == "ROBIN_AUTONOMOUS_LAB_20261004"
          assert len(snapshot["rows"]) == receipt["display_row_count"]
          assert snapshot["summary"]["row_count"] == receipt["display_row_count"]
          assert snapshot["data_role"] == receipt["display_data_role"]
          assert snapshot["data_slot_start_utc"] == receipt["display_data_slot_start_utc"]
          assert receipt["claim_ids"] == snapshot["claim_ids"]
          assert receipt["claim_ids"] in [
              RECURRING_CLAIM_IDS,
              RECURRING_CLAIM_IDS + SEED_CLAIM_IDS,
          ]
          if snapshot["data_role"] == "CURRENT":
              assert receipt["display_row_count"] == receipt["row_count"]
          else:
              assert snapshot["data_role"] == "CARRY_FORWARD_STALE"
              assert snapshot["collection_health"] == "FAILED"
              assert snapshot["freshness"]["status"] == "STALE"
              assert snapshot["data_slot_start_utc"] < receipt["slot_start_utc"]
              assert receipt["row_count"] == 0
          serialized = json.dumps(snapshot, sort_keys=True)
          assert "raw_payload_base64" not in serialized
          assert "raw_object_key" not in serialized
          assert '"branches"' not in serialized
          assert receipt["normalized_json_sha256"] == hashlib.sha256(
              (root / "robin-real-data.json").read_bytes()
          ).hexdigest()
          assert receipt["csv_sha256"] == hashlib.sha256(
              (root / "robin-real-data.csv").read_bytes()
          ).hexdigest()
          assert receipt["html_sha256"] == hashlib.sha256(
              (root / "robin-real-data.html").read_bytes()
          ).hexdigest()
          with (root / "robin-real-data.csv").open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == receipt["display_row_count"]

          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          lines = [
              "# Robin — laboratoire autonome",
              "",
              f"- Statut : `{receipt['status']}`",
              f"- Créneau UTC : `{receipt['slot_start_utc']}`",
              f"- Captures vérifiées : `{receipt['validated_capture_count']}/5`",
              f"- Lignes du créneau / affichées : `{receipt['row_count']}` / `{receipt['display_row_count']}`",
              f"- Requêtes glissantes 24 h : `{receipt['rolling_24h_requests']}/140`",
              f"- Crédits glissants 24 h : `{receipt['rolling_24h_credits']}/280`",
              f"- Claim IDs : `{', '.join(receipt['claim_ids'])}`",
              f"- Run : {run_url}",
              "",
              "Le tableau HTML, le JSON normalisé et le CSV sont dans l’artifact de ce run. Le brut et le rapport privé restent dans R2.",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Upload consultable normalized table
        id: upload
        if: ${{ always() && !cancelled() && steps.validate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robin-autonomous-lab-${{ github.run_id }}
          path: ${{ runner.temp }}/robin-autonomous-lab
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

      - name: Preserve exact terminal outcome
        id: terminal
        if: ${{ always() }}
        shell: bash
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CAPTURE_OUTCOME" == "success" \
             && "$VALIDATE_OUTCOME" == "success" \
             && "$UPLOAD_OUTCOME" == "success" ]]; then
            exit 0
          fi
          echo "RECURRING_DELIVERY_INCOMPLETE" >&2
          exit 1

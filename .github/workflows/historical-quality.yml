name: "22 - Qualité historique"
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"
permissions:
  contents: write
concurrency:
  group: historical-state
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Repair provenance from the durable cache
        run: >-
          python scripts/run_historical_pipeline.py
          --run-id "${{ github.run_id }}"
          repair-provenance
      - run: >-
          python scripts/run_historical_pipeline.py
          --run-id "${{ github.run_id }}" quality
      - name: Recalculate the forecast after quality controls
        run: >-
          python scripts/run_historical_pipeline.py
          --run-id "${{ github.run_id }}"
          forecast
      - uses: ./.github/actions/historical-state-persist
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}

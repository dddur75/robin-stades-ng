name: "31 - Test restauration R2"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: historical-state
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Restaurer un échantillon représentatif dans un dossier vide
        id: r2_restore
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          restore_root="$(mktemp -d)"
          python scripts/restore_object_storage.py \
            --state data/historical \
            --destination "$restore_root"
      - uses: ./.github/actions/historical-state-persist
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}
      - name: Échouer après persistance d'un rapport de restauration en erreur
        if: steps.r2_restore.outcome == 'failure'
        run: |
          echo "::error::La restauration R2 a échoué; le rapport a été persisté."
          exit 1

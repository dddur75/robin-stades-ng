name: "53 - Matchup Validation"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-research-state
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_FOOTBALL_CALLS_ALLOWED: "0"
      ODDS_API_CREDITS_ALLOWED: "0"
      STORAGE_PAUSED: "true"
      P3_P4_PAUSED: "true"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Construire puis red-team
        run: >-
          python scripts/run_deep_football.py all
          --state data/historical
          --output artifacts/matchup-validation
          --source-commit "$(git -C .historical-registry rev-parse HEAD)"
          --main-commit "${{ github.sha }}"
          --main-ci-run-id "${{ github.run_id }}"
      - name: Rejouer la validation sans fournisseur
        run: >-
          python scripts/run_deep_football.py all
          --state data/historical
          --output artifacts/matchup-validation
          --source-commit "$(git -C .historical-registry rev-parse HEAD)"
          --main-commit "${{ github.sha }}"
          --main-ci-run-id "${{ github.run_id }}"
          --replay
      - name: Tester les contrôles scientifiques
        run: python -m pytest -q tests/jalon11
      - name: Vérifier multiplicité, négatifs et rejet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/matchup-validation")
          campaign = json.loads(
              (root / "campaign-11a-summary.json").read_text()
          )
          red_team = json.loads((root / "red-team-report.json").read_text())
          replay = json.loads((root / "replay.json").read_text())
          statistics = campaign["statistics"]
          assert 0.0 <= statistics["family_q"] <= 1.0
          assert statistics["family_q"] > 0.05
          assert statistics["global_q"] == 1.0
          assert statistics["multiplicity_hypotheses"] == 9
          assert statistics["tested_hypotheses"] == 1
          assert statistics["blocked_hypotheses_as_p1"] == 8
          impossible = campaign["negative_controls"]["impossible_condition"]
          assert impossible["predicate"] == "OUTCOME_IS_HOME_AND_AWAY"
          assert impossible["rows_examined"] == campaign["paired_1x2_rows"]
          assert impossible["support"] == 0
          assert impossible["promotion_eligible"] is False
          assert campaign["promotion"]["promoted"] is False
          assert campaign["promotion"]["status"] == "REJECTED"
          assert red_team["promotion_allowed"] is False
          assert not red_team["major_unresolved_objections"]
          assert replay["identical"] is True
          assert replay["provider_calls"] == 0
          assert replay["odds_api_credits"] == 0
          assert replay["business_duplicates"] == 0
          assert replay["data_loss"] == 0
          assert replay["hash_mismatches"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: matchup-validation-${{ github.run_id }}
          path: artifacts/matchup-validation
          retention-days: 90
          compression-level: 9

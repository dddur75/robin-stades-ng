name: "Data Torrent Live V1"

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact merged main SHA authorized for the one-shot run"
        required: true
        type: string
      expected_workflow_sha256:
        description: "SHA-256 of this exact workflow blob"
        required: true
        type: string
      expected_mission_manifest_sha256:
        description: "SHA-256 of the immutable eight-field mission authorization"
        required: true
        type: string
      expected_generation_hash:
        description: "Non-secret hash of the active Chronos generation"
        required: true
        type: string
      post_merge_ci_sha:
        description: "Exact main SHA whose post-merge CI is green"
        required: true
        type: string
      verify_run_id:
        description: "Exact successful Chronos VERIFY run attested before effects"
        required: true
        type: string

concurrency:
  group: data-torrent-live-v1
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  STORAGE_PAUSED: "true"
  P3_P4_PAUSED: "true"
  PRODUCTION_LOCKED: "true"
  REAL_BETS: "false"
  NO_BET_DEFAULT: "true"
  PROMOTION_LOCKED: "true"
  SOCIAL_PUBLISHING_ENABLED: "false"
  DEMO_MODE_ENABLED: "false"
  POSTGRESQL_PRODUCTION_DESTRUCTIVE_WRITES: "false"
  THE_ODDS_API_HISTORICAL_CREDITS: "false"
  API_FOOTBALL_CALLS_ALLOWED: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse an ambiguous, stale, or rerun dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MISSION_MANIFEST_SHA256: ${{ inputs.expected_mission_manifest_sha256 }}
          POST_MERGE_CI_SHA: ${{ inputs.post_merge_ci_sha }}
          VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$POST_MERGE_CI_SHA" == "$EXPECTED_MAIN_SHA" ]]
          [[ "$VERIFY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_MISSION_MANIFEST_SHA256" == "22e64bb33bd54aeeb528a416c7f6d0ca1c0719a27677302b8065249923ca96e7" ]]
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$CURRENT_MAIN_SHA" == "$EXPECTED_MAIN_SHA" ]]

  torrent:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: chronos-control-plane-production
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.expected_main_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-data-torrent.lock
      - name: Install the exact bounded runtime
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r requirements-data-torrent.lock
      - name: Verify the installed dependency closure
        run: |
          python -m pip check
          python - <<'PY'
          import alembic, boto3, psycopg, pydantic, pypdf, requests, sqlalchemy
          import robin.data_torrent.runtime
          assert all((alembic, boto3, psycopg, pydantic, pypdf, requests, sqlalchemy))
          PY
      - name: Attest and download the exact successful Chronos VERIFY artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: >-
          python scripts/github_release_attestation_v1.py
          --workflow-path .github/workflows/chronos-production-bootstrap-v3.yml
          --run-id "$VERIFY_RUN_ID" --main-sha "$EXPECTED_MAIN_SHA"
          --artifact-name "chronos-verify-v3-$VERIFY_RUN_ID"
          --artifact-filename chronos-production-verify-v3.json
          --output .torrent/release/chronos-production-verify-v3.json
          --report .torrent/release/github-verify-artifact-attestation-v1.json
      - name: Revalidate the protected GitHub workflow hold
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRED_SUCCESSFUL_CI_SHA: ${{ inputs.post_merge_ci_sha }}
        run: |
          python scripts/check_chronos_github_hold_v3.py \
            --report .torrent/hold/chronos-production-workflow-hold-live-v3.json \
            --required-successful-ci-sha "$REQUIRED_SUCCESSFUL_CI_SHA"
      - name: Revalidate current main immediately before the one-shot effect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$CURRENT_MAIN_SHA" == "$EXPECTED_MAIN_SHA" ]]
      - name: Execute the single real data torrent
        env:
          CHRONOS_AUTHORITY_DATABASE_URL: ${{ secrets.CHRONOS_AUTHORITY_DATABASE_URL }}
          CHRONOS_RUNTIME_DATABASE_URL: ${{ secrets.CHRONOS_RUNTIME_DATABASE_URL }}
          CHRONOS_READER_DATABASE_URL: ${{ secrets.CHRONOS_READER_DATABASE_URL }}
          CHRONOS_CONTROL_PLANE_GENERATION_NONCE: ${{ secrets.CHRONOS_CONTROL_PLANE_GENERATION_NONCE }}
          DATA_TORRENT_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          DATA_TORRENT_EXPECTED_WORKFLOW_SHA256: ${{ inputs.expected_workflow_sha256 }}
          DATA_TORRENT_MISSION_MANIFEST: configs/execution/data-torrent-ready-v1.json
          DATA_TORRENT_EXPECTED_MISSION_MANIFEST_SHA256: ${{ inputs.expected_mission_manifest_sha256 }}
          DATA_TORRENT_EXPECTED_GENERATION_HASH: ${{ inputs.expected_generation_hash }}
          DATA_TORRENT_POST_MERGE_CI_SHA: ${{ inputs.post_merge_ci_sha }}
          DATA_TORRENT_EXPECTED_VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
          DATA_TORRENT_VERIFY_ARTIFACT: .torrent/release/chronos-production-verify-v3.json
          DATA_TORRENT_HOLD_REPORT: .torrent/hold/chronos-production-workflow-hold-live-v3.json
          THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: >-
          python scripts/run_data_torrent_v1.py
          --output-dir .torrent/artifacts
      - name: Publish sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-torrent-live-v1-${{ github.run_id }}
          path: |
            .torrent/artifacts/**
            .torrent/hold/**
            .torrent/release/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

name: "71 - Fixture Bundle Harvest"

on:
  workflow_dispatch:
    inputs:
      competition:
        description: "Mission 027 : une des quatre ligues ; all réservé au mode habituel"
        type: string
        default: all
      lineups_only:
        description: "Mission 027 : liste figée, un appel par match, sans autre famille"
        type: boolean
        default: false
      progress_only:
        description: "Mission 027 : compter les réservations, sans fournisseur ni payload brut"
        type: boolean
        default: false
      slice_id:
        type: string
        default: standalone
      execute:
        type: boolean
        default: false
      priority:
        description: "P0, P1, P2 ou auto"
        type: choice
        options: [P0, P1, P2, auto]
        default: P0
      max_calls:
        type: number
        default: 30000
      max_duration_minutes:
        type: number
        default: 100
  workflow_call:
    inputs:
      competition:
        type: string
        default: all
      lineups_only:
        type: boolean
        default: false
      progress_only:
        type: boolean
        default: false
      slice_id:
        type: string
        default: standalone
      execute:
        type: boolean
        default: false
      priority:
        type: string
        default: P0
      max_calls:
        type: number
        default: 30000
      max_duration_minutes:
        type: number
        default: 100
    secrets:
      API_FOOTBALL_KEY:
        required: true
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET_NAME:
        required: true
    outputs:
      status:
        value: ${{ jobs['fixture-bundles'].outputs.status }}
      provider_stop:
        value: ${{ jobs['fixture-bundles'].outputs.provider_stop }}

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.progress_only && 'mission-027-progress' || inputs.lineups_only && format('mission-027-lineups-{0}', inputs.competition) || 'historical-deep-r2-state' }}
  cancel-in-progress: false

jobs:
  fixture-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.lineups_only && 200 || 110 }}
    outputs:
      status: ${{ steps.outcome.outputs.status }}
      provider_stop: ${{ steps.outcome.outputs.provider_stop }}
    env:
      MISSION027_COMPETITION: ${{ inputs.competition }}
      STORAGE_PAUSED: "true"
      P3_P4_PAUSED: "true"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      PROMOTION_LOCKED: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
      POSTGRESQL_PRODUCTION_DESTRUCTIVE_WRITES: "false"
      THE_ODDS_API_HISTORICAL_CREDITS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - name: Collecter les bundles et fallbacks ciblés
        if: '!inputs.progress_only && !inputs.lineups_only'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: >-
          python scripts/run_historical_deep_harvest.py
          --config configs/historical-deep-data-harvest-v1.json
          --output artifacts/historical-deep
          --code-revision "${GITHUB_SHA}"
          fixtures
          ${{ inputs.execute && '--execute' || '' }}
          --priority "${{ inputs.priority }}"
          --max-calls "${{ inputs.max_calls }}"
          --max-duration-minutes "${{ inputs.max_duration_minutes }}"
          --mission-max-minutes 720
      - uses: actions/download-artifact@v4
        if: inputs.lineups_only && inputs.execute && !inputs.progress_only
        with:
          name: historical-deep-71-mission-027-status-unique-38960293874-1
          run-id: 38960293874
          github-token: ${{ github.token }}
          path: artifacts/mission027-preflight
      - name: Mission 027 — compositions seules
        if: inputs.lineups_only && inputs.execute && !inputs.progress_only
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.run_mission027_lineups
      - name: Mission 027 — observation sans collecte
        if: inputs.progress_only
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.run_mission027_lineups --progress
      - name: Publier la décision provider sanitisée
        id: outcome
        if: always() && !inputs.progress_only && !inputs.lineups_only
        run: >-
          python scripts/historical_deep_workflow_outcome.py
          artifacts/historical-deep/fixtures.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-deep-71-${{ inputs.slice_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/historical-deep/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

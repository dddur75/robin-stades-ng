name: "71 - Fixture Bundle Harvest"

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      mission028:
        type: boolean
        default: false
      mission028_replay:
        type: boolean
        default: false
      mission028_progress:
        type: boolean
        default: false
      details_family:
        type: choice
        options: [none, lineups, statistics]
        default: none
      slice_id:
        type: string
        default: standalone
      execute:
        type: boolean
        default: false
      priority:
        description: "P0, P1, P2 ou auto"
        type: choice
        options: [P0, P1, P2, auto]
        default: P0
      max_calls:
        type: number
        default: 30000
      max_duration_minutes:
        type: number
        default: 100
  workflow_call:
    inputs:
      mission028:
        type: boolean
        default: false
      mission028_replay:
        type: boolean
        default: false
      mission028_progress:
        type: boolean
        default: false
      details_family:
        type: string
        default: none
      slice_id:
        type: string
        default: standalone
      execute:
        type: boolean
        default: false
      priority:
        type: string
        default: P0
      max_calls:
        type: number
        default: 30000
      max_duration_minutes:
        type: number
        default: 100
    secrets:
      API_FOOTBALL_KEY:
        required: true
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET_NAME:
        required: true
    outputs:
      status:
        value: ${{ jobs['fixture-bundles'].outputs.status }}
      provider_stop:
        value: ${{ jobs['fixture-bundles'].outputs.provider_stop }}

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mission028_progress && 'mission-028-progress' || 'historical-deep-r2-state' }}
  cancel-in-progress: false

jobs:
  fixture-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      status: ${{ steps.outcome.outputs.status }}
      provider_stop: ${{ steps.outcome.outputs.provider_stop }}
    env:
      STORAGE_PAUSED: "true"
      P3_P4_PAUSED: "true"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      PROMOTION_LOCKED: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
      POSTGRESQL_PRODUCTION_DESTRUCTIVE_WRITES: "false"
      THE_ODDS_API_HISTORICAL_CREDITS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - name: Mission 028 — choisir la reprise planifiée
        id: resume
        if: github.event_name == 'schedule'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.mission028_resume
      - name: Collecter les bundles et fallbacks ciblés
        if: github.event_name != 'schedule' && !inputs.mission028 && inputs.details_family == 'none'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: >-
          python scripts/run_historical_deep_harvest.py
          --config configs/historical-deep-data-harvest-v1.json
          --output artifacts/historical-deep
          --code-revision "${GITHUB_SHA}"
          fixtures
          ${{ inputs.execute && '--execute' || '' }}
          --priority "${{ inputs.priority }}"
          --max-calls "${{ inputs.max_calls }}"
          --max-duration-minutes "${{ inputs.max_duration_minutes }}"
          --mission-max-minutes 720
      - name: Mission 028 — correspondance des petites ligues
        if: github.event_name != 'schedule' && inputs.mission028 && (inputs.execute || inputs.mission028_progress) && inputs.details_family == 'none'
        env:
          MISSION028_REPLAY: ${{ inputs.mission028_replay }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.run_mission028 ${{ inputs.mission028_progress && '--progress' || '' }}
      - name: Mission 028 — détails par match
        if: (github.event_name == 'schedule' && steps.resume.outputs.state == 'READY') || (github.event_name != 'schedule' && !inputs.mission028 && inputs.execute && inputs.details_family != 'none')
        env:
          MISSION028_FAMILY: ${{ steps.resume.outputs.family || inputs.details_family }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python -m scripts.run_mission028_details --preflight
          pids=()
          for worker in {0..15}; do
            MISSION028_WORKER="$worker" python -m scripts.run_mission028_details &
            pids+=("$!")
          done
          result=0
          for pid in "${pids[@]}"; do wait "$pid" || result=1; done
          exit "$result"
      - name: Publier la décision provider sanitisée
        id: outcome
        if: always() && github.event_name != 'schedule' && !inputs.mission028 && inputs.details_family == 'none'
        run: >-
          python scripts/historical_deep_workflow_outcome.py
          artifacts/historical-deep/fixtures.json >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'schedule' || steps.resume.outputs.state == 'READY')
        with:
          name: historical-deep-71-${{ inputs.slice_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/historical-deep/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

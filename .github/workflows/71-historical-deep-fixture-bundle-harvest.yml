name: "71 - Fixture Bundle Harvest"

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      publication_catchup:
        description: "Rattraper les seuls objets R2 attestés, sans collecte fournisseur"
        type: boolean
        default: false
      mission029_phase:
        type: string
        default: none
      mission028:
        type: boolean
        default: false
      mission028_replay:
        type: boolean
        default: false
      mission028_progress:
        type: boolean
        default: false
      competition:
        description: "Mission 027 : une des quatre ligues ; all réservé au mode habituel"
        type: string
        default: all
      lineups_only:
        description: "Mission 027 : liste figée, un appel par match, sans autre famille"
        type: boolean
        default: false
      progress_only:
        description: "Mission 027 : compter les réservations, sans fournisseur ni payload brut"
        type: boolean
        default: false
      details_family:
        type: choice
        options: [none, lineups, statistics]
        default: none
      slice_id:
        type: string
        default: standalone
      execute:
        type: boolean
        default: false
      priority:
        description: "P0, P1, P2 ou auto"
        type: choice
        options: [P0, P1, P2, auto]
        default: P0
      max_calls:
        type: number
        default: 30000
      max_duration_minutes:
        type: number
        default: 100
  workflow_call:
    inputs:
      publication_catchup:
        type: boolean
        default: false
      mission029_phase:
        type: string
        default: none
      mission028:
        type: boolean
        default: false
      mission028_replay:
        type: boolean
        default: false
      mission028_progress:
        type: boolean
        default: false
      competition:
        type: string
        default: all
      lineups_only:
        type: boolean
        default: false
      progress_only:
        type: boolean
        default: false
      details_family:
        type: string
        default: none
      slice_id:
        type: string
        default: standalone
      execute:
        type: boolean
        default: false
      priority:
        type: string
        default: P0
      max_calls:
        type: number
        default: 30000
      max_duration_minutes:
        type: number
        default: 100
    secrets:
      API_FOOTBALL_KEY:
        required: true
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET_NAME:
        required: true
    outputs:
      status:
        value: ${{ jobs['fixture-bundles'].outputs.status }}
      provider_stop:
        value: ${{ jobs['fixture-bundles'].outputs.provider_stop }}

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ inputs.publication_catchup && 'historical-deep-r2-state' || inputs.mission028_progress && 'mission-028-progress' || inputs.progress_only && 'mission-027-progress' || inputs.lineups_only && format('mission-027-lineups-{0}', inputs.competition) || 'historical-deep-r2-state' }}
  cancel-in-progress: false

jobs:
  fixture-bundles:
    if: ${{ !inputs.publication_catchup }}
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: write}
    timeout-minutes: ${{ inputs.lineups_only && 200 || 110 }}
    outputs:
      status: ${{ steps.outcome.outputs.status }}
      provider_stop: ${{ steps.outcome.outputs.provider_stop }}
    env:
      WORKFLOW71_ADMISSION: "true"
      MISSION029_PHASE: ${{ inputs.mission029_phase || 'auto' }}
      MISSION027_COMPETITION: ${{ inputs.competition }}
      STORAGE_PAUSED: "true"
      P3_P4_PAUSED: "true"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      PROMOTION_LOCKED: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
      POSTGRESQL_PRODUCTION_DESTRUCTIVE_WRITES: "false"
      THE_ODDS_API_HISTORICAL_CREDITS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - name: Mission 028 — choisir la reprise planifiée
        id: resume
        if: github.event_name == 'schedule'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.mission028_resume
      - name: Mission 029 — détail absolu
        id: mission029
        if: "(github.event_name == 'schedule' && steps.resume.outputs.state != 'READY') || (github.event_name != 'schedule' && inputs.execute && inputs.mission029_phase != 'none')"
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.run_mission029
      - name: Collecter les bundles et fallbacks ciblés
        if: "github.event_name != 'schedule' && inputs.mission029_phase == 'none' && !inputs.mission028 && !inputs.progress_only && !inputs.lineups_only && inputs.details_family == 'none'"
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: >-
          python scripts/run_historical_deep_harvest.py
          --config configs/historical-deep-data-harvest-v1.json
          --output artifacts/historical-deep
          --code-revision "${GITHUB_SHA}"
          fixtures
          ${{ inputs.execute && '--execute' || '' }}
          --priority "${{ inputs.priority }}"
          --max-calls "${{ inputs.max_calls }}"
          --max-duration-minutes "${{ inputs.max_duration_minutes }}"
          --mission-max-minutes 720
      - uses: actions/download-artifact@v4
        if: "github.event_name != 'schedule' && inputs.mission029_phase == 'none' && !inputs.mission028 && inputs.lineups_only && inputs.execute && !inputs.progress_only && inputs.details_family == 'none'"
        with:
          name: historical-deep-71-mission-027-status-unique-38960293874-1
          run-id: 38960293874
          github-token: ${{ github.token }}
          path: artifacts/mission027-preflight
      - name: Mission 027 — compositions seules
        if: "github.event_name != 'schedule' && inputs.mission029_phase == 'none' && !inputs.mission028 && inputs.lineups_only && inputs.execute && !inputs.progress_only && inputs.details_family == 'none'"
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.run_mission027_lineups
      - name: Mission 027 — observation sans collecte
        if: "github.event_name != 'schedule' && inputs.mission029_phase == 'none' && inputs.progress_only && !inputs.mission028 && inputs.details_family == 'none'"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.run_mission027_lineups --progress
      - name: Mission 028 — correspondance des petites ligues
        if: "github.event_name != 'schedule' && inputs.mission029_phase == 'none' && inputs.mission028 && (inputs.execute || inputs.mission028_progress) && inputs.details_family == 'none'"
        env:
          MISSION028_REPLAY: ${{ inputs.mission028_replay }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.run_mission028 ${{ inputs.mission028_progress && '--progress' || '' }}
      - name: Mission 028 — détails par match
        if: "(github.event_name == 'schedule' && steps.resume.outputs.state == 'READY') || (github.event_name != 'schedule' && inputs.mission029_phase == 'none' && !inputs.mission028 && !inputs.lineups_only && !inputs.progress_only && inputs.execute && inputs.details_family != 'none')"
        env:
          MISSION028_FAMILY: ${{ steps.resume.outputs.family || inputs.details_family }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python -m scripts.run_mission028_details --preflight
          pids=()
          for worker in {0..15}; do
            MISSION028_WORKER="$worker" python -m scripts.run_mission028_details &
            pids+=("$!")
          done
          result=0
          for pid in "${pids[@]}"; do wait "$pid" || result=1; done
          exit "$result"
      - name: Publier la décision provider sanitisée
        id: outcome
        if: "github.event_name != 'schedule' && inputs.mission029_phase == 'none' && always() && !inputs.mission028 && !inputs.progress_only && !inputs.lineups_only && inputs.details_family == 'none'"
        run: >-
          python scripts/historical_deep_workflow_outcome.py
          artifacts/historical-deep/fixtures.json >> "$GITHUB_OUTPUT"
      - name: Mission 029 — publier Parquet et reçus append-only
        if: "always() && (steps.mission029.outcome == 'success' || steps.mission029.outcome == 'failure')"
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.publish_mission029
      - uses: actions/upload-artifact@v4
        if: "always() && (github.event_name != 'schedule' || steps.resume.outputs.state == 'READY' || steps.mission029.outcome == 'success' || steps.mission029.outcome == 'failure')"
        with:
          name: historical-deep-71-${{ inputs.slice_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/historical-deep/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  publication-catchup:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_catchup }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {actions: read, contents: write}
    env:
      STORAGE_PAUSED: "true"
      P3_P4_PAUSED: "true"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      PROMOTION_LOCKED: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - name: Réconcilier et publier les objets attestés par lots
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m scripts.publish_mission029 --catchup
      - name: Préparer uniquement les blobs permis pour le recalcul
        id: prematch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re
          from scripts.publish_mission029 import OUTPUT, git, hydrate, inventory
          from robin.prematch.sources import FAMILIES
          repo, selected = OUTPUT / '.publication.git', {}
          for path in inventory(repo):
              if not path.startswith('historical/parquet/') or not path.endswith('.parquet'):
                  continue
              parts = dict(p.split('=', 1) for p in path.split('/') if '=' in p)
              if parts.get('season') == '2025':
                  continue
              family = parts.get('entity_type')
              if family in FAMILIES or (family == 'players' and re.search(r'/fixture-\d+\.parquet$', path)):
                  selected[path] = {}
          hydrate(repo, selected)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('GIT_ALTERNATE_OBJECT_DIRECTORIES=' + str((repo / 'objects').resolve()) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('source_ref=' + git(repo, 'rev-parse', 'historical-data').decode() + '\n')
          PY
      - name: Recalculer les critères et la couverture sans accès réseau
        run: >-
          PYTHONPATH=src python scripts/build_prematch_criteria.py --repository .
          --source-ref "${{ steps.prematch.outputs.source_ref }}"
          --output artifacts/prematch/mission036
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission036-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/historical-deep/mission029/publication-*
            artifacts/prematch/mission036/**
          if-no-files-found: error
          retention-days: 90

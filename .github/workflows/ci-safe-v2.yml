            tests/data_torrent/test_postgresql_v1.py
          python scripts/check_database_revision.py --expected 0015_data_torrent_opportunity
          python -c "from sqlalchemy import inspect; from robin.storage.database import build_engine; import os; names=set(inspect(build_engine(os.environ['ROBIN_DATABASE_URL'])).get_table_names()); assert {'pattern_definitions','experiment_registry','chronos_effect_authorities','chronos_effect_events','chronos_opportunity_claims','chronos_torrent_external_effect_permits','chronos_torrent_external_effect_events','chronos_torrent_batches'} <= names"
      - name: Publier la matrice d'edges CI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronos-dual-principal-superuser-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/chronos-dual-principal-superuser-v2.json
          if-no-files-found: error
      - name: Executer les tests
        run: python -m pytest -q
      - name: Tester Parquet et les protections anti-fuite
        run: python -m pytest -q tests/jalon5 tests/jalon6 tests/jalon7 tests/jalon8 tests/jalon9
      - name: Tester la factory préquentielle et la sécurité temporelle
        run: python -m pytest -q tests/jalon14
      - name: Tester les configurations et le pipeline mock
        run: |
          python -c "import json,pathlib,yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github').rglob('*.yml')]; yaml.safe_load(pathlib.Path('configs/shadow_v1.yaml').read_text()); json.loads(pathlib.Path('configs/prospective_observatory_v1.json').read_text()); json.loads(pathlib.Path('configs/prequential_learning_v1.json').read_text())"
          python scripts/run_shadow_pipeline.py collect-fixtures --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py collect-odds --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py pre-match-shadow --mock --output .ci/shadow
          python scripts/run_shadow_pipeline.py daily-health --mock --output .ci/shadow
      - name: Tester stockage, replay, rattrapage et burn-in
        run: python -m pytest -q tests/jalon4
      - name: Smoke test du dashboard de sante
        run: |
          python -m robin.quality.report --input data/matches.parquet --output .ci/quality
          python -c "from pathlib import Path; assert Path('.ci/quality/health.html').stat().st_size > 1000"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.9.0"
      - name: Compiler et tester le Cockpit Live V2
        working-directory: cockpit
        run: |
          pnpm install --frozen-lockfile
          pnpm test

  visual-regression:
    needs:
      - frozen-evidence-windows
      - tests
    name: "Robin Experience — preuves visuelles"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restaurer les entrees de preuve verifiees
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hypothesis-evidence-campaign-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/hypothesis-j10
      - name: Restaurer la campagne compacte byte-identique
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hypothesis-evidence-compact-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pattern-research
      - name: Restaurer les Parquet canoniques Windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frozen-hypothesis-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hypothesis-evidence
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.9.0"
      - name: Installer le Cockpit et Chromium
        working-directory: cockpit
        run: |
          python -m pip install -r ../requirements.txt
          python -m pip install --no-deps -e ..
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verifier et materialiser les preuves historiques bornees
        env:
          EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          EVIDENCE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          python scripts/frozen_evidence_manifest.py verify \
            --artifact-root artifacts/hypothesis-evidence \
            --manifest artifacts/hypothesis-evidence/portable-manifest.json \
            --expected-source-sha "$EVIDENCE_SOURCE_SHA" \
            --expected-tree-sha "$EVIDENCE_TREE_SHA" \
            --input .ci/hypothesis-j10/campaign-summary.json \
            --input .ci/hypothesis-j10/hypothesis-registry.jsonl \
            --input .ci/hypothesis-j10/replay.json \
            --input reports/pattern-research/campaign-summary.json \
            --generator scripts/build_hypothesis_evidence.py \
            --generator src/robin/hypothesis_evidence/contracts.py \
            --generator src/robin/hypothesis_evidence/factory.py \
            --generator src/robin/hypothesis_evidence/source.py \
            --dependency-lock requirements-evidence.lock
          python scripts/build_hypothesis_evidence_site_pages.py
      - name: Verifier la publication locale des preuves
        working-directory: cockpit
        run: |
          pnpm run build:data
          git diff --exit-code -- app/cockpit-presentation.json
          pnpm run prepare:evidence-assets:required
          pnpm exec vinext build
          pnpm run test:ssr
      - name: Capturer les vues de référence
        working-directory: cockpit
        run: pnpm run test:visual:prepared
      - name: Publier les preuves visuelles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: robin-experience-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cockpit/.ci/visual-regression
            artifacts/hypothesis-evidence/artifact-manifest.json
            artifacts/hypothesis-evidence/portable-manifest.json
            artifacts/hypothesis-evidence/run-metrics.json
            artifacts/hypothesis-evidence-site-pages/manifest.json
            .ci/hypothesis-j10/replay.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  data-torrent-recovery-v2-final-gate-witness:
    name: "Recovery V2 — final gate witness"
    needs:
      - data-torrent-recovery-v2-scope-guard
      - historical-deep-quality
      - bounded-live-canary-ubuntu
      - bounded-live-canary-windows
      - frozen-evidence-windows
      - chronos-postgresql-profiles
      - chronos-end-to-end-live-path-replay
      - chronos-residual-fault-matrix
      - chronos-exact-workflow-entrypoint
      - historical-authority-workflows-disabled
      - tests
      - visual-regression
    if: >-
      ${{ always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == '[DATA_TORRENT_RECOVERY_V2] PR-C' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Materialiser le temoin non circulaire
        env:
          RECOVERY_NEEDS_JSON: ${{ toJSON(needs) }}
          RECOVERY_REPOSITORY: ${{ github.repository }}
          RECOVERY_HEAD_SHA: ${{ github.sha }}
          RECOVERY_RUN_ID: ${{ github.run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
          RECOVERY_EVENT: ${{ github.event_name }}
          RECOVERY_REF: ${{ github.ref }}
          RECOVERY_MERGE_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              "data-torrent-recovery-v2-scope-guard",
              "historical-deep-quality",
              "bounded-live-canary-ubuntu",
              "bounded-live-canary-windows",
              "frozen-evidence-windows",
              "chronos-postgresql-profiles",
              "chronos-end-to-end-live-path-replay",
              "chronos-residual-fault-matrix",
              "chronos-exact-workflow-entrypoint",
              "historical-authority-workflows-disabled",
              "tests",
              "visual-regression",
          }
          needs = json.loads(os.environ["RECOVERY_NEEDS_JSON"])
          if set(needs) != expected:
              raise SystemExit("RECOVERY_V2_FINAL_WITNESS_NEEDS_INVALID")
          if any(not isinstance(value, dict) for value in needs.values()):
              raise SystemExit("RECOVERY_V2_FINAL_WITNESS_NEEDS_INVALID")
          results = {name: value.get("result") for name, value in needs.items()}
          if any(result != "success" for result in results.values()):
              raise SystemExit("RECOVERY_V2_FINAL_WITNESS_PREREQUISITE_FAILED")
          scope_outputs = needs["data-torrent-recovery-v2-scope-guard"].get("outputs")
          if scope_outputs != {
              "phase": "PR_C",
              "terminal_candidate_complete": "true",
          }:
              raise SystemExit("RECOVERY_V2_FINAL_WITNESS_SCOPE_INVALID")
          run_id = os.environ["RECOVERY_RUN_ID"]
          run_attempt = os.environ["RECOVERY_RUN_ATTEMPT"]
          if not run_id.isdecimal() or run_id.startswith("0") or run_attempt != "1":
              raise SystemExit("RECOVERY_V2_FINAL_WITNESS_RUN_INVALID")
          document = {
              "artifact_uploads_planned": 1,
              "current_run_completion_claimed": False,
              "data_torrent_ready_claimed": False,
              "event": os.environ["RECOVERY_EVENT"],
              "github_api_gets": 0,
              "global_quiescence_claimed": False,
              "head_branch": "main",
              "head_sha": os.environ["RECOVERY_HEAD_SHA"],
              "merge_subject": os.environ["RECOVERY_MERGE_SUBJECT"],
              "phase": "PR_C",
              "prerequisite_results": dict(sorted(results.items())),
              "ref": os.environ["RECOVERY_REF"],
              "repository": os.environ["RECOVERY_REPOSITORY"],
              "run_attempt": 1,
              "run_id": int(run_id),
              "schema_version": "data-torrent-recovery-v2-final-gate-witness-v1",
              "scope_guard_outputs": scope_outputs,
              "verdict": "PR_C_POSTMERGE_PREREQUISITES_COMPLETE",
              "workflow_path": ".github/workflows/ci-safe-v2.yml",
          }
          if (
              document["repository"] != "dddur75/robin-stades-ng"
              or document["event"] != "push"
              or document["ref"] != "refs/heads/main"
              or document["merge_subject"] != "[DATA_TORRENT_RECOVERY_V2] PR-C"
              or len(document["head_sha"]) != 40
              or any(character not in "0123456789abcdef" for character in document["head_sha"])
          ):
              raise SystemExit("RECOVERY_V2_FINAL_WITNESS_CONTEXT_INVALID")
          output = Path(os.environ["RUNNER_TEMP"]) / (
              "data-torrent-recovery-v2-final-gate-witness-v1.json"
          )
          output.write_text(
              json.dumps(document, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
      - name: Publier le temoin final
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-torrent-recovery-v2-final-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/data-torrent-recovery-v2-final-gate-witness-v1.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

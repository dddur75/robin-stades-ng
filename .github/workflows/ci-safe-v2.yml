name: "00 - Qualite continue SAFE V2"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ format('quality-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  data-torrent-recovery-v2-scope-guard:
    name: "Recovery V2 — scope guard exact"
    if: >-
      (github.event_name == 'pull_request' &&
      (github.head_ref == 'codex/data-torrent-recovery-v2' ||
      github.event.pull_request.title == '[DATA_TORRENT_RECOVERY_V2] PR-A' ||
      github.event.pull_request.title == '[DATA_TORRENT_RECOVERY_V2] PR-B' ||
      github.event.pull_request.title == '[DATA_TORRENT_RECOVERY_V2] PR-C')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (github.event.head_commit.message == '[DATA_TORRENT_RECOVERY_V2] PR-A' ||
      github.event.head_commit.message == '[DATA_TORRENT_RECOVERY_V2] PR-B' ||
      github.event.head_commit.message == '[DATA_TORRENT_RECOVERY_V2] PR-C'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      phase: ${{ steps.scope.outputs.phase }}
      terminal_candidate_complete: ${{ steps.scope.outputs.terminal_candidate_complete }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Prouver le scope Recovery V2 depuis START_SHA
        id: scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPECTED_FIRST_PARENT: ${{ github.event.before }}
          RECOVERY_EVENT_LABEL: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          RECOVERY_HEAD_REF: ${{ github.head_ref }}
          RECOVERY_BASE_REF: ${{ github.base_ref }}
          RECOVERY_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$RECOVERY_EVENT_LABEL" in
            '[DATA_TORRENT_RECOVERY_V2] PR-A') RECOVERY_PHASE=PR_A ;;
            '[DATA_TORRENT_RECOVERY_V2] PR-B') RECOVERY_PHASE=PR_B ;;
            '[DATA_TORRENT_RECOVERY_V2] PR-C') RECOVERY_PHASE=PR_C ;;
            *) exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$RECOVERY_HEAD_REF" = "codex/data-torrent-recovery-v2"
            test "$RECOVERY_BASE_REF" = "main"
            test "$RECOVERY_HEAD_REPOSITORY" = "dddur75/robin-stades-ng"
          fi
          SCOPE_GUARD=scripts/check_data_torrent_recovery_v2_scope.py
          if [ "$RECOVERY_PHASE" != "PR_A" ]; then
            SCOPE_GUARD="$RUNNER_TEMP/check_data_torrent_recovery_v2_scope.py"
            git show "$EXPECTED_BASE:scripts/check_data_torrent_recovery_v2_scope.py" > "$SCOPE_GUARD"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python "$SCOPE_GUARD" \
              --expected-head "$EXPECTED_HEAD" \
              --expected-base "$EXPECTED_BASE" \
              --expected-first-parent "$EXPECTED_FIRST_PARENT" \
              --phase "$RECOVERY_PHASE" \
              --event-label "$RECOVERY_EVENT_LABEL" \
              --output .ci/data-torrent-recovery-v2-scope-guard.json
          else
            python "$SCOPE_GUARD" \
              --expected-head "$EXPECTED_HEAD" \
              --expected-base "$EXPECTED_BASE" \
              --phase "$RECOVERY_PHASE" \
              --event-label "$RECOVERY_EVENT_LABEL" \
              --output .ci/data-torrent-recovery-v2-scope-guard.json
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path(".ci/data-torrent-recovery-v2-scope-guard.json").read_text(encoding="utf-8")
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8", newline="\n") as output:
              output.write(f"phase={receipt['phase']}\n")
              output.write(
                  "terminal_candidate_complete="
                  f"{str(receipt['terminal_candidate_complete']).lower()}\n"
              )
          PY
      - name: Publier la preuve de scope exacte
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-torrent-recovery-v2-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci/data-torrent-recovery-v2-scope-guard.json
          if-no-files-found: error
          include-hidden-files: true

  historical-deep-quality:
    name: "Historical Deep — contrat cache-only"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances Historical Deep
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Tester Historical Deep
        run: python -m pytest -q tests/historical_deep
      - name: Vérifier Ruff Historical Deep
        run: >-
          python -m ruff check
          src/robin/historical_deep
          tests/historical_deep
          tests/coverage
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Vérifier le typage strict Historical Deep
        run: >-
          python -m mypy --strict
          src/robin/historical_deep
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Auditer la sécurité Historical Deep
        run: >-
          python -m bandit -q -r
          src/robin/historical_deep
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Compiler Historical Deep
        run: >-
          python -m compileall -q
          src/robin/historical_deep
          tests/historical_deep
          scripts/export_historical_deep_coverage.py
          scripts/historical_deep_workflow_outcome.py
          scripts/run_p0_coverage_evidence.py
          scripts/run_historical_deep_harvest.py
          scripts/run_historical_deep_segmented_replay.py
      - name: Valider JSON et YAML
        run: >-
          python -c "import json,pathlib,yaml;
          json.loads(pathlib.Path('configs/historical-deep-data-harvest-v1.json').read_text(encoding='utf-8'));
          [yaml.safe_load(path.read_text(encoding='utf-8')) for path in
          sorted(pathlib.Path('.github/workflows').glob('*.yml'))]"
      - name: Vérifier les secrets
        run: python scripts/check_no_secrets.py
      - name: Vérifier les dépendances
        run: python -m pip check

  bounded-live-canary-ubuntu:
    name: "Bounded live canary - Ubuntu"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Installer les dépendances capture
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Refuser tout secret fournisseur injecté
        run: test -z "${THE_ODDS_API_KEY:-}"
      - name: Vérifier les artifacts synthétiques bornés
        run: |
          python tools/data-sourcing/build_capture_harness_artifacts.py --check
          python tools/data-sourcing/build_bounded_live_canary_artifacts.py --check
      - name: Vérifier Ruff sur la capacité bornée
        run: >-
          python -m ruff check
          src/robin/capture
          tests/capture
          tests/council/test_bounded_live_canary_governance.py
          tests/council/test_real_execution_bootstrap_governance.py
          tests/jalon10/test_workflows_and_guards.py
          tests/portability/test_chronos_portable_ci_contract.py
          tools/data-sourcing/build_capture_harness_artifacts.py
          tools/data-sourcing/build_bounded_live_canary_artifacts.py
          tools/data-sourcing/build_owner_review_pack_v1.py
          tools/data-sourcing/freeze_official_fixture_target_set_v1.py
          tools/data-sourcing/prepare_provider_network_binding_v1.py
          tools/data-sourcing/prepare_real_capture_workspace_v1.py
          tools/data-sourcing/run_bounded_live_canary_v1.py
          tools/data-sourcing/run_bounded_live_canary_v2.py
          tools/data-sourcing/select_campaign_window_v1.py
      - name: Vérifier le format Ruff de la capacité bornée
        run: >-
          python -m ruff format --check
          src/robin/capture
          tests/capture
          tests/council/test_bounded_live_canary_governance.py
          tests/council/test_real_execution_bootstrap_governance.py
          tools/data-sourcing/build_capture_harness_artifacts.py
          tools/data-sourcing/build_bounded_live_canary_artifacts.py
          tools/data-sourcing/build_owner_review_pack_v1.py
          tools/data-sourcing/freeze_official_fixture_target_set_v1.py
          tools/data-sourcing/prepare_provider_network_binding_v1.py
          tools/data-sourcing/prepare_real_capture_workspace_v1.py
          tools/data-sourcing/run_bounded_live_canary_v1.py
          tools/data-sourcing/run_bounded_live_canary_v2.py
          tools/data-sourcing/select_campaign_window_v1.py
      - name: Vérifier le typage strict de la capacité bornée
        run: >-
          python -m mypy --strict
          src/robin/capture
          tools/data-sourcing/build_capture_harness_artifacts.py
          tools/data-sourcing/build_bounded_live_canary_artifacts.py
          tools/data-sourcing/build_owner_review_pack_v1.py
          tools/data-sourcing/freeze_official_fixture_target_set_v1.py
          tools/data-sourcing/prepare_provider_network_binding_v1.py
          tools/data-sourcing/prepare_real_capture_workspace_v1.py
          tools/data-sourcing/run_bounded_live_canary_v1.py
          tools/data-sourcing/run_bounded_live_canary_v2.py
          tools/data-sourcing/select_campaign_window_v1.py
      - name: Auditer la sécurité statique de la capacité bornée
        run: >-
          python -m bandit -q -r
          src/robin/capture
          tools/data-sourcing/build_capture_harness_artifacts.py
          tools/data-sourcing/build_bounded_live_canary_artifacts.py
          tools/data-sourcing/build_owner_review_pack_v1.py
          tools/data-sourcing/freeze_official_fixture_target_set_v1.py
          tools/data-sourcing/prepare_provider_network_binding_v1.py
          tools/data-sourcing/prepare_real_capture_workspace_v1.py
          tools/data-sourcing/run_bounded_live_canary_v1.py
          tools/data-sourcing/run_bounded_live_canary_v2.py
          tools/data-sourcing/select_campaign_window_v1.py
      - name: Refuser les secrets et chemins locaux suivis
        run: |
          python scripts/check_no_secrets.py
          python scripts/check_no_tracked_absolute_paths.py
      - name: Valider les JSON YAML et schémas bornés
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml
          from jsonschema import Draft202012Validator

          from robin.capture import (
              ActivationEnvelopeV1,
              FixtureMapping,
              LiveAdmissionPermitV1,
              LiveCaptureLineageV1,
              LiveExecutionAttemptReceiptV1,
              LiveExecutionReceiptV1,
              LiveLeaseV1,
              LivePlanItemV1,
              LivePlanV1,
              LiveResponseIntakeClaimV1,
              OwnerAuthorizationV1,
              ProviderRequestSpec,
              PublicProviderRequestV1,
          )
          from robin.capture.contracts import canonical_sha256

          json_paths = (
              "configs/agents/agent-report-schema-v3.json",
              "configs/agents/mission-activation-matrix-v3.json",
              "configs/execution/bounded-multi-league-live-canary-capability-v2.json",
              "configs/execution/real-execution-bootstrap-closure-v1.json",
              "reports/data-sourcing/bounded-live-canary-capability-v1.json",
              "reports/data-sourcing/capture-harness-contract-v1.json",
              "reports/data-sourcing/capture-threat-model-v1.json",
              "reports/data-sourcing/internal-retention-policy-v1.json",
              "reports/data-sourcing/live-canary-plan-v1.json",
              "reports/data-sourcing/offline-replay-proof-v1.json",
              "reports/data-sourcing/real-execution-bootstrap-closure-v1.json",
              "tests/capture/fixtures/bounded-live-canary-v1-golden-pack.json",
          )
          documents = {
              path: json.loads(Path(path).read_text(encoding="utf-8"))
              for path in json_paths
          }
          workflow = yaml.safe_load(
              Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
          )
          assert isinstance(workflow, dict) and isinstance(workflow.get("jobs"), dict)
          Draft202012Validator.check_schema(
              documents["configs/agents/agent-report-schema-v3.json"]
          )

          pack = documents[
              "tests/capture/fixtures/bounded-live-canary-v1-golden-pack.json"
          ]
          OwnerAuthorizationV1.model_validate(pack["authorization"])
          ActivationEnvelopeV1.model_validate(pack["activation"])
          LivePlanV1.model_validate(pack["plan"])
          ProviderRequestSpec.model_validate(pack["request"])
          for mapping in pack["fixture_mappings"]:
              FixtureMapping.model_validate(mapping)

          contract_types = (
              OwnerAuthorizationV1,
              ActivationEnvelopeV1,
              LivePlanV1,
              LivePlanItemV1,
              LiveAdmissionPermitV1,
              LiveResponseIntakeClaimV1,
              LiveCaptureLineageV1,
              LiveExecutionAttemptReceiptV1,
              LiveLeaseV1,
              LiveExecutionReceiptV1,
              PublicProviderRequestV1,
          )
          expected_schema_hashes = {
              contract_type.__name__: canonical_sha256(contract_type.model_json_schema())
              for contract_type in contract_types
          }
          report = documents["reports/data-sourcing/bounded-live-canary-capability-v1.json"]
          assert report["contract_schemas"] == expected_schema_hashes
          print("BOUNDED_LIVE_CANARY_JSON_YAML_SCHEMA_PASS")
          PY
      - name: Refuser toute donnée réelle dans les artifacts synthétiques
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          golden_path = Path(
              "tests/capture/fixtures/bounded-live-canary-v1-golden-pack.json"
          )
          report_path = Path(
              "reports/data-sourcing/bounded-live-canary-capability-v1.json"
          )
          pack = json.loads(golden_path.read_text(encoding="utf-8"))
          report = json.loads(report_path.read_text(encoding="utf-8"))

          assert pack["provenance"] == (
              "ENTIRELY_SYNTHETIC_NO_PROVIDER_PAYLOAD_NO_REAL_AUTHORITY"
          )
          assert pack["repository_sha_is_synthetic"] is True
          assert pack["capture_root_fingerprint_is_synthetic"] is True
          assert set(pack["mission_effects"].values()) == {0}
          for mapping in pack["fixture_mappings"]:
              assert mapping["provider_event_id"].startswith("synthetic-")
              assert mapping["fixture_id"].startswith("synthetic-")
              assert all(
                  candidate.startswith("synthetic-")
                  for candidate in mapping["candidate_fixture_ids"]
              )

          forbidden_payload_keys = {
              "away_team",
              "bookmakers",
              "commence_time",
              "home_team",
              "last_update",
              "outcomes",
              "price",
          }

          def assert_no_provider_payload(value: object) -> None:
              if isinstance(value, dict):
                  assert forbidden_payload_keys.isdisjoint(value)
                  for child in value.values():
                      assert_no_provider_payload(child)
              elif isinstance(value, list):
                  for child in value:
                      assert_no_provider_payload(child)

          assert_no_provider_payload(pack)
          assert_no_provider_payload(report)
          assert report["real_authorization_status"] == "NOT_CREATED"
          assert report["real_activation_status"] == "NOT_CREATED"
          assert report["real_batch_status"] == "NOT_EXECUTED"
          assert report["real_snapshot_status"] == "NOT_CREATED"
          for zero_field in (
              "network_calls",
              "real_capture_count",
              "real_executable_experiment_count",
              "real_provider_calls",
              "real_provider_dns_calls",
              "real_secret_reads",
              "real_snapshot_count",
              "purchases",
              "promotions",
              "bets",
          ):
              assert report[zero_field] == 0
          print("BOUNDED_LIVE_CANARY_REAL_DATA_LEAK_SCAN_PASS")
          PY
      - name: Compiler et tester la capacité et ses gardes de livraison
        run: |
          python -m compileall -q src/robin/capture tools/data-sourcing tests/capture
          python -m pytest -q \
            tests/capture \
            tests/council/test_bounded_live_canary_governance.py \
            tests/council/test_real_execution_bootstrap_governance.py \
            tests/jalon10/test_workflows_and_guards.py \
            tests/portability/test_chronos_portable_ci_contract.py

  bounded-live-canary-windows:
    name: "Bounded live canary - Windows"
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ROBIN_REQUIRE_WINDOWS_STORAGE_LINKS: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Installer les dépendances capture
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Refuser tout secret fournisseur injecté
        shell: pwsh
        run: |
          if ($env:THE_ODDS_API_KEY) {
            throw "REAL_PROVIDER_SECRET_FORBIDDEN"
          }
      - name: Vérifier les artifacts synthétiques bornés
        shell: pwsh
        run: |
          python tools/data-sourcing/build_capture_harness_artifacts.py --check
          python tools/data-sourcing/build_bounded_live_canary_artifacts.py --check
      - name: Prouver les junctions et hardlinks Windows
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw "WINDOWS_RUNNER_TEMP_REQUIRED"
          }
          $runnerRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            [IO.Path]::DirectorySeparatorChar,
            [IO.Path]::AltDirectorySeparatorChar
          )
          $proofRoot = [IO.Path]::GetFullPath(
            (Join-Path $runnerRoot "robin-bounded-live-canary-fs-${{ github.run_id }}-${{ github.run_attempt }}")
          )
          $requiredPrefix = $runnerRoot + [IO.Path]::DirectorySeparatorChar
          if (-not $proofRoot.StartsWith($requiredPrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "WINDOWS_FS_PROOF_ROOT_OUTSIDE_RUNNER_TEMP"
          }
          if (Test-Path -LiteralPath $proofRoot) {
            throw "WINDOWS_FS_PROOF_ROOT_ALREADY_EXISTS"
          }

          New-Item -ItemType Directory -Path $proofRoot | Out-Null
          try {
            $junctionTarget = Join-Path $proofRoot "junction-target"
            $junctionPath = Join-Path $proofRoot "junction-link"
            New-Item -ItemType Directory -Path $junctionTarget | Out-Null
            New-Item -ItemType Junction -Path $junctionPath -Target $junctionTarget | Out-Null
            $attributes = [IO.File]::GetAttributes($junctionPath)
            if (($attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
              throw "WINDOWS_JUNCTION_REPARSE_PROOF_FAILED"
            }
            python -c 'import pathlib,sys; from robin.capture.workspace_bootstrap import WindowsBoundaryInspector,WorkspaceBootstrapError; inspector=WindowsBoundaryInspector(sync_roots=()); rejected=[]; exec("try:\n inspector.inspect(pathlib.Path(sys.argv[1]))\nexcept WorkspaceBootstrapError:\n rejected.append(True)"); raise SystemExit(0 if rejected else "WINDOWS_BOOTSTRAP_JUNCTION_ACCEPTED")' "$junctionPath"

            $hardlinkSource = Join-Path $proofRoot "hardlink-source.txt"
            $hardlinkPath = Join-Path $proofRoot "hardlink-link.txt"
            [IO.File]::WriteAllText($hardlinkSource, "synthetic")
            New-Item -ItemType HardLink -Path $hardlinkPath -Target $hardlinkSource | Out-Null
            python -c "import pathlib,sys; a=pathlib.Path(sys.argv[1]).stat(); b=pathlib.Path(sys.argv[2]).stat(); assert a.st_ino == b.st_ino and a.st_nlink >= 2 and b.st_nlink >= 2" "$hardlinkSource" "$hardlinkPath"
          }
          finally {
            if (Test-Path -LiteralPath $proofRoot) {
              Remove-Item -LiteralPath $proofRoot -Recurse -Force
            }
          }
      - name: Compiler et tester la capacité bornée
        shell: pwsh
        run: |
          python -m compileall -q src/robin/capture tools/data-sourcing tests/capture
          python -m pytest -q tests/capture

  frozen-evidence-windows:
    name: "Jalon 10 - entrees de preuve gelees"
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --require-hashes -r requirements-evidence.lock
          python -m pip install --no-deps -e .
      - name: Reconstruire les entrees Jalon 10 depuis le commit gele
        shell: pwsh
        run: |
          git diff --quiet 423fb7e77ba52286b660956161f02f8a2c1be7f8..HEAD -- src/robin/patterns scripts/run_pattern_campaign.py configs/pattern-research-v1.json
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_FROZEN_ENGINE_DRIFT"
          }

          $j10Root = Join-Path $env:RUNNER_TEMP "j10"
          $j10Archive = Join-Path $env:RUNNER_TEMP "j10-historical.tar"
          $state = Join-Path $j10Root "historical"
          New-Item -ItemType Directory -Force -Path $j10Root | Out-Null
          git archive --format=tar "--output=$j10Archive" 5c85cf20b932df44dca8665de00e52e3f1e02236 -- ':(glob)historical/parquet/competition=*/season=*/entity_type=historical_market/dataset_version=historical_market_v1/*.parquet'
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_ARCHIVE_FAILED"
          }
          tar -xf $j10Archive -C $j10Root
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_EXTRACTION_FAILED"
          }
          $partitions = @(
            Get-ChildItem -Path $state -Recurse -Filter "*.parquet" -File
          )
          if ($partitions.Count -ne 30) {
            throw "JALON_10_EXPECTED_30_PARTITIONS"
          }

          python scripts/run_pattern_campaign.py --state $state --output .ci/hypothesis-j10 --code-revision 423fb7e77ba52286b660956161f02f8a2c1be7f8 --config configs/pattern-research-v1.json
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_PRIMARY_FAILED"
          }
          python scripts/run_pattern_campaign.py --state $state --output .ci/hypothesis-j10 --code-revision 423fb7e77ba52286b660956161f02f8a2c1be7f8 --config configs/pattern-research-v1.json --replay
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_REPLAY_FAILED"
          }
          python -c "from pathlib import Path; path=Path('reports/pattern-research/campaign-summary.json'); data=path.read_bytes().replace(b'\r\n', b'\n'); assert b'\r' not in data; path.write_bytes(data.replace(b'\n', b'\r\n'))"
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_COMPACT_LINE_ENDINGS_FAILED"
          }
          python -c "from pathlib import Path; from robin.hypothesis_evidence.contracts import COMPACT_CAMPAIGN_SHA256, FULL_CAMPAIGN_SHA256, REGISTRY_SHA256, sha256_file; assert sha256_file(Path('.ci/hypothesis-j10/campaign-summary.json')) == FULL_CAMPAIGN_SHA256; assert sha256_file(Path('.ci/hypothesis-j10/hypothesis-registry.jsonl')) == REGISTRY_SHA256; assert sha256_file(Path('reports/pattern-research/campaign-summary.json')) == COMPACT_CAMPAIGN_SHA256"
          if ($LASTEXITCODE -ne 0) {
            throw "JALON_10_FROZEN_HASH_MISMATCH"
          }
      - name: Produire les Parquet geles canoniques
        shell: pwsh
        run: |
          python scripts/build_hypothesis_evidence.py --git-blobs --no-resume
          if ($LASTEXITCODE -ne 0) {
            throw "FROZEN_EVIDENCE_WINDOWS_BUILD_FAILED"
          }
          git diff --exit-code -- reports/hypothesis-evidence
          if ($LASTEXITCODE -ne 0) {
            throw "FROZEN_EVIDENCE_HISTORICAL_HASH_MISMATCH"
          }
      - name: Construire et verifier le manifeste portable
        shell: pwsh
        run: |
          $sourceSha = git rev-parse HEAD
          $treeSha = git rev-parse 'HEAD^{tree}'
          python scripts/frozen_evidence_manifest.py build `
            --artifact-root artifacts/hypothesis-evidence `
            --output artifacts/hypothesis-evidence/portable-manifest.json `
            --source-sha $sourceSha `
            --tree-sha $treeSha `
            --input .ci/hypothesis-j10/campaign-summary.json `
            --input .ci/hypothesis-j10/hypothesis-registry.jsonl `
            --input .ci/hypothesis-j10/replay.json `
            --input reports/pattern-research/campaign-summary.json `
            --generator scripts/build_hypothesis_evidence.py `
            --generator src/robin/hypothesis_evidence/contracts.py `
            --generator src/robin/hypothesis_evidence/factory.py `
            --generator src/robin/hypothesis_evidence/source.py `
            --dependency-lock requirements-evidence.lock
          if ($LASTEXITCODE -ne 0) {
            throw "FROZEN_EVIDENCE_MANIFEST_BUILD_FAILED"
          }
          python scripts/frozen_evidence_manifest.py verify `
            --artifact-root artifacts/hypothesis-evidence `
            --manifest artifacts/hypothesis-evidence/portable-manifest.json `
            --expected-source-sha $sourceSha `
            --expected-tree-sha $treeSha `
            --input .ci/hypothesis-j10/campaign-summary.json `
            --input .ci/hypothesis-j10/hypothesis-registry.jsonl `
            --input .ci/hypothesis-j10/replay.json `
            --input reports/pattern-research/campaign-summary.json `
            --generator scripts/build_hypothesis_evidence.py `
            --generator src/robin/hypothesis_evidence/contracts.py `
            --generator src/robin/hypothesis_evidence/factory.py `
            --generator src/robin/hypothesis_evidence/source.py `
            --dependency-lock requirements-evidence.lock
          if ($LASTEXITCODE -ne 0) {
            throw "FROZEN_EVIDENCE_MANIFEST_VERIFY_FAILED"
          }
      - name: Conserver les entrees de preuve verifiees
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hypothesis-evidence-campaign-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci/hypothesis-j10/campaign-summary.json
            .ci/hypothesis-j10/hypothesis-registry.jsonl
            .ci/hypothesis-j10/replay.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Conserver la campagne compacte byte-identique
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hypothesis-evidence-compact-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pattern-research/campaign-summary.json
          if-no-files-found: error
          retention-days: 1
      - name: Publier les preuves Parquet canoniques immuables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-hypothesis-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/hypothesis-evidence/*.parquet
            artifacts/hypothesis-evidence/artifact-manifest.json
            artifacts/hypothesis-evidence/run-metrics.json
            artifacts/hypothesis-evidence/portable-manifest.json
          if-no-files-found: error
          retention-days: 30


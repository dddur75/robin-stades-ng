        run: |
          python -m pytest -q \
            tests/activation/test_chronos_end_to_end_live_path_v1.py::test_exact_module_command_with_malformed_run_id_still_writes_report

  historical-authority-workflows-disabled:
    name: "Historical Authority Workflows Disabled"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuser toute ancienne route R2 reactivable
        shell: bash
        run: |
          set -euo pipefail
          assert_disabled() {
            local workflow_id="$1"
            local expected_path="$2"
            local observed
            observed="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" \
              --jq '[.id,.path,.state] | @tsv')"
            test "${observed}" = "${workflow_id}"$'\t'"${expected_path}"$'\t'disabled_manually
          }
          assert_disabled 319920551 .github/workflows/historical-backfill.yml
          assert_disabled 327137040 .github/workflows/79-historical-deep-night-controller.yml
          assert_disabled 327137044 .github/workflows/81-historical-deep-coverage-proof-export.yml
          assert_disabled 329278452 .github/workflows/82-p0-e1b-five-league-canary.yml
          assert_disabled 329420317 .github/workflows/83-p0-e2-capability-sample.yml

  tests:
    name: tests
    needs:
      - data-torrent-recovery-v2-scope-guard
      - bounded-live-canary-ubuntu
      - bounded-live-canary-windows
      - frozen-evidence-windows
      - chronos-postgresql-profiles
      - chronos-end-to-end-live-path-replay
      - chronos-residual-fault-matrix
      - chronos-exact-workflow-entrypoint
      - historical-authority-workflows-disabled
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: robin_ci
          POSTGRES_USER: robin
          POSTGRES_PASSWORD: robin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robin -d robin_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Refuser tout prerequis absent, annule ou en echec
        env:
          BOUNDED_LIVE_CANARY_UBUNTU_RESULT: ${{ needs.bounded-live-canary-ubuntu.result }}
          BOUNDED_LIVE_CANARY_WINDOWS_RESULT: ${{ needs.bounded-live-canary-windows.result }}
          FROZEN_EVIDENCE_RESULT: ${{ needs.frozen-evidence-windows.result }}
          CHRONOS_PROFILES_RESULT: ${{ needs.chronos-postgresql-profiles.result }}
          E2E_LIVE_PATH_RESULT: ${{ needs.chronos-end-to-end-live-path-replay.result }}
          RESIDUAL_FAULT_MATRIX_RESULT: ${{ needs.chronos-residual-fault-matrix.result }}
          EXACT_WORKFLOW_ENTRYPOINT_RESULT: ${{ needs.chronos-exact-workflow-entrypoint.result }}
          HISTORICAL_AUTHORITY_BOUNDARY_RESULT: ${{ needs.historical-authority-workflows-disabled.result }}
          DATA_TORRENT_RECOVERY_V2_SCOPE_RESULT: ${{ needs.data-torrent-recovery-v2-scope-guard.result }}
        run: |
          test "$BOUNDED_LIVE_CANARY_UBUNTU_RESULT" = "success"
          test "$BOUNDED_LIVE_CANARY_WINDOWS_RESULT" = "success"
          test "$FROZEN_EVIDENCE_RESULT" = "success"
          test "$CHRONOS_PROFILES_RESULT" = "success"
          test "$E2E_LIVE_PATH_RESULT" = "success"
          test "$RESIDUAL_FAULT_MATRIX_RESULT" = "success"
          test "$EXACT_WORKFLOW_ENTRYPOINT_RESULT" = "success"
          test "$HISTORICAL_AUTHORITY_BOUNDARY_RESULT" = "success"
          test "$DATA_TORRENT_RECOVERY_V2_SCOPE_RESULT" = "success" || test "$DATA_TORRENT_RECOVERY_V2_SCOPE_RESULT" = "skipped"
      - name: Exiger le scope guard sur chaque run Recovery V2
        if: >-
          (github.event_name == 'pull_request' &&
          (github.head_ref == 'codex/data-torrent-recovery-v2' ||
          github.event.pull_request.title == '[DATA_TORRENT_RECOVERY_V2] PR-A' ||
          github.event.pull_request.title == '[DATA_TORRENT_RECOVERY_V2] PR-B' ||
          github.event.pull_request.title == '[DATA_TORRENT_RECOVERY_V2] PR-C')) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (github.event.head_commit.message == '[DATA_TORRENT_RECOVERY_V2] PR-A' ||
          github.event.head_commit.message == '[DATA_TORRENT_RECOVERY_V2] PR-B' ||
          github.event.head_commit.message == '[DATA_TORRENT_RECOVERY_V2] PR-C'))
        env:
          DATA_TORRENT_RECOVERY_V2_SCOPE_RESULT: ${{ needs.data-torrent-recovery-v2-scope-guard.result }}

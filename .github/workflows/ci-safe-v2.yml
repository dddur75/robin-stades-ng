          DATA_TORRENT_RECOVERY_V2_TERMINAL_CANDIDATE_COMPLETE: ${{ needs.data-torrent-recovery-v2-scope-guard.outputs.terminal_candidate_complete }}
        run: |
          test "$DATA_TORRENT_RECOVERY_V2_SCOPE_RESULT" = "success"
          if [ "$DATA_TORRENT_RECOVERY_V2_PHASE" = "PR_C" ]; then
            test "$DATA_TORRENT_RECOVERY_V2_TERMINAL_CANDIDATE_COMPLETE" = "true"

name: "23 - Feature Factory"
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "22 - Qualité historique"
    types: [completed]
  schedule:
    - cron: "41 2 * * 2,5"
permissions:
  contents: write
concurrency:
  group: historical-state
  cancel-in-progress: false
jobs:
  features:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Évaluer les gates puis construire uniquement les datasets autorisés
        run: |
          python scripts/run_historical_pipeline.py \
            --run-id "${{ github.run_id }}" readiness
          python scripts/run_historical_pipeline.py \
            --run-id "${{ github.run_id }}" datasets
      - uses: ./.github/actions/historical-state-persist
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}

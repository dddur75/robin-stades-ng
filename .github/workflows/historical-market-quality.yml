name: "29 - Qualité marchés historiques"
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"
permissions:
  contents: write
concurrency:
  group: historical-state
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/database-revision-guard
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          expected-revision: 0013_historical_evidence_index
      - uses: ./.github/actions/historical-state-restore
      - run: >-
          python scripts/run_critical_closure.py
          --state data/historical
          --run-id "${{ github.run_id }}"
          --source-commit "${{ github.sha }}"
          --no-download
      - uses: ./.github/actions/historical-state-persist
        with:
          run-id: ${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL }}
          r2-replication-enabled: "true"
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket-name: ${{ secrets.R2_BUCKET_NAME }}

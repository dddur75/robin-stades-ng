name: Robin collection freshness monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: robin-collection-freshness-monitor
  cancel-in-progress: true

jobs:
  detect-collection-silence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_WORKFLOW_ID: "321915839"
      MAX_SILENCE_SECONDS: "6000"
      MAX_LAST_SUCCESS_SECONDS: "6000"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fail visibly when the independent collection chain is silent
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import datetime
          import json
          import os
          import urllib.request
          from pathlib import Path

          workflow_id = os.environ["TARGET_WORKFLOW_ID"]
          max_silence = int(os.environ["MAX_SILENCE_SECONDS"])
          max_last_success = int(os.environ["MAX_LAST_SUCCESS_SECONDS"])
          api = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          url = (
              f"{api}/repos/{repository}/actions/workflows/{workflow_id}/runs"
              "?per_page=20&exclude_pull_requests=true"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          eligible = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("head_branch") == "main"
              and run.get("event") in {"schedule", "workflow_dispatch"}
              and isinstance(run.get("created_at"), str)
          ]
          if not eligible:
              print("::error title=Collection Robin silencieuse::COLLECTION_SILENCE_DETECTED no eligible main run")
              raise SystemExit(1)

          latest = max(eligible, key=lambda run: run["created_at"])
          created = datetime.datetime.fromisoformat(
              latest["created_at"].replace("Z", "+00:00")
          )
          now = datetime.datetime.now(datetime.UTC)
          age_seconds = (now - created).total_seconds()
          status = latest.get("status")
          conclusion = latest.get("conclusion")
          run_url = latest.get("html_url") or "unavailable"
          successful = [
              run
              for run in eligible
              if run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and isinstance(run.get("updated_at"), str)
          ]
          last_success = max(successful, key=lambda run: run["updated_at"]) if successful else None
          last_success_at = (
              datetime.datetime.fromisoformat(
                  last_success["updated_at"].replace("Z", "+00:00")
              )
              if last_success is not None
              else None
          )
          success_age_seconds = (
              (now - last_success_at).total_seconds()
              if last_success_at is not None
              else None
          )

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "\n".join(
                  [
                      "# Contrôle indépendant de fraîcheur Robin",
                      "",
                      f"- Workflow surveillé : `{workflow_id}`",
                      f"- Dernier run : `{latest.get('id')}`",
                      f"- Créé : `{latest['created_at']}`",
                      f"- Âge : `{age_seconds:.0f} s` (limite `{max_silence} s`)",
                      f"- État : `{status}` / `{conclusion}`",
                      f"- Dernier succès terminé : `{last_success.get('id') if last_success else 'aucun'}` / `{last_success.get('updated_at') if last_success else 'aucun'}`",
                      f"- Âge du dernier succès : `{success_age_seconds:.0f} s` (limite `{max_last_success} s`)" if success_age_seconds is not None else "- Âge du dernier succès : `indisponible`",
                      f"- Run : {run_url}",
                      "",
                  ]
              ),
              encoding="utf-8",
          )

          if age_seconds < 0 or age_seconds > max_silence:
              print(
                  "::error title=Collection Robin silencieuse::"
                  f"COLLECTION_SILENCE_DETECTED age_seconds={age_seconds:.0f} "
                  f"limit={max_silence} run={latest.get('id')}"
              )
              raise SystemExit(1)
          if status == "completed" and conclusion != "success":
              print(
                  "::error title=Dernier run Robin en échec::"
                  f"COLLECTION_LATEST_RUN_FAILED conclusion={conclusion} "
                  f"run={latest.get('id')}"
              )
              raise SystemExit(1)
          if success_age_seconds is None or success_age_seconds > max_last_success:
              print(
                  "::error title=Dernier succès Robin trop ancien::"
                  f"COLLECTION_LAST_SUCCESS_STALE age_seconds={success_age_seconds} "
                  f"limit={max_last_success} latest_run={latest.get('id')}"
              )
              raise SystemExit(1)
          if status not in {
              "completed", "queued", "in_progress", "pending", "requested", "waiting"
          }:
              print(
                  "::error title=État Robin inconnu::"
                  f"COLLECTION_LATEST_RUN_FAILED status={status} run={latest.get('id')}"
              )
              raise SystemExit(1)
          print(
              f"COLLECTION_FRESHNESS_OK run={latest.get('id')} "
              f"age_seconds={age_seconds:.0f} status={status} conclusion={conclusion}"
          )
          PY

name: "Réveil collecte 036 (sans IA)"

# Remplace la partie « relance de la collecte » de la Boucle Robin NG (Opus horaire).
# Toutes les heures : si aucun run du workflow 71 n'est en cours ou en attente,
# relance une tranche 036 en mode auto. Aucun fournisseur appelé ici, aucun secret.

on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write

concurrency:
  group: reveil-collecte-036
  cancel-in-progress: false

jobs:
  reveil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Relancer la tranche si le 71 est à l'arrêt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: 71-historical-deep-fixture-bundle-harvest.yml
        run: |
          set -euo pipefail
          actifs=0
          for s in in_progress queued waiting requested pending; do
            n=$(gh api "repos/$REPO/actions/workflows/$WF/runs?status=$s&per_page=1" --jq '.total_count')
            actifs=$((actifs + n))
          done
          if [ "$actifs" -gt 0 ]; then
            echo "Workflow 71 déjà actif ($actifs run(s)) : rien à faire."
            exit 0
          fi
          slice="m036-reveil-$(date -u +%Y%m%dT%H%M)"
          gh api -X POST "repos/$REPO/actions/workflows/$WF/dispatches" \
            -f ref=main \
            -f "inputs[mission029_phase]=auto" \
            -F "inputs[execute]=true" \
            -f "inputs[slice_id]=$slice"
          echo "Tranche relancée : $slice"

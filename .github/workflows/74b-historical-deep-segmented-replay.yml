name: "74B - Historical Deep Segmented Replay"

on:
  workflow_call:
    inputs:
      inventory_artifact_name: {type: string, required: true}
      segment_batches: {type: string, required: true}
      continuation_id: {type: string, required: true}
    secrets:
      R2_ACCOUNT_ID: {required: true}
      R2_ACCESS_KEY_ID: {required: true}
      R2_SECRET_ACCESS_KEY: {required: true}
      R2_BUCKET_NAME: {required: true}

permissions:
  contents: read

jobs:
  replay-segments:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        segment_batch: ${{ fromJSON(inputs.segment_batches) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STORAGE_PAUSED: "true"
      P3_P4_PAUSED: "true"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      PROMOTION_LOCKED: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
      POSTGRESQL_PRODUCTION_DESTRUCTIVE_WRITES: "false"
      THE_ODDS_API_HISTORICAL_CREDITS: "false"
      API_FOOTBALL_CALLS_ALLOWED: "0"
      ODDS_API_CREDITS_ALLOWED: "0"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install -r requirements.txt boto3
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.inventory_artifact_name }}
          path: artifacts/inventory
      - name: Replay first pass segment
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SEGMENT_IDS_JSON: ${{ matrix.segment_batch.segment_ids_json }}
        run: >-
          python scripts/run_historical_deep_segmented_replay.py
          --output artifacts/segments/pass-1
          --code-revision "${GITHUB_SHA}"
          --continuation-id "${{ inputs.continuation_id }}"
          segment-batch
          --inventory artifacts/inventory/replay-inventory.json
          --segment-ids-json "${SEGMENT_IDS_JSON}"
          --pass-id 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-deep-74b-${{ matrix.segment_batch.batch_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/segments/pass-1/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

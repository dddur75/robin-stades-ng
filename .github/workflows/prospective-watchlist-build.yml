name: "54 - Prospective Watchlist Build"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pattern-research-state
  cancel-in-progress: false

jobs:
  watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_FOOTBALL_CALLS_ALLOWED: "0"
      ODDS_API_CREDITS_ALLOWED: "0"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Construire seulement la preuve et le registre
        run: >-
          python scripts/run_deep_football.py all
          --state data/historical
          --output artifacts/prospective-watchlist
          --source-commit "$(git -C .historical-registry rev-parse HEAD)"
          --main-commit "${{ github.sha }}"
          --main-ci-run-id "${{ github.run_id }}"
      - name: Vérifier que le registre ne crée aucune décision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/prospective-watchlist")
          watchlist = json.loads(
              (root / "prospective-watchlist.json").read_text()
          )
          decision = json.loads(
              (root / "shadow-candidate-decision.json").read_text()
          )
          assert watchlist["count"] == 0
          assert watchlist["not_a_bet"] is True
          assert decision["candidate_count"] == 0
          assert decision["decisions"] == 0
          assert decision["stake_units"] == 0
          assert decision["shadow_bankroll_after"] == 1000.0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-watchlist-${{ github.run_id }}
          path: artifacts/prospective-watchlist
          retention-days: 90
          compression-level: 9

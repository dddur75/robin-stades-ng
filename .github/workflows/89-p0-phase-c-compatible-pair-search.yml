name: "89 - Phase C Compatible Pair Search"

on:
  workflow_dispatch:
    inputs:
      execution_sha:
        description: "Exact activated Phase C branch SHA"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: p0-phase-c-compatible-pair-search
  cancel-in-progress: false

env:
  PHASE_C_BRANCH: codex/hypothesis-tag-mask-pair-factory-v1
  SOURCE_RUN_ID: "30853757779"
  API_FOOTBALL_CALLS_ALLOWED: "0"
  ODDS_CREDITS_ALLOWED: "0"
  REMOTE_SQL_ALLOWED: "0"
  R2_GET_ALLOWED: "0"
  R2_LIST_ALLOWED: "0"
  R2_HEAD_ALLOWED: "0"
  R2_WRITES_ALLOWED: "0"
  R2_DELETES_ALLOWED: "0"
  TRIPLE_SEARCH_LOCKED: "true"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ inputs.execution_sha }}", fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - name: Require trusted-main activation and exact branch head
        env: {EXECUTION_SHA: "${{ inputs.execution_sha }}"}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXECUTION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${EXECUTION_SHA}"
          test "$(git ls-remote origin "refs/heads/${PHASE_C_BRANCH}" | cut -f1)" = "${EXECUTION_SHA}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path("configs/execution/phase-c-execution-activation-v1.json").read_text())
          if a["activation_status"]!="ACTIVE" or a["allowed_execution_sha"]!=os.environ["EXECUTION_SHA"]: raise SystemExit("PHASE_C_ACTIVATION_HOLD")
          l=json.loads(Path("configs/execution/p0-e3-artifact-lock-v1.json").read_text())
          if l["mission_source_bytes"]!=95006161 or len(l["artifacts"])!=5: raise SystemExit("SOURCE_LOCK_MISMATCH")
          PY
          unshare --user --map-root-user --net true
  search:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ inputs.execution_sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {github-token: "${{ github.token }}", repository: "${{ github.repository }}", run-id: "30853757779", artifact-ids: "8875626108,8875918562,8876203323,8875016575,8875329908", path: _phase_c/source}
      - name: Execute bounded pair campaign without egress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _phase_c/compatible-pair-search
          unshare --user --map-root-user --net -- python scripts/run_hypothesis_tag_mask_pair_factory.py pairs --source-root _phase_c/source --output-root _phase_c/compatible-pair-search --store-root "$RUNNER_TEMP/robin-phase-c-pairs" --skip-benchmark
          cp "$RUNNER_TEMP/robin-phase-c-pairs/checkpoint-v1.json" _phase_c/compatible-pair-search/checkpoint-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-c-compatible-pair-search-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _phase_c/compatible-pair-search/reports/hypothesis-research/pair-search-space-v1.json
            _phase_c/compatible-pair-search/reports/hypothesis-research/pair-results-v1.json
            _phase_c/compatible-pair-search/reports/hypothesis-research/pair-rankings-v1.json
            _phase_c/compatible-pair-search/reports/hypothesis-research/pair-clusters-v1.json
            _phase_c/compatible-pair-search/reports/hypothesis-research/pair-negative-controls-v1.json
            _phase_c/compatible-pair-search/reports/hypothesis-research/campaign-replay-v1.json
            _phase_c/compatible-pair-search/reports/hypothesis-research/campaign-costs-v1.json
            _phase_c/compatible-pair-search/checkpoint-v1.json
          if-no-files-found: error
          retention-days: 90

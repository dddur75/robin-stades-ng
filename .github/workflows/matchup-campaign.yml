name: "52 - Matchup Campaign"

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: "Campagne cache-only autorisée"
        type: choice
        options:
          - 11A
        default: 11A

permissions:
  contents: read

concurrency:
  group: pattern-research-state
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_FOOTBALL_CALLS_ALLOWED: "0"
      ODDS_API_CREDITS_ALLOWED: "0"
      STORAGE_PAUSED: "true"
      P3_P4_PAUSED: "true"
      PRODUCTION_LOCKED: "true"
      REAL_BETS: "false"
      NO_BET_DEFAULT: "true"
      SOCIAL_PUBLISHING_ENABLED: "false"
      DEMO_MODE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - uses: ./.github/actions/historical-state-restore
      - name: Exécuter la campagne primaire
        run: >-
          python scripts/run_deep_football.py all
          --state data/historical
          --output artifacts/matchup-campaign
          --source-commit "$(git -C .historical-registry rev-parse HEAD)"
          --main-commit "${{ github.sha }}"
          --main-ci-run-id "${{ github.run_id }}"
      - name: Rejouer sans fournisseur
        run: >-
          python scripts/run_deep_football.py all
          --state data/historical
          --output artifacts/matchup-campaign
          --source-commit "$(git -C .historical-registry rev-parse HEAD)"
          --main-commit "${{ github.sha }}"
          --main-ci-run-id "${{ github.run_id }}"
          --replay
      - name: Vérifier déterminisme et absence de coût
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          replay = json.loads(
              Path("artifacts/matchup-campaign/replay.json").read_text()
          )
          assert replay["identical"] is True
          assert replay["provider_calls"] == 0
          assert replay["odds_api_credits"] == 0
          assert replay["business_duplicates"] == 0
          assert replay["data_loss"] == 0
          assert replay["hash_mismatches"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: matchup-campaign-${{ github.run_id }}
          path: artifacts/matchup-campaign
          retention-days: 90
          compression-level: 9

version: shadow-v1
mode: SHADOW
real_bets_enabled: false
data_origin_policy:
  require_badge: true
  live: LIVE SOURCE
  demo: DEMO DATA
competitions:
  - name: Ligue 1
    the_odds_api_key: soccer_france_ligue_one
    api_football_id: 61
markets:
  - market_type: 1X2
    provider_market: h2h
    enabled: true
  - market_type: TOTAL_GOALS
    line_value: 2.5
    provider_market: totals
    enabled: true
  - market_type: BOTH_TEAMS_TO_SCORE
    provider_market: null
    enabled: false
    reason: non disponible dans l'endpoint groupé retenu
  - market_type: DOUBLE_CHANCE
    provider_market: null
    enabled: false
    reason: non disponible dans l'endpoint groupé retenu
collection_windows: [J-7, J-3, J-1, H-12, H-6, H-3, H-1, "H-0:30", "H-0:10"]
quality:
  maximum_odds_age_minutes: 75
  minimum_bookmakers: 2
  block_on_unresolved_fixture: true
  block_on_suspect_zero_feature: true
models: [elo-1.0, poisson-1.0, dixon-coles-1.0, consensus-1.0, market-baseline-1.0]
live_prediction_policy:
  allowed_model: MARKET_BASELINE_ONLY
  require_live_odds_snapshot: true
  use_legacy_history: false
  block_strategy_decision: true
strategies: [value-simple-1.0]
bankroll:
  currency: EUR
  fictive_initial: 1000
  max_stake: 10
  max_fixture_exposure_pct: 2
  max_daily_exposure_pct: 8
frequency:
  fixtures_cron: "17 4,16 * * *"
  odds_cron: "11 */3 * * *"
  pre_match_cron: "23 * * * *"
  settlement_cron: "41 5,17 * * *"
  health_cron: "53 6 * * *"
exclusions:
  - live_betting
  - real_money
  - uncertain_identity
  - stale_odds
  - missing_odds
  - quality_blocked
quota:
  provider_monthly_limit_observed: 20000
  monthly_operational_ceiling: 1000
  reserve_credits: 4000
  reserve_pct: 20
  credits_per_event_snapshot: 2
  forecast_monthly_credits: 720
  near_kickoff_reserved_credits: 80
  levels:
    conservative_at_forecast_pct: 80
    critical_when_usable_credits_lte: 80
persistence:
  backend: GITHUB_ARTIFACT_EXPLICIT_RESTORE
  durable_storage_required: true
  target_backend: POSTGRESQL
  bridge_backend: GIT_DATA_BRANCH
  data_branch: shadow-data
  bundle_format: json.gz
  raw_object_format: bin.gz
  append_only: true
  artifacts_role: EXECUTION_JOURNAL_AND_SHORT_RECOVERY
  canonical_artifact_prefix: shadow-state-
  copies_retained: 2
  retention_days: 30
  global_concurrency_group: shadow-state
scheduler:
  early_tolerance_minutes: 20
  recovery_margin_minutes: 120
  prioritize_nearest_fixture: true
  spread_cron_away_from_exact_hour: true
burn_in:
  technical: active
  coverage: active
  statistical_observation: descriptive_only
slo:
  workflow_success_rate: 0.95
  eligible_window_coverage: 0.90
  provenance_completeness: 1.0
  quota_reserve_pct: 0.20
  silent_data_loss: 0
  unresolved_business_duplicates: 0
  temporal_leaks: 0
  exposed_secrets: 0
  demo_as_live: 0
  decision_reason_coverage: 1.0
  rejection_code_coverage: 1.0
